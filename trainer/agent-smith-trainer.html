Error` pour\nécrire sur `stderr` et renvoyer 2, sinon `make_agent(args)`, `solve`, écriture du JSON, 0.\n"],"pieges":[{"titre":"Écrire `task_id` en entier (`7`) ou oublier de le convertir en chaîne : le schéma attend une\n`str`.\n","erreur":"1 validation error for SolutionOutput\ntask_id\n  Input should be a valid string [type=string_type, input_value=7, input_type=int]\n"},{"titre":"Mettre `\"success\": true` sans avoir fait passer le test caché : la moulinette relance tout.\n","erreur":"Correctness: FAILED\nOverall: FAILED\n"},{"titre":"Passer le modèle Pydantic à `json.dump` au lieu d'utiliser `model_dump` / `model_dump_json`.\n","erreur":"TypeError: Object of type SolutionOutput is not JSON serializable\n"},{"titre":"Compter les tokens de la dernière requête au lieu de la somme des `StepMetrics` : la limite\nest cumulée.\n","erreur":"Input tokens: 6120 / 6000 EXCEEDED\n"},{"titre":"Renvoyer deux fois le même code d'étape : l'observation n'a pas été réinjectée, ou le LLM\nest bloqué. La moulinette le signale.\n","erreur":"WARN: Steps 2 and 3: identical sandbox_input (copy-paste?)\n"}],"verification":{"consigne":"Copie `test_agent_mbpp.py` à côté de `models.py` et `agent_mbpp.py`, installe les dépendances\n(`uv add pydantic pytest`), puis lance la commande. Aucun réseau, aucune clé API : l'agent du\ntest est une doublure scriptée.\n","commande":"uv run pytest -q test_agent_mbpp.py\n","fichiers":[{"nom":"test_agent_mbpp.py","code":"\"\"\"Tests hors-ligne de l'exercice 09 — aucun réseau, aucune clé API.\"\"\"\nimport json\nfrom pathlib import Path\n\nimport pytest\n\nimport agent_mbpp\nfrom models import MBPPTaskInput, SolutionOutput, StepMetrics\n\nTASK_JSON = {\n    \"task_id\": 7,\n    \"task_definition\": \"Write a function to find the shared elements from two given tuples.\",\n    \"function_definition\": \"def similar_elements(test_tup1, test_tup2):\",\n    \"test_imports\": [\"from itertools import combinations\"],\n    \"test_list\": [\n        \"assert similar_elements((1, 2, 3), (1, 2, 4)) == (1, 2)\",\n        \"assert similar_elements((3, 4, 5), (4, 5, 6)) == (4, 5)\",\n    ],\n}\nGOOD_CODE = (\n    \"def similar_elements(test_tup1, test_tup2):\\n\"\n    \"    return tuple(set(test_tup1) & set(test_tup2))\"\n)\n\n\ndef _step(n: int = 1) -> StepMetrics:\n    return StepMetrics(\n        step=n,\n        input_tokens=100,\n        output_tokens=50,\n        request_time_ms=12.5,\n        api_url=\"https://fake.local/v1\",\n        model_name=\"fake/model\",\n        llm_output=\"Let's call run_tests first.\",\n        sandbox_input=\"result = run_tests(code, task.test_list)\",\n        sandbox_output='{\"success\": true, \"output\": \"\"}',\n        retries=0,\n    )\n\n\ndef _solution(**overrides) -> SolutionOutput:\n    data = {\n        \"task_id\": \"\",\n        \"benchmark\": \"\",\n        \"success\": True,\n        \"solution\": GOOD_CODE,\n        \"iterations\": 1,\n        \"total_requests\": 1,\n        \"total_input_tokens\": 100,\n        \"total_output_tokens\": 50,\n        \"total_time_seconds\": 1.0,\n        \"steps\": [_step(1)],\n        \"system_prompt\": \"\",\n        \"error\": None,\n    }\n    data.update(overrides)\n    return SolutionOutput(**data)\n\n\nclass FakeAgent:\n    \"\"\"Doublure de l'agent de l'exercice 03 : pas de LLM, pas de sandbox.\"\"\"\n\n    system_prompt = \"You are a code agent. Tools: run_tests, final_answer.\"\n\n    def __init__(self, result: SolutionOutput) -> None:\n        self.result = result\n        self.calls = []\n\n    def run(self, task: MBPPTaskInput) -> SolutionOutput:\n        self.calls.append(task)\n        return self.result\n\n\n@pytest.fixture\ndef task_file(tmp_path: Path) -> Path:\n    path = tmp_path / \"task.json\"\n    path.write_text(json.dumps(TASK_JSON), encoding=\"utf-8\")\n    return path\n\n\ndef test_load_task(task_file: Path) -> None:\n    task = agent_mbpp.load_task(task_file)\n    assert isinstance(task, MBPPTaskInput)\n    assert task.task_id == 7\n    assert len(task.test_list) == 2\n    with pytest.raises(FileNotFoundError):\n        agent_mbpp.load_task(task_file.parent / \"absent.json\")\n\n\ndef test_build_user_prompt(task_file: Path) -> None:\n    task = agent_mbpp.load_task(task_file)\n    prompt = agent_mbpp.build_user_prompt(task)\n    assert TASK_JSON[\"task_definition\"] in prompt\n    assert TASK_JSON[\"function_definition\"] in prompt\n    for assertion in TASK_JSON[\"test_list\"]:\n        assert assertion in prompt\n    assert \"run_tests\" in prompt\n    assert \"final_answer\" in prompt\n\n\ndef test_solve_normalise(task_file: Path) -> None:\n    task = agent_mbpp.load_task(task_file)\n    agent = FakeAgent(_solution(solution=\"  \" + GOOD_CODE + \"  \"))\n    out = agent_mbpp.solve(task, agent)\n    assert isinstance(out, SolutionOutput)\n    assert agent.calls == [task]\n    assert out.benchmark == \"mbpp\"\n    assert out.task_id == \"7\"\n    assert out.solution == GOOD_CODE\n    assert out.system_prompt == FakeAgent.system_prompt\n    assert out.iterations == 1\n    assert out.success is True\n\n\ndef test_check_limits() -> None:\n    ok = _solution(\n        iterations=10,\n        total_input_tokens=6_000,\n        total_output_tokens=1_500,\n        total_time_seconds=120.0,\n    )\n    assert agent_mbpp.check_limits(ok) == []\n    too_much = _solution(\n        iterations=11,\n        total_input_tokens=6_120,\n        total_output_tokens=1_501,\n        total_time_seconds=120.5,\n    )\n    problems = agent_mbpp.check_limits(too_much)\n    assert len(problems) == 4\n    assert any(\"iterations\" in p for p in problems)\n    assert any(\"6000\" in p or \"6 000\" in p for p in problems)\n\n\ndef test_solve_limites_depassees(task_file: Path) -> None:\n    task = agent_mbpp.load_task(task_file)\n    agent = FakeAgent(_solution(iterations=11))\n    out = agent_mbpp.solve(task, agent)\n    assert out.success is False\n    assert out.error is not None\n    assert \"iterations\" in out.error\n    assert out.benchmark == \"mbpp\"\n    assert out.task_id == \"7\"\n\n\ndef test_cli_ecrit_solution(task_file: Path, tmp_path: Path, monkeypatch) -> None:\n    output = tmp_path / \"solution.json\"\n    agent = FakeAgent(_solution())\n    monkeypatch.setattr(agent_mbpp, \"make_agent\", lambda args: agent)\n    code = agent_mbpp.main(\n        [\n            \"--task-file\", str(task_file),\n            \"--output\", str(output),\n            \"--model-name\", \"fake/model\",\n            \"--provider-url\", \"https://fake.local/v1\",\n        ]\n    )\n    assert code == 0\n    data = json.loads(output.read_text(encoding=\"utf-8\"))\n    solution = SolutionOutput.model_validate(data)\n    assert solution.benchmark == \"mbpp\"\n    assert solution.task_id == \"7\"\n    assert solution.system_prompt\n"}],"sortie":"6 passed\n"},"bonus":"Journalise chaque pas dans un JSONL (`step`, `input_tokens`, `request_time_ms`, `retries`) et\ntrace le cumul pour voir où part le budget. Rejoue la même tâche avec un second modèle et\ncompare le nombre d'itérations avant le premier `run_tests` vert. Enfin, teste un modèle de\nraisonnement : ses tokens de réflexion comptent aussi dans la limite de 6 000.\n","lienProjet":"C'est la boucle complète de la section 4.3 : `MBPPTaskInput`, outil `run_tests`, `final_answer`\net `solution.json` au format `StepMetrics`/`SolutionOutput`. En soutenance, on te fera modifier\ncet agent à la volée puis le relancer sur une tâche MBPP pour vérifier que les données du\n`solution.json` viennent d'une vraie exécution. L'examen final tire 5 tâches et exige 4 réussites\n(sections 5.1.1 et 5.2).\n"},{"id":10,"bloc":"D","titre":"Agent SWE-bench, Docker et rapport de benchmark","niveau":5,"duree":"3 h","notions":["SWEBenchTaskInput","cycle de vie Docker","TESTBED_PATH","get_patch et git diff","tests partiels","limites : 30 / 300 000 / 10 000 / 900 s","BENCHMARK_REPORT.md","nettoyage sur SIGTERM"],"objectif":"Piloter un conteneur SWE-bench depuis ton agent : pull, start, exec, récupération du patch\net cleanup même sur SIGTERM, dans les limites 30 itérations / 300 000 tokens d'entrée /\n10 000 de sortie / 900 s. Puis produire un `BENCHMARK_REPORT.md` crédible (5 modèles,\n2 fournisseurs, 3 tâches, fiabilité, métriques intermédiaires, ablation) et un README anglais.\n","cours":"## De MBPP à SWE-bench\n\nMBPP demande une fonction ; SWE-bench demande de **réparer un dépôt réel**. La moulinette\nfournit une instance (`instance_id`), le texte de l'issue (`problem_statement`), l'image\nDocker du dépôt (`docker_image`) et son script d'évaluation (`eval_script`). Ta sortie n'est\nplus du code : c'est un **patch git** qui doit faire passer les tests.\n\n~~~json swebench_task.json\n{\n  \"instance_id\": \"sympy__sympy-23534\",\n  \"problem_statement\": \"symbols() with duplicate names returns a wrong result\",\n  \"docker_image\": \"swebench/sweb.eval.x86_64.sympy_1776_sympy-23534:latest\",\n  \"eval_script\": \"python -m pytest -q sympy/core/tests/test_symbol.py\"\n}\n~~~\n\n`SWEBenchTaskInput` reprend ces champs ; la sortie reste `SolutionOutput`\n(`benchmark=\"swebench\"`, `solution` = patch) avec les mêmes `StepMetrics` : la trace\n`llm_output` / `sandbox_input` / `sandbox_output` prouve l'exploration réelle.\n\n## Le cycle de vie Docker\n\nUn conteneur se pilote en cinq temps, tous testables avec un backend factice.\n\n| Méthode | Commande | Attendu |\n|---|---|---|\n| `pull()` | `docker pull <image>` | image locale |\n| `start()` | `docker run -d --network none <image> sleep infinity` | id du conteneur |\n| `exec(command, workdir)` | `docker exec -w <workdir> <id> bash -lc <command>` | code retour, stdout, stderr |\n| `run_eval(eval_script)` | `exec` du script d'évaluation | code retour de l'évaluation |\n| `cleanup()` | `docker rm -f <id>` | idempotent, même après erreur |\n\n`TESTBED_PATH` vaut `/testbed` : la racine du dépôt **dans** l'image ; sans `-w /testbed`,\ntes commandes ne partent pas du dépôt. Chaque appel porte le **budget restant**\n(`min(remaining(), timeout)`), sinon un `exec` bloqué fait exploser les 900 s.\n\n## Le patch : get_patch et les tests partiels\n\n`get_patch()` est la **soumission** : `git -c core.fileMode=false diff` exécuté dans\n`TESTBED_PATH` renvoie le diff brut (`\"\"` si propre). Sans `core.fileMode=false`, un `chmod`\najoute des lignes `old mode` / `new mode` et le patch ne s'applique plus.\n\nL'`eval_script` échoue au début, puis le nombre d'échecs baisse : c'est ton **test partiel**\n(« à quel pas les échecs diminuent pour la première fois »). Ne récupère jamais la solution\ndans une PR ou un patch mémorisé : la section 5.4.1 sanctionne le lookup d'un zéro.\n\n## Les limites dures (section 5.1.2)\n\n| Métrique | Limite SWE-bench |\n|---|---|\n| itérations | 30 |\n| tokens d'entrée | 300 000 |\n| tokens de sortie | 10 000 |\n| temps | 900 s |\n\nLes tokens sont **cumulés** sur toute la tâche, raisonnement compris. Le timeout est\n**appliqué** : SIGTERM puis SIGKILL, donc branche un handler SIGTERM / SIGINT qui nettoie\npuis sort avec `128 + signum`. `cleanup()` est idempotent (handler, `atexit`, fin normale).\n\n## Le rapport BENCHMARK_REPORT.md (section 4.7)\n\nLe rapport est une **mesure** : ≥5 modèles, 2 fournisseurs et les mêmes 3 tâches, un tableau\npar couple modèle × tâche (pass/fail, itérations, tokens d'entrée, tokens de sortie, temps),\nla fiabilité (temps de réponse moyen, retries, disponibilité), ≥2 métriques intermédiaires et\nune ablation avant/après. Garde les `solution.json`.\n\n~~~Markdown BENCHMARK_REPORT.md (extrait)\n## Setup\n| Model | Provider |\n## Results\n| Model | Task | Pass/Fail | Iterations | Input tokens | Output tokens | Time (s) |\n|---|---|---|---|---|---|---|\n## Provider reliability\nAverage response time: 2.4 s. Retries: 7.\n## Intermediary metrics\n- Step at which the agent first edits the final patch file.\n## Ablation study\nSame model, same tasks, prompt before / after.\n~~~\n\n`validate_report(markdown)` applique cette checklist et renvoie les manques (`[]` si tout\nest là). Les sections sont reconnues par un titre `##` contenant `setup`, `results`,\n`reliab`, `intermediary metrics`, `ablation` ; chaque message contient le mot du manque :\n`modèle`, `fournisseur`, `tâche`, `fiabilité`, `métrique`, `ablation`, `section`.\n\n## README et sécurité IA (chapitres 6-7)\n\n`README.md` en anglais à la racine : première ligne en italique avec les logins 42, puis\n`Description`, `Instructions`, `Resources` (dont l'usage de l'IA), `System architecture`,\n`Agent loop`, `Sandbox design`, `Tool implementation`, `Benchmark results`.\n","enonce":"1. Crée `ex10` (`uv init --python 3.10 ex10`, `uv add pydantic pytest`) et copie les deux\n   squelettes : `docker_runner.py` et `agent_swebench.py`.\n2. Garde `CommandResult`, `DockerBackend` (Protocol) et `CliDockerBackend` :\n   `subprocess.run([\"docker\", *args], capture_output=True, text=True, timeout=...)` ;\n   `TimeoutExpired` devient `CommandResult(124, ...)`.\n3. `remaining()` = `max(0.0, deadline - monotonic)` ; `pull()` = `[\"pull\", image]` ;\n   `start()` = `[\"run\", \"-d\", \"--network\", \"none\", image, \"sleep\", \"infinity\"]`, renvoie\n   `stdout.strip()`, `RuntimeError` si le code retour n'est pas 0.\n4. `exec(command, workdir=TESTBED_PATH, timeout=None)` : `RuntimeError` sans conteneur,\n   `effective = min(remaining(), timeout)` (ou `remaining()` si `None`), `TimeoutError` si\n   `effective <= 0`, argv `[\"exec\", \"-w\", workdir, id, \"bash\", \"-lc\", command]`.\n5. `run_eval(eval_script)` délègue à `exec` avec le budget restant ; `get_patch()` exécute\n   `git -c core.fileMode=false diff` dans `TESTBED_PATH` et renvoie `stdout` tel quel.\n6. `cleanup()` = un seul `[\"rm\", \"-f\", id]` puis oublie l'id ; `handle_signal` nettoie et\n   lève `SystemExit(128 + signum)` ; `install_signal_handlers()` branche SIGTERM et SIGINT.\n7. `load_task(path)` valide en `SWEBenchTaskInput` (`FileNotFoundError` naturelle) ;\n   `check_limits(sol)` renvoie un message par dépassement (bornes exactes acceptées).\n8. `solve(task, agent)` : `agent.run(task)`, normalisation (`benchmark=\"swebench\"`,\n   `task_id=instance_id`, `system_prompt`, patch `strip()`), copie `success=False` + `error`\n   si une limite casse.\n9. `validate_report(markdown)` : checklist du cours et un message par manque, `[]` si tout\n   est là (sections, ≥5 modèles, ≥2 fournisseurs, ≥3 tâches, colonnes, fiabilité, ≥2\n   métriques intermédiaires, ablation).\n10. `main(argv)` : `--task-file --output --model-name --provider-url`, `solve`, écrit\n    `solution.json` via `model_dump_json(indent=2)`, retour 0 ; fichier absent → `stderr` + 2.\n11. Écris `BENCHMARK_REPORT.md` et le `README.md` anglais (structure/checklist) ; le\n    test valide un rapport **simulé**. Les vrais runs (5 modèles × 2 fournisseurs ×\n    3 tâches, clés et Docker réels) sont un bonus de soutenance, hors auto-vérification.\n    Termine par `uv run pytest -q test_swebench.py` → `7 passed`.\n\nCas limites : diff vide → `\"\"` ; budget épuisé → `TimeoutError` ; `cleanup()` deux fois →\nun seul `docker rm` ; `exec` sans `start()` → `RuntimeError` ; `eval_script` en échec →\n`returncode` renvoyé sans exception ; bornes exactes (30 / 300 000 / 10 000 / 900.0) et\nrapport pile 5 modèles / 2 fournisseurs / 3 tâches → valides.\n","depart":[{"fichier":"docker_runner.py","code":"\"\"\"Exécuteur Docker minimal pour SWE-bench (exercice 10).\n\nCycle de vie : pull -> start -> exec / run_eval -> get_patch -> cleanup.\nLe backend est injectable : les tests remplacent le CLI docker par une doublure.\n\"\"\"\nfrom __future__ import annotations\n\nimport atexit\nimport signal\nimport subprocess\nimport time\nfrom dataclasses import dataclass\nfrom typing import Protocol\n\nTESTBED_PATH = \"/testbed\"\nDEFAULT_TIMEOUT_S = 900.0\n\n\n@dataclass\nclass CommandResult:\n    \"\"\"Résultat d'une commande docker (plus simple qu'un CompletedProcess).\"\"\"\n\n    returncode: int\n    stdout: str = \"\"\n    stderr: str = \"\"\n\n\nclass DockerBackend(Protocol):\n    \"\"\"Interface minimale d'un backend Docker (CLI réel ou doublure de test).\"\"\"\n\n    def run(self, args: list[str], timeout: float | None = None) -> CommandResult:\n        ...\n\n\nclass CliDockerBackend:\n    \"\"\"Backend réel : lance le binaire `docker` (hors tests).\"\"\"\n\n    def run(self, args: list[str], timeout: float | None = None) -> CommandResult:\n        try:\n            proc = subprocess.run(\n                [\"docker\", *args], capture_output=True, text=True, timeout=timeout\n            )\n        except subprocess.TimeoutExpired as exc:\n            return CommandResult(returncode=124, stdout=exc.stdout or \"\", stderr=\"timeout\")\n        return CommandResult(proc.returncode, proc.stdout, proc.stderr)\n\n\nclass DockerRunner:\n    \"\"\"Pilote un conteneur SWE-bench et garantit son nettoyage.\"\"\"\n\n    def __init__(\n        self,\n        image: str,\n        backend: DockerBackend | None = None,\n        timeout_s: float = DEFAULT_TIMEOUT_S,\n    ) -> None:\n        self.image = image\n        self.backend: DockerBackend = backend or CliDockerBackend()\n        self.timeout_s = timeout_s\n        self.deadline = time.monotonic() + timeout_s\n        self.container_id: str | None = None\n        atexit.register(self.cleanup)\n\n    def remaining(self) -> float:\n        \"\"\"Secondes restantes avant le timeout dur (0.0 si épuisé).\"\"\"\n        # TODO: max(0.0, self.deadline - time.monotonic())\n        raise NotImplementedError\n\n    def pull(self) -> CommandResult:\n        \"\"\"Télécharge l'image : `docker pull <image>`.\"\"\"\n        # TODO: backend.run([\"pull\", self.image], timeout=self.remaining())\n        raise NotImplementedError\n\n    def start(self) -> str:\n        \"\"\"Démarre le conteneur et renvoie son id.\"\"\"\n        # TODO: argv [\"run\", \"-d\", \"--network\", \"none\", image, \"sleep\", \"infinity\"] ;\n        #       RuntimeError si le code retour n'est pas 0 ; stocke stdout.strip().\n        raise NotImplementedError\n\n    def exec(\n        self,\n        command: str,\n        workdir: str = TESTBED_PATH,\n        timeout: float | None = None,\n    ) -> CommandResult:\n        \"\"\"Exécute une commande dans le conteneur, avec le timeout effectif.\"\"\"\n        # TODO: RuntimeError sans conteneur ; effective = min(remaining(), timeout)\n        #       (ou remaining() si timeout est None) ; TimeoutError si effective <= 0 ;\n        #       argv [\"exec\", \"-w\", workdir, self.container_id, \"bash\", \"-lc\", command].\n        raise NotImplementedError\n\n    def run_eval(self, eval_script: str) -> CommandResult:\n        \"\"\"Exécute le script d'évaluation de la tâche dans le testbed.\"\"\"\n        # TODO: délègue à exec(eval_script, TESTBED_PATH) en gardant le budget restant.\n        raise NotImplementedError\n\n    def get_patch(self) -> str:\n        \"\"\"Renvoie le diff git brut des modifications du testbed (\"\" si propre).\"\"\"\n        # TODO: exec(\"git -c core.fileMode=false diff\", TESTBED_PATH), renvoie stdout.\n        raise NotImplementedError\n\n    def cleanup(self) -> None:\n        \"\"\"Supprime le conteneur ; idempotent, appelable depuis un handler de signal.\"\"\"\n        # TODO: si container_id : backend.run([\"rm\", \"-f\", id]) puis oublier l'id.\n        raise NotImplementedError\n\n    def handle_signal(self, signum: int, frame: object) -> None:\n        \"\"\"Nettoie puis sort avec le code 128 + signum.\"\"\"\n        # TODO: self.cleanup() puis raise SystemExit(128 + signum).\n        raise NotImplementedError\n\n    def install_signal_handlers(self) -> None:\n        \"\"\"Branche handle_signal sur SIGTERM et SIGINT (à appeler dans main).\"\"\"\n        # TODO: signal.signal(...) pour SIGTERM et SIGINT ;\n        #       ignorer ValueError hors thread principal.\n        raise NotImplementedError\n"},{"fichier":"agent_swebench.py","code":"\"\"\"Agent SWE-bench : tâche, limites et rapport (exercice 10).\n\nLes modèles Pydantic sont fournis tels quels : c'est le contrat de la moulinette.\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom datetime import datetime\nfrom pathlib import Path\nfrom typing import List, Optional, Protocol\n\nfrom pydantic import BaseModel, Field\n\nMAX_ITERATIONS = 30\nMAX_INPUT_TOKENS = 300_000\nMAX_OUTPUT_TOKENS = 10_000\nMAX_TIME_SECONDS = 900.0\n\n\nclass StepMetrics(BaseModel):\n    \"\"\"Métriques d'un pas (une requête LLM + une exécution sandbox).\"\"\"\n\n    step: int = Field(..., description=\"1-indexed iteration number\")\n    input_tokens: int\n    output_tokens: int\n    request_time_ms: float\n    timestamp: str = Field(default_factory=lambda: datetime.now().isoformat())\n    api_url: str = Field(default=\"\")\n    model_name: str = Field(default=\"\")\n    llm_output: str = Field(default=\"\")\n    sandbox_input: str = Field(default=\"\")\n    sandbox_output: str = Field(default=\"\")\n    retries: int = Field(default=0)\n\n\nclass SolutionOutput(BaseModel):\n    \"\"\"Sortie exigée par la moulinette (solution.json).\"\"\"\n\n    task_id: str\n    benchmark: str\n    success: bool\n    solution: str\n    iterations: int\n    total_requests: int\n    total_input_tokens: int\n    total_output_tokens: int\n    total_time_seconds: float\n    steps: List[StepMetrics] = Field(default_factory=list)\n    system_prompt: str = Field(default=\"\")\n    error: Optional[str] = Field(default=None)\n    timestamp: str = Field(default_factory=lambda: datetime.now().isoformat())\n\n\nclass SWEBenchTaskInput(BaseModel):\n    \"\"\"Entrée d'une tâche SWE-bench, fournie par la moulinette.\"\"\"\n\n    instance_id: str = Field(..., description=\"ex: 'sympy__sympy-23534'\")\n    problem_statement: str = Field(..., description=\"description de l'issue GitHub\")\n    docker_image: str = Field(..., description=\"image complète à pull\")\n    eval_script: str = Field(..., description=\"script bash d'évaluation du patch\")\n    hints_text: str = Field(default=\"\")\n    repo: str = Field(default=\"\")\n\n\nclass AgentLike(Protocol):\n    \"\"\"Interface minimale attendue : ton agent de l'exercice 03.\"\"\"\n\n    system_prompt: str\n\n    def run(self, task: SWEBenchTaskInput) -> SolutionOutput:\n        \"\"\"Fait tourner la boucle et renvoie une SolutionOutput brute.\"\"\"\n\n\ndef load_task(path: str | Path) -> SWEBenchTaskInput:\n    \"\"\"Charge et valide la tâche SWE-bench depuis un fichier JSON.\"\"\"\n    # TODO: Path(path).read_text(encoding=\"utf-8\") + SWEBenchTaskInput.model_validate_json\n    raise NotImplementedError\n\n\ndef check_limits(sol: SolutionOutput) -> list[str]:\n    \"\"\"Renvoie un message par limite dépassée ([] si tout tient).\"\"\"\n    # TODO: comparer aux quatre constantes, bornes incluses (30 / 300 000 / 10 000 / 900.0) ;\n    #       message contenant le nom du champ et la limite.\n    raise NotImplementedError\n\n\ndef validate_report(markdown: str) -> list[str]:\n    \"\"\"Vérifie la checklist de BENCHMARK_REPORT.md ; renvoie les manques, [] si complet.\"\"\"\n    # TODO: sections ## setup/results/reliab/intermediary metrics/ablation ;\n    #       setup : tableau model/provider (>=5 modèles, >=2 fournisseurs) ;\n    #       results : colonnes model/task/pass/iteration/input/output/time, >=3 tâches ;\n    #       reliab : \"retries\" + \"response time\" ; intermediary : >=2 puces ;\n    #       ablation : section non vide ; chaque message contient le mot du manque.\n    raise NotImplementedError\n\n\ndef solve(task: SWEBenchTaskInput, agent: AgentLike) -> SolutionOutput:\n    \"\"\"Exécute l'agent puis normalise la SolutionOutput pour SWE-bench.\"\"\"\n    # TODO: agent.run(task), normalisation (benchmark=\"swebench\", task_id=instance_id,\n    #       solution=patch.strip(), system_prompt), check_limits, success=False + error.\n    raise NotImplementedError\n\n\ndef make_agent(args: argparse.Namespace) -> AgentLike:\n    \"\"\"Instancie ton agent (LLM + sandbox + outils) depuis les options du CLI.\"\"\"\n    # TODO: clés API via os.environ, jamais en dur\n    raise NotImplementedError\n\n\ndef main(argv: list[str] | None = None) -> int:\n    \"\"\"CLI : --task-file --output --model-name --provider-url.\"\"\"\n    # TODO: argparse, load_task, make_agent, solve, écriture solution.json, codes retour\n    raise NotImplementedError\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"}],"indices":["Commence par le cycle de vie et sa doublure : écris la liste des commandes attendues\n(pull, run, exec, rm), puis le squelette de rapport sous forme de checklist. Les sept\ntests échouent tant que les TODO lèvent `NotImplementedError` : c'est normal.\n","`subprocess.run([\"docker\", *args], capture_output=True, text=True, timeout=...)`,\n`dataclasses.dataclass`, `time.monotonic`, `atexit`, `signal.signal`, Pydantic\n(`model_validate_json`, `model_copy`, `model_dump_json`), et pour le rapport :\n`splitlines`, `startswith(\"## \")`, découpage des lignes `|`, `re.sub`.\n","`remaining = max(0, deadline - monotonic)`. `pull` : `[\"pull\", image]`. `start` :\n`run -d --network none image sleep infinity`, id = `stdout.strip()`, RuntimeError si\ncode retour non nul. `exec` : RuntimeError sans conteneur, `effective = min(remaining,\ntimeout)` (`remaining` si timeout est None), TimeoutError si `effective <= 0`, argv\n`[\"exec\", \"-w\", workdir, id, \"bash\", \"-lc\", command]`, puis `backend.run(args,\ntimeout=effective)`. `run_eval` : `exec(eval_script, TESTBED_PATH)`. `get_patch` :\n`exec(\"git -c core.fileMode=false diff\", TESTBED_PATH)`, renvoie stdout. `cleanup` :\nun seul `rm -f` puis id à None. `handle_signal` : cleanup puis\n`SystemExit(128 + signum)`. `check_limits` : quatre comparaisons, un message par\ndépassement. `validate_report` : découpe en sections par lignes « ## », vérifie les\ncinq sections, lit le premier tableau de chaque section (en-tête puis lignes `|`),\ncompte les valeurs distinctes, renvoie un message par manque.\n"],"pieges":[{"titre":"Conteneur qui fuit : `cleanup()` oublié, non idempotent, ou jamais appelé sur SIGTERM.\n","erreur":"$ docker ps -q --filter ancestor=swebench/sweb.eval.x86_64.sympy_1776_sympy-23534:latest\nabc123\ncontainer cleanup: FAILED\n"},{"titre":"`git diff` lancé sans `workdir` : la commande ne part pas du testbed et échoue.\n","erreur":"fatal: not a git repository (or any of the parent directories): .git\n"},{"titre":"Timeout non propagé : `subprocess.run` sans `timeout` et `docker exec` bloqué.\n","erreur":"subprocess.TimeoutExpired: Command '['docker', 'exec', '-w', '/testbed', 'abc123', 'bash', '-lc', 'python -m pytest -q']' timed out after 900.0 seconds\n"},{"titre":"`git diff` sans `core.fileMode=false` : un `chmod` pollue le patch.\n","erreur":"old mode 100644\nnew mode 100755\nerror: patch failed: sympy/core/symbol.py:1\n"},{"titre":"Métriques inventées ou rapport sans ablation : la checklist refuse le rapport.\n","erreur":"moins de 5 modèles distincts (3)\nsection ablation absente\n"}],"verification":{"consigne":"Dans un dossier `ex10`, copie `docker_runner.py`, `agent_swebench.py` et\n`test_swebench.py`. Installe les dépendances (`uv add pydantic pytest`) puis lance la\ncommande. Tout est hors-ligne : le backend Docker du test est une doublure, aucun\nconteneur n'est créé, aucune clé API n'est lue.\n","commande":"cd ex10\n# dépendances déjà ajoutées à l'étape 1 : uv add pydantic pytest\n# copie docker_runner.py, agent_swebench.py et test_swebench.py ici\nuv run pytest -q test_swebench.py\n","fichiers":[{"nom":"test_swebench.py","code":"\"\"\"Auto-vérification de l'exercice 10 — Docker mocké, hors ligne, sans clé.\"\"\"\nimport json\nimport re\nimport signal\nimport time\nfrom pathlib import Path\n\nimport pytest\n\nimport agent_swebench\nfrom agent_swebench import SWEBenchTaskInput, SolutionOutput, StepMetrics\nfrom docker_runner import TESTBED_PATH, CommandResult, DockerRunner\n\nIMAGE = \"swebench/sweb.eval.x86_64.sympy_1776_sympy-23534:latest\"\nTASK_JSON = {\n    \"instance_id\": \"sympy__sympy-23534\",\n    \"problem_statement\": \"symbols() with duplicate names returns a wrong result\",\n    \"docker_image\": IMAGE,\n    \"eval_script\": \"python -m pytest -q sympy/core/tests/test_symbol.py\",\n    \"hints_text\": \"\",\n    \"repo\": \"sympy/sympy\",\n}\nPATCH = (\n    \"diff --git a/sympy/core/symbol.py b/sympy/core/symbol.py\\n\"\n    \"index 1111111..2222222 100644\\n\"\n    \"--- a/sympy/core/symbol.py\\n\"\n    \"+++ b/sympy/core/symbol.py\\n\"\n    \"@@ -1,3 +1,3 @@\\n\"\n    \"-def symbols(names):\\n\"\n    \"+def symbols(names, **assumptions):\\n\"\n    \"     return None\\n\"\n)\nGOOD_REPORT = \"\"\"\n## Setup\n\n| Model | Provider |\n|---|---|\n| model-a | provider-a |\n| model-b | provider-a |\n| model-c | provider-b |\n| model-d | provider-b |\n| model-e | provider-b |\n\nTasks: sympy__sympy-23534, sympy__sympy-14711, pydata__xarray-4629.\n\n## Results\n\n| Model | Task | Pass/Fail | Iterations | Input tokens | Output tokens | Time (s) |\n|---|---|---|---|---|---|---|\n| model-a | sympy__sympy-23534 | pass | 12 | 154000 | 4200 | 240 |\n| model-b | sympy__sympy-14711 | fail | 30 | 299500 | 9800 | 880 |\n| model-c | pydata__xarray-4629 | pass | 8 | 90000 | 2100 | 160 |\n\n## Provider reliability\n\nAverage response time per request: 2.4 s. Retries: 7 (rate limits, timeouts).\n\n## Intermediary metrics\n\n- Step at which the agent first edits the file of the final patch: 6.\n- Iterations between first green tests and final_answer: 2.\n\n## Ablation study\n\nBefore: prompt without the test summary. After: with the summary, 2/3 tasks pass.\n\n## Conclusions\n\nWe keep model-c; model-e is reliable but too slow.\n\"\"\"\nBAD_REPORT = \"\"\"\n## Setup\n\n| Model | Provider |\n|---|---|\n| model-a | provider-a |\n| model-b | provider-a |\n| model-c | provider-a |\n\n## Results\n\n| Model | Task | Pass/Fail | Iterations | Input tokens | Output tokens | Time (s) |\n|---|---|---|---|---|---|---|\n| model-a | sympy__sympy-23534 | pass | 10 | 100000 | 5000 | 200 |\n| model-b | sympy__sympy-23534 | fail | 30 | 300000 | 10000 | 890 |\n\n## Provider reliability\n\nAverage response time per request: 3.1 s. Retries: 2.\n\n## Intermediary metrics\n\n- Step at which the agent first edits the file of the final patch: 7.\n\"\"\"\n\n\nclass FakeBackend:\n    \"\"\"Doublure du CLI docker : aucune commande réelle, aucun conteneur.\"\"\"\n\n    def __init__(self) -> None:\n        self.calls = []\n        self.patch = PATCH\n        self.eval_result = CommandResult(0, \"3 passed\\n\", \"\")\n\n    def run(self, args, timeout=None):\n        self.calls.append((args, timeout))\n        if args[0] == \"pull\":\n            return CommandResult(0, \"pulled\\n\", \"\")\n        if args[0] == \"run\":\n            return CommandResult(0, \"abc123\\n\", \"\")\n        if args[0] == \"exec\" and \"git -c core.fileMode=false diff\" in args:\n            return CommandResult(0, self.patch, \"\")\n        if args[0] == \"exec\":\n            return self.eval_result\n        return CommandResult(0, \"\", \"\")\n\n\n@pytest.fixture\ndef runner():\n    return DockerRunner(IMAGE, backend=FakeBackend(), timeout_s=900.0)\n\n\n@pytest.fixture\ndef task_file(tmp_path: Path) -> Path:\n    path = tmp_path / \"swebench_task.json\"\n    path.write_text(json.dumps(TASK_JSON), encoding=\"utf-8\")\n    return path\n\n\ndef _step(n: int = 1) -> StepMetrics:\n    return StepMetrics(\n        step=n,\n        input_tokens=1000,\n        output_tokens=100,\n        request_time_ms=50.0,\n        api_url=\"https://fake.local/v1\",\n        model_name=\"fake/model\",\n        llm_output=\"I'll read the file first.\",\n        sandbox_input=\"result = read_file('/testbed/sympy/core/symbol.py')\",\n        sandbox_output=\"def symbols(names): ...\",\n        retries=0,\n    )\n\n\ndef _solution(**overrides) -> SolutionOutput:\n    data = {\n        \"task_id\": \"sympy__sympy-23534\",\n        \"benchmark\": \"\",\n        \"success\": True,\n        \"solution\": PATCH,\n        \"iterations\": 1,\n        \"total_requests\": 1,\n        \"total_input_tokens\": 1000,\n        \"total_output_tokens\": 100,\n        \"total_time_seconds\": 1.0,\n        \"steps\": [_step(1)],\n        \"system_prompt\": \"\",\n        \"error\": None,\n    }\n    data.update(overrides)\n    return SolutionOutput(**data)\n\n\ndef test_load_task(task_file: Path) -> None:\n    task = agent_swebench.load_task(task_file)\n    assert isinstance(task, SWEBenchTaskInput)\n    assert task.instance_id == \"sympy__sympy-23534\"\n    assert task.docker_image == IMAGE\n    assert task.eval_script.endswith(\"test_symbol.py\")\n    assert task.repo == \"sympy/sympy\"\n    with pytest.raises(FileNotFoundError):\n        agent_swebench.load_task(task_file.parent / \"absent.json\")\n\n\ndef test_cycle_de_vie(runner) -> None:\n    backend = runner.backend\n    assert runner.pull().returncode == 0\n    assert backend.calls[-1][0] == [\"pull\", IMAGE]\n    assert runner.start() == \"abc123\"\n    assert backend.calls[-1][0][0] == \"run\"\n    assert \"-d\" in backend.calls[-1][0]\n    assert IMAGE in backend.calls[-1][0]\n    result = runner.exec(\"echo hi\")\n    assert isinstance(result, CommandResult)\n    assert result.stdout == \"3 passed\\n\"\n    eval_result = runner.run_eval(TASK_JSON[\"eval_script\"])\n    assert eval_result.stdout == \"3 passed\\n\"\n    assert TASK_JSON[\"eval_script\"] in backend.calls[-1][0]\n    kinds = [args[0] for args, _ in backend.calls]\n    assert kinds[:2] == [\"pull\", \"run\"]\n    runner.cleanup()\n    assert backend.calls[-1][0] == [\"rm\", \"-f\", \"abc123\"]\n    assert runner.container_id is None\n    with pytest.raises(RuntimeError):\n        runner.exec(\"echo hi\")\n\n\ndef test_timeout_propage(runner) -> None:\n    backend = runner.backend\n    runner.start()\n    runner.exec(\"pytest -q\", timeout=30.0)\n    args, timeout = backend.calls[-1]\n    assert args[0] == \"exec\"\n    assert args[args.index(\"-w\") + 1] == TESTBED_PATH\n    assert \"pytest -q\" in args\n    assert timeout is not None\n    assert 0 < timeout <= 30.0\n    runner.deadline = time.monotonic() - 1.0\n    assert runner.remaining() == 0.0\n    with pytest.raises(TimeoutError):\n        runner.exec(\"pytest -q\")\n\n\ndef test_get_patch(runner) -> None:\n    backend = runner.backend\n    runner.start()\n    assert runner.get_patch() == PATCH\n    args, _ = backend.calls[-1]\n    assert \"git -c core.fileMode=false diff\" in args\n    assert args[args.index(\"-w\") + 1] == TESTBED_PATH\n    backend.patch = \"\"\n    assert runner.get_patch() == \"\"\n\n\ndef test_cleanup_idempotent_et_signal(runner) -> None:\n    backend = runner.backend\n    runner.start()\n    calls_before = len(backend.calls)\n    runner.cleanup()\n    runner.cleanup()\n    assert len(backend.calls) == calls_before + 1\n    assert backend.calls[-1][0] == [\"rm\", \"-f\", \"abc123\"]\n    other = DockerRunner(IMAGE, backend=FakeBackend())\n    other.start()\n    with pytest.raises(SystemExit) as excinfo:\n        other.handle_signal(signal.SIGTERM, None)\n    assert excinfo.value.code == 128 + signal.SIGTERM\n    assert other.backend.calls[-1][0] == [\"rm\", \"-f\", \"abc123\"]\n    assert other.container_id is None\n    empty = DockerRunner(IMAGE, backend=FakeBackend())\n    empty.cleanup()\n    assert empty.backend.calls == []\n\n\ndef test_limites() -> None:\n    assert agent_swebench.MAX_ITERATIONS == 30\n    assert agent_swebench.MAX_INPUT_TOKENS == 300_000\n    assert agent_swebench.MAX_OUTPUT_TOKENS == 10_000\n    assert agent_swebench.MAX_TIME_SECONDS == 900.0\n    ok = _solution(\n        iterations=30,\n        total_input_tokens=300_000,\n        total_output_tokens=10_000,\n        total_time_seconds=900.0,\n    )\n    assert agent_swebench.check_limits(ok) == []\n    bad = _solution(\n        iterations=31,\n        total_input_tokens=300_001,\n        total_output_tokens=10_001,\n        total_time_seconds=900.5,\n    )\n    problems = agent_swebench.check_limits(bad)\n    assert len(problems) == 4\n    joined = \" \".join(problems).lower()\n    assert \"iterations\" in joined\n    flat = re.sub(r\"[\\s_]\", \"\", joined)\n    assert \"300000\" in flat\n    assert \"10000\" in flat\n    assert \"900\" in flat\n\n\ndef test_rapport() -> None:\n    assert agent_swebench.validate_report(GOOD_REPORT) == []\n    problems = agent_swebench.validate_report(BAD_REPORT)\n    assert problems\n    joined = \" \".join(problems).lower()\n    for mot in (\"modèle\", \"fournisseur\", \"tâche\", \"métrique\", \"ablation\"):\n        assert mot in joined\n"}],"sortie":"7 passed\n"},"bonus":"Rejoue le même modèle sur 3 tâches avec puis sans l'outil de recherche de définitions :\nmesure le pas où le patch final apparaît pour la première fois et les tokens consommés.\nAjoute une variante du runner avec `docker run --memory 2g --cpus 2` et compare les temps\nd'évaluation. Enfin, émets un `benchmark.jsonl` (une ligne par couple modèle × tâche) et\ngénère le tableau du rapport depuis ce fichier au lieu de le recopier à la main.\n","lienProjet":"C'est la section 4.4 de bout en bout : l'agent SWE-bench explore un dépôt réel dans Docker,\nrécupère son patch avec `git -c core.fileMode=false diff` et respecte les limites de la\nsection 5.1.2. La section 4.7 exige le `BENCHMARK_REPORT.md` (5 modèles, 2 fournisseurs,\n3 tâches, fiabilité, ≥2 métriques intermédiaires, ablation) adossé à de vrais `solution.json`,\net les chapitres 6-7 imposent le README anglais. La section 5.4.1 sanctionne tout lookup de\nPR ou de solution mémorisée : la trace de tes pas est lue en soutenance.\n"}];
const BLOCS = {"A":{"titre":"LLM et boucle d'agent","resume":"Appeler un modèle, extraire du code exécutable, boucler Thought → Code → Observation, mesurer et journaliser."},"B":{"titre":"Sandbox et sécurité","resume":"Exécuter du code non fiable : imports, builtins, final_answer, timeouts, mémoire, réseau, chemins, CLI et configuration."},"C":{"titre":"MCP et outils","resume":"Serveur MCP stdio/HTTP, outils exposés comme fonctions Python, outils fichiers et recherche, patch git, Docker."},"D":{"titre":"Benchmarks et rapport","resume":"Agents MBPP et SWE-bench de bout en bout, solution.json, limites d'évaluation, benchmark multi-modèles et soutenance."}};
const DOCS = {"accueil":{"titre":"Agent Smith Trainer — 10 exercices pour préparer le projet","sousTitre":"Apprends à écrire un agent qui raisonne, produit du Python, l'exécute dans une sandbox et se corrige à partir de l'observation. Tout se fait hors ligne, sans clé API : les tests simulent le fournisseur LLM, le serveur MCP et Docker.","contenu":"## Mise en route (15 minutes)\n\n~~~sh terminal\npython3.10 --version        # 3.10.x : le projet Agent Smith impose cette version\ncurl -LsSf https://astral.sh/uv/install.sh | sh\nmkdir -p ~/agent-smith-trainer && cd ~/agent-smith-trainer\nmkdir ex01 && cd ex01\nuv init --bare --python 3.10\nuv add httpx python-dotenv pydantic\nuv add --dev pytest ruff\n# exercice 07 : uv add \"mcp[cli]\"\n~~~\n\nUn projet `uv` **par dossier d'exercice** (`ex01/`, `ex02/`…). Crée ton projet dans le\ndossier, puis lance les commandes depuis ce dossier : `uv run pytest -q`. Chaque exercice\ndonne ses commandes exactes dans **Auto-vérification**. Ne lance jamais le `python`\nglobal : c'est `uv run` qui garantit Python 3.10 et les bonnes dépendances.\n\n## Fournisseurs gratuits et multi-clés\n\nLe projet doit tourner **uniquement sur des offres gratuites** et supporter **plusieurs clés\npar fournisseur**. Entraîne-toi comme le jour de l'évaluation : aucune clé dans le code,\nrotation dès le premier `429`.\n\n| Fournisseur | Variable d'environnement | À savoir |\n|---|---|---|\n| OpenRouter | `OPENROUTER_API_KEY` | agrège beaucoup de modèles derrière une API compatible OpenAI |\n| Groq | `GROQ_API_KEY` | très faible latence, quotas par minute |\n| Together AI | `TOGETHER_API_KEY` | modèles ouverts, quota gratuit limité |\n| Google AI Studio | `GEMINI_API_KEY` | endpoint compatible OpenAI disponible |\n| Mistral AI | `MISTRAL_API_KEY` | offre gratuite, endpoints compatibles |\n\n- Prévois **deux fournisseurs et plusieurs clés** (`OPENROUTER_API_KEY_1`, `_2`…) : un quota\n  épuisé ne doit pas arrêter une session de debug.\n- Vérifie les quotas et les noms de modèles le jour même : les offres gratuites bougent, le\n  sujet officiel ne les garantit pas.\n- Le `.env` reste hors de Git (`.gitignore`) et la configuration ne contient que des **noms**\n  de variables, jamais de valeur.\n\n> [ok] Les exercices se font **sans réseau et sans clé** : `httpx.MockTransport` simule le\n> fournisseur, un serveur MCP stdio local remplace les outils, Docker est mocké. Seule\n> l'installation initiale de `uv` et les vrais appels LLM (bonus) demandent une connexion.\n\n## Méthode pour chaque exercice\n\n1. Lis l'**objectif** et le **mini-cours** jusqu'au bout ; les exemples du cours n'ont\n   volontairement rien à voir avec la solution.\n2. Copie le **code de départ**, lis l'énoncé, écris la liste des cas limites avant de coder.\n3. Copie le test d'**auto-vérification** et lance-le tout de suite : il échoue, c'est prévu.\n   Ton travail s'arrête quand la sortie attendue est **exactement** reproduite.\n4. Bloqué plus de 15 minutes ? Révèle **un** indice. Le troisième est de la logique en\n   français, jamais du code complet.\n5. Avant de cocher « fait » : tu dois pouvoir **expliquer chaque fonction à voix haute** et\n   dire ce qui se passe sur un cas limite.\n6. Écris dans **Mes notes** les erreurs rencontrées et les questions que ton binôme t'a posées.\n\n## Ce que tu vas construire\n\n- un client LLM multi-fournisseurs, multi-clés, avec retry et mesure de l'usage (`01`) ;\n- un extracteur qui transforme quatre formats de sortie LLM en appels Python (`02`) ;\n- la boucle `Thought → Code → Observation` avec budget et arrêt propre (`03`) ;\n- une sandbox restreinte (imports, builtins, `final_answer`) puis isolée (timeout, mémoire,\n  réseau, chemins) avec CLI et config Pydantic (`04` à `06`) ;\n- un serveur MCP stdio et HTTP exposant les outils obligatoires (`07`, `08`) ;\n- deux agents de benchmark, `solution.json` et un rapport multi-modèles (`09`, `10`).\n\n## Commandes à connaître\n\n| Commande | Rôle |\n|---|---|\n| `uv add httpx` / `uv sync` | ajouter une dépendance / installer depuis `pyproject.toml` |\n| `uv run pytest ex01 -q` | tests d'un exercice, sortie courte |\n| `uv run python -m agent_mbpp --help` | lancer un module du projet |\n| `uv add --dev ruff` puis `uv run ruff check .` | lint local |\n| `git -c core.fileMode=false diff` | patch propre, sans bruit de permissions |\n| `docker ps -aq --filter name=agent` | repérer les conteneurs qui fuient |\n\n> [!] En soutenance, on te demandera **une modification à la volée** (2 à 5 minutes) puis de\n> la **revert**. Tu dois savoir où la faire et relancer l'agent. Le code que tu ne peux ni\n> expliquer ni modifier te fait perdre le projet, même s'il passe les tests.\n\nRègle sur l'IA : utilise-la pour comprendre un message d'erreur, relire un design ou générer\ndes cas de test. Jamais pour produire un fichier que tu ne saurais pas réécrire. Aucune\nsolution complète n'est fournie sur cette plateforme, et les indices s'arrêtent à la logique.\n\n## Ta progression reste locale\n\nCette plateforme stocke tes exercices cochés, les indices révélés et tes notes dans **ce\nnavigateur** (`localStorage`), jamais sur un serveur. Utilise **Exporter** chaque soir : le\nfichier JSON permet de sauvegarder, de changer de machine ou de fusionner avec ton binôme via\n**Importer**. Vider les données du site efface la progression.\n\nEnchaîne avec le **parcours conseillé** : il donne l'ordre, les dépendances, le planning\nà deux et le rituel de soutenance.\n"},"aideMemoire":"## Environnement : uv\n\n| Commande | Rôle |\n|---|---|\n| `uv init --python 3.10` | créer `pyproject.toml` et `.python-version` |\n| `uv add httpx python-dotenv pydantic` | ajouter des dépendances (réseau requis) |\n| `uv add --dev pytest ruff` | dépendances de développement |\n| `uv sync` | recréer l'environnement depuis le lock |\n| `uv run pytest -q` | exécuter dans l'environnement du projet |\n| `uv python list` | versions de Python disponibles |\n\nUne seule règle : toujours `uv run …` depuis la racine du projet, jamais un `python` global.\n\n## Appeler une API compatible OpenAI (httpx)\n\n~~~python chat.py\nimport httpx\n\nAPI = \"https://openrouter.ai/api/v1\"          # ou tout fournisseur compatible\n\ndef ask(messages, *, model, key, stop=None):\n    payload = {\"model\": model, \"messages\": messages, \"temperature\": 0}\n    if stop:\n        payload[\"stop\"] = stop\n    headers = {\"Authorization\": f\"Bearer {key}\"}\n    timeout = httpx.Timeout(30, connect=5)\n    with httpx.Client(base_url=API, headers=headers, timeout=timeout) as client:\n        response = client.post(\"/chat/completions\", json=payload)\n        response.raise_for_status()\n        data = response.json()\n    return data[\"choices\"][0][\"message\"][\"content\"], data[\"usage\"]\n~~~\n\n- `raise_for_status()` transforme `429`/`5xx` en `httpx.HTTPStatusError`. Décide ce qui est\n  **retryable** (`429`, `5xx`, timeouts) et ce qui ne l'est pas (`400`, `401`).\n- `httpx.MockTransport(handler)` remplace le réseau : le handler reçoit une `httpx.Request` et\n  renvoie une `httpx.Response`. C'est la base de tous les tests hors ligne.\n- `response.json()[\"usage\"]` contient `prompt_tokens` et `completion_tokens` : mesure-les,\n  ne les invente pas.\n\n## Config : `.env`, Pydantic, dataclasses\n\n~~~python config.py\nimport os\nfrom dotenv import load_dotenv\nfrom pydantic import BaseModel, Field\n\nload_dotenv()                                  # lit .env sans écraser l'environnement\n\ndef api_keys(prefix=\"OPENROUTER_API_KEY\"):\n    keys = [os.environ[f\"{prefix}_{i}\"] for i in (1, 2, 3)\n            if os.environ.get(f\"{prefix}_{i}\")]\n    if not keys:\n        raise RuntimeError(f\"{prefix}_1 manquante dans .env\")\n    return keys\n\nclass SandboxConfig(BaseModel):\n    authorized_imports: list[str] = Field(\n        default_factory=lambda: [\"math\", \"math.*\", \"re\", \"json\"])\n    allowed_directories: list[str] = Field(\n        default_factory=lambda: [\"/testbed\", \"/tmp/agent\"])\n    max_execution_time_seconds: int = 30\n    max_memory_mb: int = 512\n~~~\n\n| Besoin | Outil |\n|---|---|\n| schéma validé + JSON | `BaseModel` (`model_validate`, `model_dump_json`) |\n| valeur interne immuable | `@dataclass(frozen=True)` |\n| annotation de types | `typing` : `Optional`, `Literal`, `TypedDict`, `Protocol` |\n| dictionnaire typé | `TypedDict` |\n| valeur absente | `Optional[str]` ou `str \\| None` (3.10) |\n| choix fermé | `Literal[\"mbpp\", \"swebench\"]` |\n| config stricte | `model_config = {\"extra\": \"forbid\"}` |\n\nCharge toute la configuration **avant** de construire la sandbox, refuse une config\n**invalide** (mauvais type, clé inconnue) et laisse Pydantic appliquer les valeurs par\ndéfaut des champs absents : un fichier partiel est valide.\n\n## Exécuter du code non fiable (subprocess, resource, signal)\n\n~~~python isolated_runner.py\nimport os\nimport resource\nimport signal\nimport subprocess\n\ndef _limits():\n    resource.setrlimit(resource.RLIMIT_AS, (512 << 20, 512 << 20))   # 512 Mo\n    resource.setrlimit(resource.RLIMIT_CPU, (35, 35))                # secondes CPU\n\ndef run_isolated(code: str, timeout_s: float = 30) -> dict:\n    proc = subprocess.Popen(\n        [\"python3.10\", \"-I\", \"-c\", code],\n        stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,\n        start_new_session=True, preexec_fn=_limits)\n    try:\n        out, err = proc.communicate(timeout=timeout_s)\n        ok = proc.returncode == 0\n        return {\"ok\": ok, \"stdout\": out, \"stderr\": err,\n                \"error\": None if ok else (err.strip() or \"échec\"), \"timed_out\": False}\n    except subprocess.TimeoutExpired:\n        os.killpg(proc.pid, signal.SIGKILL)     # tue le groupe, pas seulement le chef\n        out, err = proc.communicate()\n        return {\"ok\": False, \"stdout\": out, \"stderr\": err,\n                \"error\": f\"timeout après {timeout_s}s\", \"timed_out\": True}\n~~~\n\n- Version courte : l'exercice 05 sépare l'enfant (config JSON sur stdin) et applique\n  aussi l'allowlist de chemins ; le contrat testé exige la clé `error` dans le dictionnaire.\n- `start_new_session=True` + `os.killpg` : sans ça, les petits-enfants survivent et\n  deviennent des **processus orphelins**.\n- Allowlist de chemins : résous avec `pathlib.Path(p).resolve()` **puis** compare avec\n  `os.path.commonpath([allowed, cible]) == allowed`. Une comparaison de préfixe de chaîne\n  laisse passer `/testbed-evil` et les symlinks.\n- `signal.alarm` marche dans un fil d'exécution unique ; `subprocess` + timeout est plus\n  robuste et permet de récupérer la sortie partielle.\n\n## Inspecter et filtrer le code (ast, hooks d'import)\n\n| Outil | Usage |\n|---|---|\n| `ast.parse(src)` | SyntaxError **avant** toute exécution |\n| `ast.walk(tree)` + `ast.Import`/`ast.ImportFrom` | lister les imports d'un source |\n| `compile(tree, \"sandbox.py\", \"exec\")` | compiler une fois puis `exec` |\n| `builtins.__import__` enveloppé | filtrer l'import au moment de l'exécution |\n| `importlib.abc.MetaPathFinder.find_spec` | hook d'import global (meta path) |\n| `sys.modules` | détecter ce qui est déjà chargé / éviter les fuites |\n\nUne allowlist par module doit gérer les sous-modules : l'entrée `collections.*`\nautorise `collections.abc`, mais elle ne couvre pas le module racine\n`collections` : si tu veux les deux, liste `collections` **et** `collections.*`. Teste toujours un import refusé **et** un\nsous-module autorisé.\n\n## Capturer, structurer, journaliser (contextlib, logging, JSONL)\n\n| Outil | Usage |\n|---|---|\n| `contextlib.redirect_stdout(io.StringIO())` | capturer la sortie du code exécuté |\n| `contextlib.ExitStack()` | libérer plusieurs ressources dans l'ordre inverse |\n| `logging.getLogger(__name__)` | logs d'un serveur MCP : **stderr**, jamais stdout |\n| `json.dumps(event)` + `\"\\n\"` | une ligne JSON par événement (JSONL) |\n| `logger.exception(...)` | message + traceback dans le même enregistrement |\n| `flush=True` / `f.flush()` | un fichier de log doit être lisible pendant l'exécution |\n\n`print` dans un serveur MCP stdio corrompt le canal JSON-RPC : utilise `sys.stderr` ou\n`logging`. Côté agent, un événement JSONL par itération (`step`, `tokens`, `tool`,\n`duration_ms`) rend un bug reproductible.\n\n## Tester hors ligne (pytest)\n\n| Outil | Usage |\n|---|---|\n| `pytest.raises(ValueError)` | exception attendue |\n| `monkeypatch.setenv(\"CLE\", \"x\")` | variable d'environnement isolée |\n| `tmp_path` | répertoire temporaire unique et nettoyé |\n| `capsys.readouterr()` | vérifier stdout/stderr |\n| `@pytest.mark.parametrize` | un test, plusieurs cas |\n| `httpx.MockTransport` | faux serveur LLM, zéro socket |\n| `pytest.mark.skipif` | test réservé à un environnement (Docker absent) |\n\nUn test fourni ne contient jamais la solution : il décrit le **comportement attendu**. Lance\n`uv run pytest exNN -q` et compare la sortie exacte demandée par l'exercice.\n\n## Docker, git et MCP\n\n| Commande / API | Rôle |\n|---|---|\n| `docker pull IMAGE` | récupérer l'image du testbed |\n| `docker run --rm -d --network none --memory 2g IMAGE sleep infinity` | conteneur isolé |\n| `docker exec -w /testbed CID bash -lc \"…\"` | exécuter dans le testbed |\n| `docker rm -f CID` / `docker ps -aq` | nettoyer, même après un signal |\n| `git -c core.fileMode=false diff` | patch SWE-bench sans bruit de permissions |\n| `git status --porcelain` / `git apply --check p.diff` | vérifier la propreté du patch |\n\n~~~python mcp_min.py\nfrom mcp.server.mcpserver import MCPServer   # SDK 2.x\n# SDK 1.x : from mcp.server.fastmcp import FastMCP\n\nmcp = MCPServer(\"mbpp-tools\")\n\n@mcp.tool()\ndef run_tests(code: str, test_list: list[str]) -> str:\n    \"\"\"Exécute les assertions et renvoie {\"success\": bool, \"output\": str}.\"\"\"\n    ...\n\n@mcp.resource(\"config://limits\")\ndef limits() -> str:\n    return '{\"max_iterations\": 10}'\n\nif __name__ == \"__main__\":\n    mcp.run(transport=\"stdio\")      # HTTP : mcp.run(transport=\"streamable-http\")\n~~~\n\n| Notion MCP | À retenir |\n|---|---|\n| `@mcp.tool()` | fonction appelable par le client, schéma généré depuis la signature |\n| `@mcp.resource(uri)` | donnée lisible par le client |\n| `@mcp.prompt()` | gabarit de prompt exposé |\n| client stdio | `stdio_client(StdioServerParameters(command=..., args=[...]))` |\n| client HTTP | `streamable_http_client(url)` |\n| règle d'or | logs sur **stderr**, serveur qui ne bloque pas, erreurs renvoyées au client |\n\n## Erreurs fréquentes\n\n| Message | Cause et remède |\n|---|---|\n| `httpx.ConnectError` | URL ou endpoint faux, réseau bloqué : vérifie `base_url` |\n| `httpx.HTTPStatusError: 429` | quota atteint : clé suivante + backoff, pas de retry infini |\n| `httpx.ReadTimeout` | modèle trop lent : augmente le timeout ou change de modèle |\n| `subprocess.TimeoutExpired` | code trop long : tue le **groupe** (`killpg`) puis récupère la sortie |\n| `ImportError: import de 'os' interdit` dans la sandbox | import refusé par l'allowlist, c'est voulu |\n| `NameError: name 'final_answer' is not defined` | l'outil n'est pas injecté dans le namespace |\n| `pydantic.ValidationError` | config incomplète ou mauvais type : lis le champ signalé |\n| `json.JSONDecodeError` | réponse LLM non JSON : extraction ou stop sequence à revoir |\n| `FileNotFoundError` / `PermissionError` | chemin hors allowlist ou mauvais `TESTBED_PATH` |\n| `BrokenPipeError` | le client MCP a fermé le canal ; arrête proprement le serveur |\n| `[Errno 24] Too many open files` | conteneurs, sockets ou sous-processus non fermés |\n","carte":{"intro":"Architecture d'un agent code. Le modèle **propose du texte**, l'orchestrateur en extrait du\nPython, la sandbox **exécute** et renvoie une observation, puis la boucle recommence jusqu'à\n`final_answer(...)`. Chaque boîte indique l'exercice qui la travaille.\n","svg":"<svg viewBox=\"0 0 960 660\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Architecture d'un agent code Agent Smith\">\n<style>\n  .sv-bx{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}\n  .sv-bx.sv-k{stroke:var(--accent);stroke-width:2}\n  .sv-bx.sv-s{fill:var(--accent-soft)}\n  .sv-fr{fill:none;stroke:var(--fg2);stroke-width:1.2;stroke-dasharray:6 5}\n  .sv-t{fill:var(--fg);font:600 13.5px var(--sans)}\n  .sv-st{fill:var(--fg2);font:11.5px var(--sans)}\n  .sv-lb{fill:var(--fg2);font:italic 11.5px var(--sans)}\n  .sv-ft{fill:var(--fg2);font:11px var(--sans)}\n  .sv-in{stroke:var(--accent);stroke-width:2;fill:none}\n  .sv-out{stroke:var(--ok);stroke-width:2;fill:none;stroke-dasharray:7 4}\n  .sv-aux{stroke:var(--fg2);stroke-width:1.4;fill:none;stroke-dasharray:2 4}\n  .sv-hi{fill:var(--accent)} .sv-ho{fill:var(--ok)} .sv-ha{fill:var(--fg2)}\n</style>\n<defs>\n  <marker id=\"mi\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path class=\"sv-hi\" d=\"M0,0L10,5L0,10z\"/></marker>\n  <marker id=\"mo\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path class=\"sv-ho\" d=\"M0,0L10,5L0,10z\"/></marker>\n  <marker id=\"ma\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path class=\"sv-ha\" d=\"M0,0L10,5L0,10z\"/></marker>\n</defs>\n<rect class=\"sv-bx\" x=\"20\" y=\"40\" width=\"200\" height=\"94\" rx=\"9\"/><text class=\"sv-t\" x=\"34\" y=\"64\">Tâche</text><text class=\"sv-st\" x=\"34\" y=\"84\">MBPPTaskInput</text><text class=\"sv-st\" x=\"34\" y=\"101\">SWEBenchTaskInput</text><text class=\"sv-st\" x=\"34\" y=\"120\">task.json — ex 9, 10</text>\n<rect class=\"sv-bx sv-k\" x=\"270\" y=\"26\" width=\"250\" height=\"152\" rx=\"9\"/><text class=\"sv-t\" x=\"284\" y=\"50\">Agent / Orchestrator</text><text class=\"sv-st\" x=\"284\" y=\"72\">boucle Thought → Code</text><text class=\"sv-st\" x=\"284\" y=\"90\">→ Observation</text><text class=\"sv-st\" x=\"284\" y=\"110\">max_iterations, budgets</text><text class=\"sv-st\" x=\"284\" y=\"128\">system prompt + outils</text><text class=\"sv-st\" x=\"284\" y=\"150\">ex 3, 9, 10</text>\n<rect class=\"sv-bx sv-k\" x=\"600\" y=\"26\" width=\"250\" height=\"92\" rx=\"9\"/><text class=\"sv-t\" x=\"614\" y=\"50\">LLM providers</text><text class=\"sv-st\" x=\"614\" y=\"68\">API compatible OpenAI</text><text class=\"sv-st\" x=\"614\" y=\"86\">clés en rotation · retry</text><text class=\"sv-st\" x=\"614\" y=\"104\">usage : tokens, latence — ex 1</text>\n<rect class=\"sv-bx\" x=\"600\" y=\"152\" width=\"250\" height=\"92\" rx=\"9\"/><text class=\"sv-t\" x=\"614\" y=\"176\">Extraction du code</text><text class=\"sv-st\" x=\"614\" y=\"194\">blocs python, XML, Hermes, ReAct</text><text class=\"sv-st\" x=\"614\" y=\"212\">converti en appels Python</text><text class=\"sv-st\" x=\"614\" y=\"230\">ex 2</text>\n<rect class=\"sv-fr\" x=\"250\" y=\"292\" width=\"440\" height=\"240\" rx=\"12\"/><text class=\"sv-t\" x=\"264\" y=\"314\">Sandbox — frontière d'exécution</text><text class=\"sv-st\" x=\"676\" y=\"314\" text-anchor=\"end\">ex 4, 5, 6</text>\n<rect class=\"sv-bx\" x=\"270\" y=\"332\" width=\"190\" height=\"84\" rx=\"9\"/><text class=\"sv-t\" x=\"284\" y=\"354\">Espace d'exécution</text><text class=\"sv-st\" x=\"284\" y=\"372\">exec + namespace persistant</text><text class=\"sv-st\" x=\"284\" y=\"388\">imports allowlist</text><text class=\"sv-st\" x=\"284\" y=\"404\">builtins restreints — ex 4</text>\n<rect class=\"sv-bx sv-k\" x=\"480\" y=\"332\" width=\"190\" height=\"84\" rx=\"9\"/><text class=\"sv-t\" x=\"494\" y=\"354\">final_answer()</text><text class=\"sv-st\" x=\"494\" y=\"372\">fourni par la sandbox</text><text class=\"sv-st\" x=\"494\" y=\"388\">PAS un outil MCP</text><text class=\"sv-st\" x=\"494\" y=\"404\">ex 4</text>\n<rect class=\"sv-bx\" x=\"480\" y=\"436\" width=\"190\" height=\"76\" rx=\"9\"/><text class=\"sv-t\" x=\"494\" y=\"458\">Client MCP</text><text class=\"sv-st\" x=\"494\" y=\"476\">wrappers = fonctions</text><text class=\"sv-st\" x=\"494\" y=\"492\">découverts à l'exécution</text><text class=\"sv-st\" x=\"494\" y=\"508\">ex 6, 7</text>\n<rect class=\"sv-bx\" x=\"270\" y=\"436\" width=\"190\" height=\"76\" rx=\"9\"/><text class=\"sv-t\" x=\"284\" y=\"458\">Limites</text><text class=\"sv-st\" x=\"284\" y=\"476\">timeout · mémoire</text><text class=\"sv-st\" x=\"284\" y=\"492\">chemins · réseau</text><text class=\"sv-st\" x=\"284\" y=\"508\">ex 5</text>\n<rect class=\"sv-fr\" x=\"720\" y=\"292\" width=\"220\" height=\"240\" rx=\"12\"/><text class=\"sv-t\" x=\"734\" y=\"314\">Serveurs MCP</text><text class=\"sv-st\" x=\"926\" y=\"314\" text-anchor=\"end\">ex 7</text>\n<rect class=\"sv-bx\" x=\"736\" y=\"332\" width=\"188\" height=\"84\" rx=\"9\"/><text class=\"sv-t\" x=\"750\" y=\"354\">Serveur MCP — stdio</text><text class=\"sv-st\" x=\"750\" y=\"372\">process séparé</text><text class=\"sv-st\" x=\"750\" y=\"388\">mcp_tools_*.py</text><text class=\"sv-st\" x=\"750\" y=\"404\">ex 7</text>\n<rect class=\"sv-bx\" x=\"736\" y=\"436\" width=\"188\" height=\"76\" rx=\"9\"/><text class=\"sv-t\" x=\"750\" y=\"458\">Serveur MCP — HTTP</text><text class=\"sv-st\" x=\"750\" y=\"476\">streamable HTTP</text><text class=\"sv-st\" x=\"750\" y=\"492\">même protocole</text><text class=\"sv-st\" x=\"750\" y=\"508\">ex 7</text>\n<rect class=\"sv-bx\" x=\"460\" y=\"560\" width=\"230\" height=\"80\" rx=\"9\"/><text class=\"sv-t\" x=\"474\" y=\"582\">Docker + testbed</text><text class=\"sv-st\" x=\"474\" y=\"600\">pull · exec · cleanup</text><text class=\"sv-st\" x=\"474\" y=\"616\">TESTBED_PATH = /testbed</text><text class=\"sv-st\" x=\"474\" y=\"632\">patch via git diff — ex 8, 10</text>\n<rect class=\"sv-bx\" x=\"720\" y=\"560\" width=\"220\" height=\"80\" rx=\"9\"/><text class=\"sv-t\" x=\"734\" y=\"582\">Outils obligatoires</text><text class=\"sv-st\" x=\"734\" y=\"600\">read_file · edit_file</text><text class=\"sv-st\" x=\"734\" y=\"616\">search_code · run_tests</text><text class=\"sv-st\" x=\"734\" y=\"632\">get_patch — ex 8</text>\n<rect class=\"sv-bx\" x=\"20\" y=\"330\" width=\"200\" height=\"150\" rx=\"9\"/><text class=\"sv-t\" x=\"34\" y=\"354\">SolutionOutput</text><text class=\"sv-st\" x=\"34\" y=\"374\">solution.json</text><text class=\"sv-st\" x=\"34\" y=\"392\">steps → StepMetrics</text><text class=\"sv-st\" x=\"34\" y=\"410\">tokens · latence · patch</text><text class=\"sv-st\" x=\"34\" y=\"428\">system_prompt</text><text class=\"sv-st\" x=\"34\" y=\"446\">ex 3, 9, 10</text>\n<path class=\"sv-in\" d=\"M220,87 L268,87\" marker-end=\"url(#mi)\"/>\n<path class=\"sv-in\" d=\"M520,64 L598,64\" marker-end=\"url(#mi)\"/><text class=\"sv-lb\" x=\"559\" y=\"40\" text-anchor=\"middle\">prompt +</text><text class=\"sv-lb\" x=\"559\" y=\"54\" text-anchor=\"middle\">historique</text>\n<path class=\"sv-in\" d=\"M725,118 L725,150\" marker-end=\"url(#mi)\"/>\n<path class=\"sv-in\" d=\"M725,244 C725,268 680,272 646,290\" marker-end=\"url(#mi)\"/><text class=\"sv-lb\" x=\"730\" y=\"270\">code extrait</text>\n<path class=\"sv-in\" d=\"M670,455 C700,450 716,430 736,410\" marker-end=\"url(#mi)\"/>\n<path class=\"sv-in\" d=\"M670,478 L734,478\" marker-end=\"url(#mi)\"/>\n<path class=\"sv-out\" d=\"M250,340 C210,340 214,196 268,172\" marker-end=\"url(#mo)\"/><text class=\"sv-lb\" x=\"112\" y=\"250\">observation</text>\n<path class=\"sv-out\" d=\"M560,332 C540,280 500,226 462,180\" marker-end=\"url(#mo)\"/><text class=\"sv-lb\" x=\"566\" y=\"258\">final_answer → arrêt</text>\n<path class=\"sv-out\" d=\"M330,180 C260,230 205,272 132,328\" marker-end=\"url(#mo)\"/><text class=\"sv-lb\" x=\"46\" y=\"318\">solution.json</text>\n<path class=\"sv-aux\" d=\"M830,532 L830,558\" marker-end=\"url(#ma)\"/><text class=\"sv-lb\" x=\"840\" y=\"551\">expose</text>\n<path class=\"sv-aux\" d=\"M718,600 L692,600\" marker-end=\"url(#ma)\"/>\n<text class=\"sv-ft\" x=\"20\" y=\"654\">Les outils MCP et Docker s'exécutent hors de la sandbox ; final_answer reste dans la sandbox et arrête la boucle.</text>\n</svg>\n","legende":"### Trois frontières à savoir défendre\n\n- **Texte → code** : un LLM n'exécute rien, il produit du texte. L'extraction est une étape\n  testable séparément, sur plusieurs formats (bloc python, XML Anthropic, Hermes, ReAct).\n- **Sandbox** : le code généré ne voit qu'un namespace restreint, les imports de l'allowlist,\n  les répertoires autorisés, sans réseau, avec timeout et limite mémoire. `final_answer` est\n  fourni par la sandbox, pas par un serveur MCP.\n- **Outils** : les outils MCP tournent **hors** sandbox (processus séparé, Docker). Ils ne\n  sont pas soumis au timeout de la sandbox : traite-les comme des actions privilégiées et\n  journalise chaque appel.\n\n### Ce qui entre et ce qui sort\n\n- **Entrée** : un JSON de tâche (`MBPPTaskInput` ou `SWEBenchTaskInput`) fourni par la\n  moulinette, avec le modèle et l'URL du fournisseur en arguments de CLI.\n- **Boucle** : chaque itération produit un `StepMetrics` (`step`, tokens, latence,\n  `llm_output`, `sandbox_input`, `sandbox_output`, `retries`).\n- **Sortie** : `SolutionOutput` écrit dans `solution.json`, avec `benchmark`, `solution`\n  (code MBPP ou patch git), `iterations`, les totaux et le `system_prompt` pour la provenance.\n\n> [!] Le piège d'architecture le plus fréquent : croire que `final_answer` est un outil MCP.\n> C'est un construit de la sandbox, toujours présent, quel que soit le serveur connecté.\n"},"parcours":"## Le principe\n\n- **Seul** : 5 jours de 4 à 5 h, ou 4 journées pleines. Aucun exercice n'est facultatif.\n- **À deux** : même ordre, mais chacun prend un exercice sur deux dans les blocs B et C, puis\n  échange croisé le soir. Objectif commun : **chacun doit pouvoir expliquer tout le code**,\n  pas seulement ses fichiers.\n- **Règle d'or** : on ne passe pas à l'exercice suivant tant que les tests ne sont pas verts et\n  qu'on ne sait pas expliquer la veille. Un exercice non compris se paie deux fois.\n- Bloqué 15 minutes ? Un indice. Pas une IA qui code à ta place.\n\n## Dépendances entre exercices\n\n| Exercice | Dépend de | Pourquoi |\n|---|---|---|\n| 01 | — | la base : HTTP, clés, retry, usage |\n| 02 | 01 | il faut une réponse de LLM à extraire |\n| 03 | 01, 02 | la boucle branche client + extraction + sandbox |\n| 04 | — | la sandbox se teste seule, mais sert à 03 |\n| 05 | 04 | isoler suppose une sandbox qui fonctionne |\n| 06 | 04, 05 | la CLI branche config, exécution et manuel |\n| 07 | — | MCP se teste seul en stdio |\n| 08 | 07 | les outils sont exposés par le serveur |\n| 09 | 03, 07 | boucle + outil `run_tests` |\n| 10 | 08, 09 | outils SWE-bench + agent complet |\n\n**Non bloquant mais utile** : `06` avant `09` et `10` (les CLI se ressemblent), `05` avant\n`10` (timeouts, nettoyage et processus orphelins).\n\n## Planning seul (5 jours, ~22 h)\n\n| Jour | Exercices | Charge |\n|---|---|---|\n| **J1** | 01 puis 02 | 3 h 30 + relecture |\n| **J2** | 03 puis 04 | 5 h |\n| **J3** | 05 puis 06 | 4 h |\n| **J4** | 07 puis 08 | 5 h |\n| **J5** | 09 puis 10 (Docker mocké) | 6 h, à étaler sur J6 si besoin |\n\n## Planning à deux (5 jours)\n\n| Jour | Étudiant 1 | Étudiant 2 | Ensemble |\n|---|---|---|---|\n| **J1** | 01, 02 | 01, 02 | comparer 01 et 02, puis 03 chacun (2 h 30) |\n| **J2** | 04 | 05 | échange croisé 04–05 (1 h), puis 06 chacun |\n| **J3** | 08 | 07 | échange croisé 07–08 (1 h) |\n| **J4** | 09 | 09 | comparer les `solution.json` et les traces (1 h) |\n| **J5** | 10 : Docker et outils | 10 : rapport et benchmark | fusion du rapport, soutenance blanche (2 h) |\n\nChacun relit le mini-cours de l'exercice fait par l'autre (10 min) avant l'échange. Le J5\nn'est pas un jour de code : c'est un jour de preuve.\n\n## Le rituel de soutenance (30 min par exercice)\n\n1. **Expliquer** : l'auteur décrit son code fonction par fonction, sans relire l'énoncé ni les\n   commentaires. L'autre chronomètre.\n2. **Questionner** : l'évaluateur demande « que se passe-t-il si… ». Exemples : le LLM ne renvoie\n   aucun code ? le modèle renvoie deux blocs ? l'import est un sous-module ? la boucle ne\n   termine jamais ? le serveur MCP écrit sur stdout ?\n3. **Modifier** : l'évaluateur prend le clavier, applique une modification et relance les tests.\n   L'auteur doit dire où et pourquoi avant l'exécution.\n4. **Noter** : ce qui n'a pas été su expliquer va dans **Mes notes**, et devient le programme\n   du lendemain.\n\nVersion soutenance blanche : tire 2 exercices au hasard, 15 min chacun, plus une modification\nà la volée. Si tu échoues, refais l'échange le lendemain — pas de nouvelle notion avant.\n\n## Modifications à la volée (2 à 5 min)\n\n| Ex | Modification demandée | Ce que ça vérifie |\n|---|---|---|\n| 01 | ajouter une 2e clé et provoquer un `429` | rotation, retry, pas de clé en dur |\n| 02 | ajouter un format ou un bloc malformé | extraction robuste, feedback |\n| 03 | passer `max_iterations` à 3 | budget et arrêt propre |\n| 04 | autoriser puis refuser `os`, tester `final_answer` | allowlist et builtins |\n| 05 | timeout court sur une boucle infinie | isolation, sortie partielle |\n| 06 | charger un JSON de config invalide | validation Pydantic |\n| 07 | ajouter un outil et le retrouver dans `list_tools` | découverte MCP |\n| 08 | modifier un fichier puis appeler `get_patch` | format du diff |\n| 09 | simuler un test en échec | renvoyer l'échec au LLM |\n| 10 | tuer le conteneur puis relancer | nettoyage, robustesse |\n\n## Mapping exercice → sujet officiel\n\n| Exercice | Sections du sujet |\n|---|---|\n| 01 | 4.6, 4.6.1, 3.2 (multi-fournisseurs), 5.2 |\n| 02 | 4.1 (2), 4.6 (`stop_sequences`) |\n| 03 | 4.1 (1, 3, 4, 6), 4.1.1, 4.1.2, 5.1.1 |\n| 04 | 4.2 (2, 3), 5.4 |\n| 05 | 4.2 (3), 5.1 (timeout réel, SIGTERM/SIGKILL) |\n| 06 | 4.2 (1, 4, 5), `exam_sandbox.sh` (7 tests de sécurité) |\n| 07 | 4.2 (4), 4.3 (2) |\n| 08 | 4.5 (outils obligatoires) |\n| 09 | 4.3, 4.1.1, 5.1.1, 5.2 (4/5) |\n| 10 | 4.4, 4.7, 5.1.2, 5.4.1, 6 (README) |\n\n> [!] Le jour de l'évaluation : MBPP passe à 4/5, SWE-bench à 2/3, la sandbox doit passer\n> **tous** les tests de sécurité, et aucun échec n'est rejoué. Les limites de tokens sont\n> **cumulées** sur la tâche, pas par requête.\n","glossaire":[{"terme":"LLM","ex":1,"def":"Modèle de langage entraîné à prédire la suite d'un texte ; il produit du texte, jamais d'action. Ton agent lit ce texte, en extrait du code et décide quoi en faire."},{"terme":"Token","ex":1,"def":"Plus petite unité manipulée par un LLM, souvent une fraction de mot ; les limites, les quotas et les coûts se comptent en tokens d'entrée et de sortie."},{"terme":"Prompt","ex":1,"def":"Texte envoyé au modèle. Dans l'API chat, c'est une liste de messages de rôles `system`, `user` et `assistant`."},{"terme":"System prompt","ex":3,"def":"Premier message de rôle `system` : il fixe le comportement, documente les outils disponibles et le format de réponse attendu. Il est renvoyé à chaque itération et journalisé pour la provenance."},{"terme":"Chat completion","ex":1,"def":"Endpoint `POST /v1/chat/completions` d'une API compatible OpenAI : on envoie des messages, on reçoit un choix dans `choices[0].message.content` et l'usage en tokens."},{"terme":"Température","ex":1,"def":"Paramètre de génération qui règle la part d'aléatoire ; `0` privilégie la sortie la plus probable, ce qui est le bon défaut pour un agent reproductible."},{"terme":"Stop sequence","ex":2,"def":"Chaîne qui interrompt la génération dès qu'elle apparaît, par exemple `<end_code>` ou `</tool_call>`. Sans elle, le modèle peut inventer la sortie d'un outil qu'il n'a pas encore exécuté."},{"terme":"Fournisseur (provider)","ex":1,"def":"Service qui expose un ou plusieurs modèles derrière une API : OpenRouter, Groq, Together, Mistral, etc. Ton code doit permettre d'en changer sans refactoriser."},{"terme":"OpenAI-compatible","ex":1,"def":"API qui imite le format de `chat/completions` d'OpenAI : mêmes champs `model`, `messages`, `stop`, même structure de réponse. C'est le contrat commun des fournisseurs du sujet."},{"terme":"Rate limit (429)","ex":1,"def":"Quota de requêtes ou de tokens dépassé ; le serveur répond `429`. Ce n'est pas une erreur de code : on attend puis on passe à la clé suivante."},{"terme":"Retry avec backoff","ex":1,"def":"Réessayer une requête retryable après une attente croissante, par exemple 0,5 s puis 1 s puis 2 s (strictement croissante). Ne jamais réessayer un `400` ou un `401`, et compter chaque tentative dans `StepMetrics.retries`."},{"terme":"Rotation de clés","ex":1,"def":"Utiliser plusieurs clés d'un même fournisseur à tour de rôle pour lisser les quotas. Le sujet l'exige ; les clés viennent de l'environnement, jamais du code."},{"terme":"Variables d'environnement","ex":1,"def":"Configuration lue par le processus via `os.environ`, souvent chargée depuis un `.env` avec `python-dotenv`. Aucune clé API ne doit être écrite en dur, même factice."},{"terme":"Agent","ex":3,"def":"Système qui boucle : il observe une tâche, choisit une action, l'exécute et exploite le résultat jusqu'à un critère d'arrêt. Ici l'action est du code Python exécuté dans une sandbox."},{"terme":"Code agent","ex":3,"def":"Agent dont le moyen d'action est du code exécutable plutôt que des appels d'outils JSON ; il peut enchaîner des variables, des boucles et des conditions entre les étapes."},{"terme":"ReAct","ex":2,"def":"Format de raisonnement alternant `Action:` et `Action Input:` avec des observations. L'extracteur doit le convertir en appel de fonction Python avant l'exécution."},{"terme":"Thought → Code → Observation","ex":3,"def":"Les trois temps d'une itération d'agent : le LLM réfléchit, produit du code, la sandbox l'exécute et renvoie une observation réinjectée dans l'historique."},{"terme":"Itération","ex":3,"def":"Un cycle complet LLM, extraction, sandbox, observation. Elle est numérotée à partir de 1 et bornée par `max_iterations`."},{"terme":"Budget","ex":3,"def":"Limites cumulées sur une tâche : nombre d'itérations, tokens d'entrée et de sortie, durée. Atteindre un budget est un arrêt propre, pas un crash ; les tokens de raisonnement comptent."},{"terme":"Extraction de code","ex":2,"def":"Étape qui isole le code exécutable dans la réponse du modèle (bloc python, XML, Hermes, ReAct) et le convertit en Python. Elle doit expliquer ce qu'elle a fait quand le bloc est malformé."},{"terme":"MCP","ex":7,"def":"Model Context Protocol : protocole JSON-RPC qui expose des outils, des ressources et des prompts à un agent. Serveur et client peuvent être deux processus distincts."},{"terme":"Serveur MCP","ex":7,"def":"Programme qui déclare des outils, des ressources et des prompts puis répond aux appels du client via stdio ou HTTP. Tes serveurs exposent `run_tests` pour MBPP et les outils obligatoires pour SWE-bench."},{"terme":"Client MCP","ex":7,"def":"Côté agent, il se connecte au serveur, découvre les outils et transforme chacun en fonction Python appelable depuis la sandbox."},{"terme":"stdio","ex":7,"def":"Transport MCP par entrée et sortie standard : JSON-RPC sur stdin et stdout, logs sur stderr. Un `print` sur stdout corrompt le protocole."},{"terme":"Streamable HTTP","ex":7,"def":"Transport MCP sur HTTP, utilisé quand le serveur écoute sur une URL. Même protocole que stdio, cycle de vie et gestion des connexions différents."},{"terme":"Tool schema","ex":7,"def":"Description JSON d'un outil : nom, description, paramètres et types. Le manuel de la sandbox est généré à partir de ces schémas, pas écrit à la main."},{"terme":"Config sandbox (JSON et Pydantic)","ex":6,"def":"Fichier JSON chargé dans un modèle Pydantic `SandboxConfig` : imports autorisés, répertoires, timeout et mémoire. Une configuration invalide doit être refusée explicitement, pas complétée au hasard."},{"terme":"Sandbox","ex":4,"def":"Frontière d'exécution qui borne ce que peut faire le code généré : imports, builtins, chemins, réseau, temps et mémoire. Sans elle, un agent est un accès direct à ta machine."},{"terme":"Allowlist d'imports","ex":4,"def":"Liste des modules autorisés, par exemple `math.*`, `re`, `json`. Tout le reste est refusé par défaut ; le suffixe `.*` autorise les sous-modules."},{"terme":"Builtin","ex":4,"def":"Fonction disponible sans import : `open`, `eval`, `__import__`, etc. Les builtins dangereux sont retirés ou remplacés avant l'appel à `exec`."},{"terme":"Import hook","ex":4,"def":"Mécanisme qui filtre les imports au moment où ils sont exécutés, par enveloppe de `builtins.__import__` ou par `MetaPathFinder.find_spec`. Il complète l'analyse `ast` du source."},{"terme":"Namespace d'exécution","ex":4,"def":"Dictionnaire de globals fourni à `exec`. Il peut persister entre les entrées d'un REPL, mais doit repartir propre entre deux tâches."},{"terme":"final_answer","ex":4,"def":"Fonction injectée par la sandbox qui capture la réponse finale et signale à l'orchestrateur d'arrêter. Ce n'est pas un outil MCP : elle existe même sans serveur connecté."},{"terme":"Timeout","ex":5,"def":"Durée maximale accordée à une exécution ; dépassée, le processus est tué et on récupère la sortie partielle. Vérifier le dépassement après coup ne suffit pas."},{"terme":"RLIMIT","ex":5,"def":"Limites de ressources du noyau posées avec `resource.setrlimit` : `RLIMIT_AS` borne la mémoire virtuelle et `RLIMIT_CPU` le temps CPU du processus enfant."},{"terme":"subprocess","ex":5,"def":"Module qui lance un programme séparé et permet de récupérer stdout et stderr. Plus sûr qu'`exec` in-process pour du code non fiable, à condition de gérer le groupe de processus."},{"terme":"Processus orphelin","ex":5,"def":"Enfant survivant après la mort ou le timeout de son parent. On l'évite avec `start_new_session=True` puis `os.killpg(...)` avec `SIGKILL` sur tout le groupe."},{"terme":"Réseau bloqué","ex":5,"def":"Politique qui interdit toute socket sortante ou entrante, par `unshare -n`, `--network none` ou refus dans la sandbox. C'est la parade principale à l'exfiltration."},{"terme":"Path traversal","ex":5,"def":"Chemin du type `../../etc/passwd` qui sort du répertoire autorisé. On le refuse en résolvant le chemin (symlinks compris) puis en vérifiant l'appartenance au sous-arbre (`Path.is_relative_to`, ou `commonpath`)."},{"terme":"Symlink","ex":5,"def":"Lien symbolique qui peut pointer hors de l'allowlist. Il faut appeler `Path.resolve()` avant la vérification, sinon un lien dans `/testbed` contourne le contrôle."},{"terme":"Image Docker","ex":10,"def":"Modèle immuable à partir duquel on démarre des conteneurs. SWE-bench fournit une image par instance ; tu la tires, tu ne la modifies pas."},{"terme":"Conteneur","ex":10,"def":"Instance en cours d'exécution d'une image, avec son propre système de fichiers. Tu dois le nettoyer avec `docker rm -f` même quand l'agent échoue ou reçoit un signal."},{"terme":"testbed","ex":10,"def":"Dépôt réel monté dans le conteneur, sur lequel l'agent lit, édite et lance les tests. C'est le terrain de jeu de SWE-bench."},{"terme":"TESTBED_PATH","ex":8,"def":"Variable d'environnement qui donne la racine du dépôt aux outils MCP. Le sujet impose ce nom exact : tes outils la lisent pour localiser les fichiers."},{"terme":"Patch (git diff)","ex":8,"def":"Diff unifié des modifications du dépôt, produit avec `git -c core.fileMode=false diff` pour éviter le bruit de permissions. C'est la forme attendue de la solution SWE-bench."},{"terme":"MBPP","ex":9,"def":"Mostly Basic Python Problems : de petites tâches algorithmiques accompagnées d'assertions de test. Ton agent doit produire la fonction et la valider avec l'outil `run_tests`."},{"terme":"SWE-bench","ex":10,"def":"Benchmark de correction de vrais bugs dans de vrais dépôts ; chaque tâche a une image Docker, un énoncé d'issue et un script d'évaluation."},{"terme":"instance_id","ex":10,"def":"Identifiant d'une tâche SWE-bench, par exemple `sympy__sympy-14711`. Il id
