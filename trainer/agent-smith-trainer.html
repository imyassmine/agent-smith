<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Plateforme d'entraînement hors ligne : 10 exercices Python pour préparer le projet 42 Agent Smith (agent LLM, sandbox, MCP, benchmarks).">
<title>Agent Smith Trainer — préparation au projet</title>
<style>
:root{
  --bg:#f6f6f3; --bg2:#ffffff; --bg3:#eeeeea; --fg:#1d2126; --fg2:#555c66; --line:#dcdcd6;
  --accent:#2f6fa8; --accent-fg:#ffffff; --accent-soft:#e4eef7;
  --ok:#2f7d32; --ok-soft:#e5f3e5; --warn:#a15c00; --warn-soft:#fdf0dc; --bad:#b3261e; --bad-soft:#fbe7e5;
  --code-bg:#fbfbf9; --code-fg:#24292f;
  --tk-kw:#a626a4; --tk-str:#0a7f3f; --tk-com:#8a8f98; --tk-num:#b45309; --tk-type:#0b6bcb; --tk-fn:#4a3aa7; --tk-const:#c2410c; --tk-bi:#0e7490;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --radius:10px; --side:300px;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#0e1116; --bg2:#151a21; --bg3:#1c232c; --fg:#e4e7eb; --fg2:#9aa4b1; --line:#2a323d;
  --accent:#7ab8ff; --accent-fg:#071e33; --accent-soft:#12283d;
  --ok:#6fcf73; --ok-soft:#14301a; --warn:#f0b35a; --warn-soft:#33260f; --bad:#ff8a80; --bad-soft:#3a1714;
  --code-bg:#0b0e13; --code-fg:#d7dde5;
  --tk-kw:#d291e4; --tk-str:#8bd49c; --tk-com:#6b7684; --tk-num:#f4b071; --tk-type:#7cb7ff; --tk-fn:#b8a6ff; --tk-const:#ff9e64; --tk-bi:#5fd4e8;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- En-tête ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;text-decoration:none;color:var(--fg)}
.brand .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:700 13px var(--mono)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--fg2)}
.tb-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);white-space:nowrap}
.tb-btn:hover{border-color:var(--accent)}
.tb-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.menu-btn{display:none}
.spacer{flex:1}
.progress-pill{font-size:13px;color:var(--fg2);white-space:nowrap}

/* ---------- Mise en page ---------- */
.layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - 53px)}
.sidebar{border-right:1px solid var(--line);background:var(--bg2);padding:14px 10px 40px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
.nav-sec{margin:4px 0 14px}
.nav-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);padding:4px 10px;display:flex;justify-content:space-between}
.nav a{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:7px;color:var(--fg);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--bg3)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .num{font:12px var(--mono);color:var(--fg2);min-width:20px}
.nav .chk{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.nav .chk.on{background:var(--ok);border-color:var(--ok)}
.nav .chk.on::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.nav .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{padding:28px clamp(16px,4vw,48px) 80px;min-width:0;max-width:1000px}

/* ---------- Contenu ---------- */
h1{font-size:28px;line-height:1.25;margin:0 0 8px}
h2{font-size:19px;margin:30px 0 10px;display:flex;align-items:center;gap:8px}
h3{font-size:16px;margin:20px 0 8px}
h4{font-size:15px;margin:16px 0 6px}
p{margin:8px 0}
ul,ol{padding-left:22px;margin:8px 0}
li{margin:3px 0}
.lead{color:var(--fg2);font-size:16px}
.muted{color:var(--fg2)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--bg3);font-size:12.5px;margin:2px 4px 2px 0;font-family:var(--mono)}
.meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--fg2);font-size:14px;margin:6px 0 4px}
.stars{letter-spacing:2px;color:var(--warn)}
.bloc-tag{font:600 12px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--bg3)}
:not(pre)>code{background:var(--bg3);padding:1px 5px;border-radius:5px;font-size:.9em}
.sec-ico{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:13px;flex:none}

/* ---------- Code ---------- */
.code{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:10px 0;background:var(--code-bg)}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px 5px 12px;border-bottom:1px solid var(--line);background:var(--bg3);font:12.5px var(--mono);color:var(--fg2)}
.copy-btn{border:1px solid var(--line);background:var(--bg2);border-radius:6px;padding:2px 9px;font-size:12px}
.copy-btn.done{color:var(--ok);border-color:var(--ok)}
pre{margin:0;padding:12px 14px;overflow:auto;font-size:13.2px;line-height:1.55;color:var(--code-fg);tab-size:4;-moz-tab-size:4}
.tk-kw{color:var(--tk-kw);font-weight:600}.tk-str{color:var(--tk-str)}.tk-com{color:var(--tk-com);font-style:italic}
.tk-num{color:var(--tk-num)}.tk-type{color:var(--tk-type)}.tk-fn{color:var(--tk-fn)}.tk-const{color:var(--tk-const)}.tk-bi{color:var(--tk-bi)}
.tk-todo{background:var(--warn-soft);color:var(--warn);font-weight:700;font-style:normal}

/* ---------- Exercice ---------- */
.ex-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.done-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg2);font-weight:600}
.done-btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hint{border:1px solid var(--line);border-radius:var(--radius);margin:8px 0;background:var(--bg2)}
.hint-h{padding:8px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.hint-b{padding:0 14px 10px}
.hint.locked .hint-h{color:var(--fg2);font-weight:500}
.reveal-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600}
.link-btn{background:none;border:0;color:var(--fg2);text-decoration:underline;padding:0;font-size:13px}
.trap{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:0 var(--radius) var(--radius) 0;padding:8px 14px;margin:8px 0;background:var(--bg2)}
.trap pre{padding:6px 10px;margin-top:6px;background:var(--bad-soft);border-radius:6px;color:var(--bad);white-space:pre-wrap;font-size:12.5px}
textarea.notes{width:100%;min-height:120px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:14px/1.5 var(--mono);resize:vertical}
.save-state{font-size:12.5px;color:var(--fg2);min-height:18px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.pager a{flex:1;min-width:200px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--fg);background:var(--bg2)}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--fg2)}
.bar{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ok)}
.res{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);margin:8px 0;text-decoration:none;color:var(--fg);background:var(--bg2)}
.res:hover{border-color:var(--accent)}
.res mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
.gloss dt{font-weight:700;margin-top:12px;font-family:var(--mono)}
.gloss dd{margin:2px 0 0 0;color:var(--fg)}
.svgwrap{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;overflow-x:auto}
.svgwrap svg{min-width:720px;width:100%;height:auto;display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:70;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;padding:18px 20px}
.modal textarea{width:100%;min-height:180px;font:12px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.storage-warn{display:none;background:var(--warn-soft);color:var(--warn);padding:6px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.storage-warn.show{display:block}

@media (max-width: 900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:53px;width:min(86vw,320px);z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  body.nav-open .sidebar{transform:none}
  .menu-btn{display:inline-flex}
  .tb-label{display:none}
  .progress-pill{display:none}
  .main{padding-top:20px}
  h1{font-size:23px}
}
@media (max-width: 560px){
  .brand{display:none}
  .search{min-width:0}
  .topbar{gap:6px;padding:8px 10px}
  .tb-btn{padding:7px 8px}
}
</style>

  <button class="tb-btn menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <a class="brand" href="#accueil"><span class="logo">AS</span><span class="bname">Agent Smith Trainer</span></a>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

<script>
'use strict';
/* =====================================================================
   DONNÉES — générées par trainer/build.py depuis trainer/content/*.yml
   Ne pas modifier ce bloc à la main : édite les YAML puis relance le build.
   ===================================================================== */
// __DATA_START__
const EXERCISES = [{"id":1,"bloc":"A","titre":"Parler à un LLM compatible OpenAI","niveau":1,"duree":"1 h 30","notions":["POST /chat/completions","messages system/user/assistant","usage.prompt_tokens / completion_tokens","httpx.Client et timeout","erreurs 429/5xx et backoff","rotation de clés API",".env et variables d'environnement","abstraction fournisseur"],"objectif":"Écrire un client minimal qui envoie une conversation à une API de chat compatible\nOpenAI, normalise la réponse (contenu, tokens, latence, retries) et encaisse les rate\nlimits avec un retry et une rotation de clés.\n","cours":"## Un LLM n'est pas une fonction locale\n\nUn « LLM compatible OpenAI » ne s'importe pas : c'est un serveur HTTP. Tu envoies un\nPOST sur `/chat/completions` et tu reçois du JSON. Tout Agent Smith tient sur ce tuyau :\nle même code doit pouvoir parler à OpenRouter, Groq, Together ou à un serveur local en\nchangeant seulement `api_url` et `model`.\n\n~~~python client minimal\nimport httpx\n\nresponse = httpx.post(\n    \"https://openrouter.ai/api/v1/chat/completions\",\n    headers={\"Authorization\": \"Bearer <ta clé lue dans l'environnement>\"},\n    json={\"model\": \"<ton modèle>\", \"messages\": [{\"role\": \"user\", \"content\": \"2+2 ?\"}]},\n    timeout=30.0,\n)\nresponse.raise_for_status()\ndata = response.json()\nprint(data[\"choices\"][0][\"message\"][\"content\"])\n~~~\n\nTrois choses vivent dans la configuration : le fournisseur (l'URL de base), la version\nd'API (`/v1`) et le modèle. Ton client ne doit en coder aucune en dur.\n\n## Le format d'une requête\n\n| Champ | Rôle |\n|---|---|\n| `model` | identifiant du modèle côté fournisseur |\n| `messages` | liste ordonnée de `{\"role\", \"content\"}` |\n| `stop` | séquences qui coupent la génération (exploité à l'exo 02) |\n| `temperature` | créativité ; laisse la valeur par défaut pour un agent |\n\nLes rôles sont une conversation, pas des options :\n- `system` : les règles de l'agent (outils disponibles, format attendu) ;\n- `user` : la tâche ou une observation du sandbox ;\n- `assistant` : ce que le modèle a déjà répondu (historique).\n\nLe modèle **ne se souvient de rien** entre deux appels : tu renvoies tout l'historique à\nchaque fois. C'est le prix de la mémoire, et c'est aussi pourquoi les tokens d'entrée\ngonflent à chaque tour (exo 03).\n\n~~~json réponse\n{\n  \"choices\": [{\"index\": 0, \"message\": {\"role\": \"assistant\", \"content\": \"4\"}, \"finish_reason\": \"stop\"}],\n  \"usage\": {\"prompt_tokens\": 24, \"completion_tokens\": 1, \"total_tokens\": 25}\n}\n~~~\n\nCe qui compte pour toi : `choices[0].message.content` et `usage`. `usage` est mesuré et\nfacturé (`prompt_tokens` + `completion_tokens`). Si le fournisseur l'omet, renvoie 0 :\nla moulinette contrôle la cohérence des totaux et de la trace : un token inventé se repère.\n\n## Ce qu'un client robuste ajoute\n\nUn POST nu ne suffit pas pour l'évaluation : les offres gratuites limitent le débit et\ntombent. Trois mécanismes, et c'est tout l'exercice.\n\n> [!] Une clé en dur est une fuite : elle finit sur GitHub, dans un log ou dans une\n> capture d'écran. Les clés vivent dans `.env` (non commité) et se lisent avec\n> `os.environ`. Aucune exception, même pour un exemple.\n\n**1. Le timeout.** Sans lui, une requête peut bloquer plusieurs minutes et ton agent\ndépassera la limite de 120 s. `httpx.Client(timeout=...)` s'applique à chaque requête ;\nun dépassement lève `httpx.TimeoutException`. Ne le confonds pas avec une erreur de\nstatut : c'est une erreur réseau, à traiter comme les 5xx.\n\n**2. Le retry avec backoff.** Toutes les erreurs ne se réessaient pas :\n\n| Statut | Réessayer ? | Pourquoi |\n|---|---|---|\n| 429 | oui | quota temporaire : attendre et/ou tourner de clé |\n| 500, 502, 503, 504 | oui | panne passagère du fournisseur |\n| 400, 401, 403, 404 | **non** | ta requête ou ta clé est fausse : réessayer n'y changera rien |\n\nBackoff exponentiel : 0,5 s, 1 s, 2 s… (on double à chaque tentative). Réessayer en\nboucle immédiate aggrave le rate limit. Plafonne le nombre de tentatives : un 429\npermanent ne doit pas occuper toute la deadline.\n\n~~~python boucle de retry\nretries = 0\nwhile True:\n    headers = {\"Authorization\": f\"Bearer {cle_courante()}\"}\n    response = http.post(url, headers=headers, json=payload)\n    if response.status_code in {429, 500, 502, 503, 504} and retries < MAX_ATTEMPTS:\n        time.sleep(0.5 * 2 ** retries)   # 0,5 s, 1 s, 2 s...\n        retries += 1\n        continue\n    response.raise_for_status()          # 4xx non-429 : lève immédiatement\n    return response\n~~~\n\n**3. La rotation de clés.** Le sujet l'exige (4.6.1) : plusieurs tokens par fournisseur.\nÀ chaque tentative, prends la clé suivante en round-robin. Une clé épuisée ne doit pas\nbloquer la tâche, et ton code ne présume jamais leur nombre (2 aujourd'hui, 5 le jour\nde la soutenance).\n\n## Mesurer sans mentir\n\n`request_time_ms` = durée du **dernier appel réussi**, mesurée avec\n`time.perf_counter()` autour du `post`. Ne mesure pas tout le retry : sinon tu mélanges\nattente imposée et latence réelle du modèle. `retries` = nombre de tentatives échouées\n**avant** le succès (0 si tout va bien du premier coup). Ces deux champs finiront dans\n`StepMetrics`, puis dans `solution.json`.\n\n> [ok] Garde le même `httpx.Client` pour toutes les requêtes : les connexions sont\n> réutilisées. C'est pour ça que le squelette le crée dans `__init__` et que les tests\n> remplacent `client.http` par un client branché sur `MockTransport`.\n","enonce":"1. Dans un dossier `ex01`, initialise un projet uv (`uv init --bare`) puis ajoute les\n   dépendances : `uv add httpx pytest`.\n2. Complète `chat(messages, stop=None)` : POST sur `f\"{api_url}/chat/completions\"`,\n   en-tête `Authorization: Bearer <clé>`, corps `{\"model\": ..., \"messages\": ...}`.\n3. N'ajoute la clé `stop` au corps que si `stop` n'est pas `None`, et envoie-la telle\n   quelle (liste de chaînes).\n4. Renseigne les tokens depuis `usage.prompt_tokens` / `usage.completion_tokens` ;\n   si `usage` est absent, mets 0. Aucune valeur inventée.\n5. `request_time_ms` : mesure le dernier appel en millisecondes (float), avec\n   `time.perf_counter()`. `retries` : nombre d'échecs avant le succès.\n6. Réessaie uniquement sur 429 et 5xx (1 essai + 4 retries, 5 requêtes max), avec un backoff exponentiel\n   strictement croissant à partir de 0,5 s. Sur les autres 4xx, laisse remonter\n   l'erreur `httpx.HTTPStatusError` via `response.raise_for_status()` sans réessayer.\n7. Rotation : chaque tentative consomme la clé suivante en round-robin, quel que soit\n   le nombre de clés fourni.\n8. Copie `test_llm_client.py` à côté de ton fichier et lance\n   `uv run pytest -q test_llm_client.py`.\n\nCas limites : `api_keys` vide (lève `ValueError` à la construction), réponse sans\n`usage`, `content` à `null` (renvoie une chaîne vide), `stop=None`, 400/401 sans retry,\n429 répété qui s'arrête au plafond. Aucun appel réseau : `MockTransport` répond.\n","depart":[{"fichier":"llm_client.py","code":"\"\"\"Client minimal pour une API de chat compatible OpenAI.\n\nLes tests fournis remplacent `client.http` par un client branché sur\n`httpx.MockTransport` : garde un seul `httpx.Client` réutilisé pour toutes\nles requêtes.\n\"\"\"\nfrom dataclasses import dataclass\n\nimport httpx\n\n\n@dataclass\nclass LLMResponse:\n    \"\"\"Réponse normalisée d'un fournisseur (mêmes champs que StepMetrics).\"\"\"\n\n    content: str\n    input_tokens: int\n    output_tokens: int\n    request_time_ms: float\n    retries: int\n\n\nclass LLMClient:\n    def __init__(\n        self,\n        api_url: str,\n        api_keys: list[str],\n        model: str,\n        timeout: float = 30.0,\n    ):\n        if not api_keys:\n            raise ValueError(\"au moins une clé API est requise\")\n        self.api_url = api_url\n        self.api_keys = list(api_keys)\n        self.model = model\n        self.timeout = timeout\n        self.http = httpx.Client(timeout=timeout)\n        self.key_index = 0\n        # TODO: normaliser api_url (slash final), gérer la rotation des clés.\n\n    def chat(self, messages: list[dict], stop: list[str] | None = None) -> LLMResponse:\n        \"\"\"Envoie `messages` à POST {api_url}/chat/completions.\"\"\"\n        # TODO: payload {model, messages[, stop]}\n        # TODO: en-tête Authorization: Bearer <clé courante> + rotation\n        # TODO: retry avec backoff sur 429/5xx uniquement, raise_for_status sinon\n        # TODO: mesurer la latence du dernier appel, lire choices[0] et usage\n        raise NotImplementedError(\"TODO\")\n"},{"fichier":".env.example","code":"# Copie ce fichier en .env (jamais commité) et remplis-le localement.\n# Le code lit les valeurs avec os.environ : aucune clé en dur, même factice.\nLLM_API_URL=https://openrouter.ai/api/v1\nLLM_MODEL=\nLLM_API_KEYS=\n"}],"indices":["Commence par un seul appel sans retry : un `post`, un `raise_for_status`, un\n`response.json()`. Tant que ce chemin ne marche pas, le retry ne peut rien\ncorriger. Demande-toi ensuite ce qui doit être mesuré *autour* de ce post.\n","`httpx.Client` possède `timeout` ; `remember = time.perf_counter()` avant l'appel,\n`(time.perf_counter() - remember) * 1000` après. Pour les statuts :\n`response.status_code in {...}`. Pour le JSON :\n`data[\"choices\"][0][\"message\"][\"content\"]` et `data.get(\"usage\") or {}`.\n","Structure : construis `payload` une fois, puis une boucle `while True` qui envoie,\nincrémente `retries` et dort `0.5 * 2 ** retries` quand le statut mérite un retry,\nsort de la boucle par `raise_for_status()` dans les autres cas, et retourne la\n`LLMResponse` sur un 2xx. La clé courante : `api_keys[index % len(api_keys)]`, index\nincrémenté à chaque tentative. Pour le temps, garde la durée du dernier `post` (pas\nla durée totale). Vérifie que `stop` n'est ajouté que s'il est fourni.\n"],"pieges":[{"titre":"Oublier l'en-tête `Authorization` (ou le mal construire).\n","erreur":"KeyError: 'authorization' (test_chat_returns_content_and_usage) ; en réel, le\nfournisseur répond `httpx.HTTPStatusError: Client error '401 Unauthorized'`.\n"},{"titre":"Réessayer un 400/401 comme un 5xx.\n","erreur":"AssertionError: assert 5 == 1 (test_no_retry_on_400) : la requête a été renvoyée\n5 fois alors que le statut est définitif.\n"},{"titre":"Utiliser une seule clé, même quand `api_keys` en contient plusieurs.\n","erreur":"AssertionError: assert ['Bearer test-key-1', 'Bearer test-key-1', 'Bearer test-key-1'] ==\n['Bearer test-key-1', 'Bearer test-key-2', 'Bearer test-key-3']\n"},{"titre":"Aucun timeout sur le client HTTP.\n","erreur":"L'agent reste bloqué et se fait tuer par la deadline (120 s) avant d'écrire\nsolution.json ; localement, `httpx.ReadTimeout` si le serveur ne répond jamais.\n"},{"titre":"Inventer les tokens (par exemple compter les caractères) au lieu de lire `usage`.\n","erreur":"total_input_tokens ne correspond pas à `usage.prompt_tokens` : en soutenance,\nles données fabriquées sont détectées et la tâche est invalidée.\n"}],"verification":{"consigne":"Copie `test_llm_client.py` dans le même dossier que `llm_client.py`, puis lance la\ncommande. Les tests instancient ton client et remplacent `client.http` par un\n`httpx.MockTransport` : aucun réseau, aucune clé réelle. pytest affiche aussi une\ndurée (« in 0.05s ») qui varie : seule la ligne « 4 passed » compte.\n","commande":"uv run pytest -q test_llm_client.py\n","fichiers":[{"nom":"test_llm_client.py","code":"\"\"\"Tests hors ligne du client LLM : aucun réseau, aucune clé réelle.\n\n`client.http` est remplacé par un `httpx.Client` branché sur un `MockTransport`.\n\"\"\"\nimport json\n\nimport httpx\nimport pytest\n\nfrom llm_client import LLMClient\n\nAPI_URL = \"http://llm.test/v1\"\nMODEL = \"test-model\"\n\n\ndef openai_json(content, prompt_tokens=11, completion_tokens=5):\n    return {\n        \"id\": \"chatcmpl-test\",\n        \"object\": \"chat.completion\",\n        \"model\": MODEL,\n        \"choices\": [\n            {\n                \"index\": 0,\n                \"message\": {\"role\": \"assistant\", \"content\": content},\n                \"finish_reason\": \"stop\",\n            }\n        ],\n        \"usage\": {\n            \"prompt_tokens\": prompt_tokens,\n            \"completion_tokens\": completion_tokens,\n            \"total_tokens\": prompt_tokens + completion_tokens,\n        },\n    }\n\n\n# Clés factices locales aux tests : aucun secret, aucun réseau.\ndef make_client(handler, keys=(\"test-key-1\", \"test-key-2\", \"test-key-3\")):\n    client = LLMClient(API_URL, list(keys), MODEL, timeout=5.0)\n    client.http = httpx.Client(transport=httpx.MockTransport(handler))\n    return client\n\n\ndef test_chat_returns_content_and_usage():\n    seen = []\n\n    def handler(request):\n        seen.append(request)\n        return httpx.Response(200, json=openai_json(\"Bonjour !\"))\n\n    response = make_client(handler).chat([{\"role\": \"user\", \"content\": \"salut\"}])\n\n    assert response.content == \"Bonjour !\"\n    assert response.input_tokens == 11\n    assert response.output_tokens == 5\n    assert response.retries == 0\n    assert isinstance(response.request_time_ms, float) and response.request_time_ms >= 0\n    assert seen[0].url == \"http://llm.test/v1/chat/completions\"\n    assert seen[0].headers[\"authorization\"] == \"Bearer test-key-1\"\n\n\ndef test_retries_429_with_backoff_and_key_rotation(monkeypatch):\n    sleeps = []\n    monkeypatch.setattr(\"time.sleep\", lambda seconds: sleeps.append(seconds))\n    seen = []\n\n    def handler(request):\n        seen.append(request)\n        if len(seen) < 3:\n            return httpx.Response(429, json={\"error\": {\"message\": \"rate limit\"}})\n        return httpx.Response(200, json=openai_json(\"ok\"))\n\n    response = make_client(handler).chat([{\"role\": \"user\", \"content\": \"salut\"}])\n\n    assert response.content == \"ok\"\n    assert response.retries == 2\n    assert len(seen) == 3\n    keys = [request.headers[\"authorization\"] for request in seen]\n    assert keys == [\"Bearer test-key-1\", \"Bearer test-key-2\", \"Bearer test-key-3\"]\n    assert len(sleeps) == 2 and sleeps[0] > 0 and sleeps[1] > sleeps[0]\n\n\ndef test_no_retry_on_400():\n    seen = []\n\n    def handler(request):\n        seen.append(request)\n        return httpx.Response(400, json={\"error\": {\"message\": \"bad request\"}})\n\n    client = make_client(handler)\n    with pytest.raises(httpx.HTTPStatusError):\n        client.chat([{\"role\": \"user\", \"content\": \"salut\"}])\n    assert len(seen) == 1\n\n\ndef test_request_payload_and_stop():\n    bodies = []\n\n    def handler(request):\n        bodies.append(json.loads(request.content))\n        return httpx.Response(200, json=openai_json(\"ok\"))\n\n    messages = [\n        {\"role\": \"system\", \"content\": \"Tu es un agent.\"},\n        {\"role\": \"user\", \"content\": \"Écris add(a, b).\"},\n    ]\n    client = make_client(handler)\n    client.chat(messages)\n    client.chat(messages, stop=[\"<end_code>\"])\n\n    assert bodies[0][\"model\"] == \"test-model\"\n    assert bodies[0][\"messages\"] == messages\n    assert \"stop\" not in bodies[0]\n    assert bodies[1][\"stop\"] == [\"<end_code>\"]\n"}],"sortie":"4 passed\n"},"bonus":"Branche un vrai fournisseur gratuit en lisant `.env` avec `python-dotenv` (jamais\ncommité) et vérifie `usage` sur un appel réel. Ajoute ensuite un fallback de\nfournisseur quand tous les retries échouent, et un log JSONL par requête\n(`url`, `model`, `status`, `latency_ms`, `retries`) : ces traces alimenteront le\nrapport de benchmark et la traçabilité exigée en 5.4.1.\n","lienProjet":"Ce client est la seule porte de sortie réseau de l'agent : l'agent MBPP (exo 09) et\nl'agent SWE-bench (exo 10) passent tous par lui. Ses champs `input_tokens`,\n`output_tokens`, `request_time_ms` et `retries` remplissent directement `StepMetrics`,\net les totaux agrégés alimentent `SolutionOutput.total_*`. La rotation de clés et le\nretry conditionnel sont des attentes du sujet (4.6.1 et 5.2), et l'abstraction\n`api_url` + `model` rend possible la comparaison multi-fournisseurs du rapport (4.7).\n"},{"id":2,"bloc":"A","titre":"Extraire du code et des appels d'outils","niveau":2,"duree":"1 h 15","notions":["blocs de code Python","<end_code> et stop_sequences","appels XML Anthropic","tool_call Hermes (JSON)","ReAct Action / Action Input","conversion en appels Python","extraction défensive (None, bloc malformé)"],"objectif":"Transformer les réponses texte d'un LLM en code Python exécutable : extraire le bon\nbloc, convertir les formats d'appels d'outils XML, JSON et ReAct, et signaler proprement\nl'absence ou la malformation du code.\n","cours":"## Le modèle produit du texte, pas des actions\n\nUn LLM ne « lance » pas une fonction : il écrit du texte. Entre sa réponse et ton\nsandbox, il y a donc une étape que le sujet appelle **extraction** : transformer ce\ntexte en code Python exécutable. Une regex fausse et l'agent boucle sur des\nobservations hallucinées.\n\nCette couche existe aussi parce que tu vas benchmarker plusieurs fournisseurs (4.7) :\nchacun a ses habitudes apprises.\n\n| Format | Ce que tu vois | D'où ça vient |\n|---|---|---|\n| Python | blocs de code (fence + langage) ou `...<end_code>` | modèles orientés code (majorité) |\n| XML | `<invoke name=\"read_file\"><parameter ...>` | Claude / Anthropic |\n| Hermes | `<tool_call>{\"name\": ..., \"arguments\": {...}}</tool_call>` | Qwen / Hermes |\n| ReAct | `Action: read_file` + `Action Input: {...}` | papier ReAct |\n\nTous finissent sous la même forme : du Python. Le sandbox reste agnostique du fournisseur.\n\n## Format Python : premier bloc, propre, ou rien\n\n~~~text réponse LLM\nThought: je lis le fichier puis je corrige.\n\n```python\ncontenu = read_file(filepath=\"/testbed/models.py\")\nprint(contenu)\n```\n<end_code>\n~~~\n\nTrois variantes : le langage peut être `python`, `py` ou absent ; la fin peut être la\nclôture du bloc ou `<end_code>` ; le bloc peut être malformé (pas de clôture). Le\nmarqueur `<end_code>`, combiné à `stop=[\"<end_code>\"]`, coupe la génération avant que\nle modèle invente une observation qu'il n'a pas reçue (sujet, 4.6).\n\nRègles de la maison pour `extract_python_code` :\n- renvoyer `None` (pas `\"\"`) quand il n'y a pas de code : l'appelant doit distinguer\n  « pas de code » et renvoyer un feedback explicite au modèle ;\n- renvoyer le **premier** bloc Python seulement : concaténer deux blocs produit du code\n  invalide (deux `return` collés) ;\n- ignorer les blocs d'un autre langage (`json`, `bash`) ;\n- `strip()` le résultat : les lignes vides autour ne regardent pas le sandbox.\n\n> [!] Piège numéro un : la regex gourmande. Un motif dont le groupe est `.*` avale\n> tout jusqu'à la **dernière** clôture du texte. Utilise `.*?`. Piège numéro deux :\n> oublier `re.DOTALL`, et `.` ne traverse plus les nouvelles lignes.\n\n~~~python regex.py\nre.search(r\"```python(.*)```\", text, re.S)    # gourmand : trop loin\nre.search(r\"```python(.*?)```\", text, re.S)   # non gourmand : premier bloc\n~~~\n\n## XML et JSON : convertir, ne pas exécuter\n\nLes deux formats outil portent un nom et des arguments nommés. Convertis-les en appel\nPython avant le sandbox :\n\n~~~python sortie attendue\nresult = read_file(filepath='/testbed/models.py', start=1)\n~~~\n\n~~~text payloads décodés\nXML      {\"name\": \"read_file\", \"parameters\": {\"filepath\": \"/testbed/models.py\"}}\nHermes   {\"name\": \"read_file\", \"arguments\": {\"filepath\": \"/testbed/models.py\"}}\n~~~\n\nMême contenu, une clé de dictionnaire différente. `convert_tool_call` accepte les deux,\ngarde l'ordre des arguments et lève `ValueError` si le nom manque. Pour les valeurs,\n`repr()` est l'outil juste : il produit un littéral Python correct (chaînes entre\napostrophes, listes, dicts imbriqués) sans `eval`. Ne fabrique pas la chaîne avec\n`f\"{k}={v}\"` : tu perds les guillemets et le sandbox lève `SyntaxError`.\n\n> [!] `convert_tool_call` ne doit **jamais** exécuter le payload. C'est du texte produit\n> par un LLM ; c'est le sandbox (exo 04) qui l'exécutera, sous contrôle.\n\n## ReAct : lire les paires Action / Action Input\n\n~~~text réponse ReAct\nThought: je dois comprendre l'échec du test.\nAction: read_file\nAction Input: {\"filepath\": \"/testbed/models.py\"}\n\nObservation: ...\nAction: run_tests\nAction Input: {\"test_list\": [\"test_add\"]}\n~~~\n\n`extract_actions` renvoie les appels déjà convertis, dans l'ordre. Une réponse sans\n`Action:` donne une liste vide ; l'agent la traitera comme « pas de code » et demandera\nune correction.\n\n## Le feedback explicite n'est pas optionnel\n\nLe sujet (4.1) liste ce que le sandbox doit dire au modèle : aucun bloc trouvé, bloc\nmalformé interprété, sortie partielle après timeout, troncature. Ton extraction doit\nrendre ce diagnostic possible : `None` = pas de code, et l'agent renvoie un message du\ntype « aucun bloc de code trouvé, réponds avec un bloc python ». Silencieux, le modèle\nsuppose que ça a marché et hallucine l'observation suivante.\n","enonce":"1. Dans un dossier `ex02`, initialise uv (`uv init --bare`) et ajoute pytest\n   (`uv add pytest`).\n2. Complète `extract_python_code(text)` : renvoie le premier bloc Python nettoyé\n   (sans fences ni lignes vides autour), ou `None` s'il n'y a aucun code.\n3. Gère les variantes : langage `python` / `py` / absent, clôture par une fence de\n   `<end_code>`, et bloc non clôturé (récupère jusqu'à la fin du texte).\n4. Ignore les blocs d'autres langages (`json`, `bash`) et ne renvoie que le premier\n   bloc Python, jamais la concaténation.\n5. Complète `convert_tool_call(payload)` : lis `name` et les arguments\n   (`arguments` pour Hermes, `parameters` pour XML), produis\n   `result = nom(arg=valeur, ...)` dans l'ordre du payload, avec `repr()` pour les\n   valeurs. Lève `ValueError` si le nom manque.\n6. Complète `extract_actions(text)` : repère chaque paire `Action:` / `Action Input:`,\n   décode le JSON, convertis avec `convert_tool_call`, renvoie la liste dans l'ordre.\n   Aucune action => liste vide.\n7. Aucune exécution du payload, aucun `eval` : tu produis du texte, le sandbox exécute.\n8. Copie `test_extract.py` à côté de ton fichier et lance\n   `uv run pytest -q test_extract.py` : les 9 tests doivent passer.\n\nCas limites : texte vide, texte sans code, texte avec uniquement un bloc `json`,\nbloc ouvert sans clôture, payload sans nom, arguments vides (`result = run_tests()`).\n","depart":[{"fichier":"extract.py","code":"\"\"\"Extraction du code et des appels d'outils générés par un LLM.\"\"\"\n\n\ndef extract_python_code(text: str) -> str | None:\n    \"\"\"Renvoie le premier bloc Python nettoyé, ou None s'il n'y en a pas.\"\"\"\n    # TODO: blocs ```python / ```py / ```, clôture ``` ou <end_code>,\n    # bloc non clôturé récupéré jusqu'à la fin, None si aucun code.\n    raise NotImplementedError(\"TODO\")\n\n\ndef convert_tool_call(payload: dict) -> str:\n    \"\"\"Convertit {'name', 'arguments'|'parameters'} en appel Python.\"\"\"\n    # TODO: lire le nom, lire les arguments, produire \"result = outil(k=v, ...)\"\n    # avec repr() pour les valeurs, et lever ValueError si le nom manque.\n    raise NotImplementedError(\"TODO\")\n\n\ndef extract_actions(text: str) -> list[str]:\n    \"\"\"Renvoie les paires ReAct Action/Action Input converties, dans l'ordre.\"\"\"\n    # TODO: repérer les lignes Action: puis Action Input:, décoder le JSON,\n    # convertir avec convert_tool_call, renvoyer [] s'il n'y a aucune action.\n    raise NotImplementedError(\"TODO\")\n"}],"indices":["Commence par le cas nominal : un seul bloc de code Python fermé par une fence, au\ntexte. Écris d'abord une regex, teste-la sur une réponse réelle, puis ajoute les\nvariantes une par une. Pour la conversion, pars d'un payload minimal\n`{\"name\": \"run_tests\", \"arguments\": {}}`.\n","`re.search` + `re.DOTALL` pour traverser les lignes ; `.*?` pour le non-gourmand ;\n`re.IGNORECASE` pour `Python`. Pour le bloc ouvert sans clôture, un second motif\nsuffit. Pour les arguments, `repr()` sur chaque valeur et `\", \".join(...)` sur les\n`clé=valeur`. Pour les actions, `str.splitlines()` et `json.loads` du texte qui suit\n`Action Input:`.\n","Ordre de la fonction d'extraction : cherche d'abord un bloc fermé (par une fence ou\n`<end_code>`), puis, si rien, un bloc ouvert et prends le reste du texte ; nettoie\navec `strip()` ; si le résultat est vide, renvoie `None`. Pour `convert_tool_call` :\n`name = payload.get(\"name\")`, lève `ValueError` s'il est absent, puis\n`arguments = payload.get(\"arguments\", payload.get(\"parameters\", {}))`. Pour\n`extract_actions`, parcours les lignes, et quand une ligne est `Action: nom`,\nregarde la suivante non vide ; si elle commence par `Action Input:`, décode le JSON,\nenveloppe dans `{\"name\": nom, \"arguments\": ...}` et convertis.\n"],"pieges":[{"titre":"Regex gourmande : `(.*)` au lieu de `(.*?)`. Deux blocs Python dans une réponse se\nretrouvent collés.\n","erreur":"AssertionError: assert 'first = 1\\n```\\n\\n```python\\nsecond = 2' == 'first = 1'\n(test_ignores_other_languages_and_takes_first_block)\n"},{"titre":"Oublier `re.DOTALL` : le point ne traverse pas les lignes, la regex ne matche que\nla première ligne ou rien du tout.\n","erreur":"AssertionError: assert None == 'def add(a, b):\\n    return a + b'\n(test_python_fenced_block)\n"},{"titre":"Renvoyer `\"\"` au lieu de `None` quand il n'y a pas de code.\n","erreur":"AssertionError: assert '' is None (test_no_code_returns_none) ; l'agent croira\navoir du code et enverra une chaîne vide au sandbox.\n"},{"titre":"Construire l'appel avec `f\"{k}={v}\"` au lieu de `repr(v)` : les chaînes perdent\nleurs guillemets.\n","erreur":"Le sandbox reçoit `result = read_file(filepath=/testbed/models.py)` et lève\n`SyntaxError: invalid syntax` ; côté test,\n`assert \"result = read_file(filepath=/testbed/models.py)\" == \"result = read_file(filepath='/testbed/models.py')\"`.\n"},{"titre":"Ne lire que la clé `arguments` (Hermes) et oublier `parameters` (XML), ou\nl'inverse : l'appel part sans aucun argument.\n","erreur":"AssertionError: assert 'result = read_file()' ==\n\"result = read_file(filepath='/testbed/models.py', start=1, end=50)\"\n(test_convert_xml_tool_call_keeps_arguments).\n"}],"verification":{"consigne":"Copie `test_extract.py` dans le même dossier que `extract.py`, puis lance la\ncommande. Les tests sont purement locaux (chaînes de caractères), aucun réseau.\npytest affiche une durée variable ; seule la ligne « 8 passed » compte.\n","commande":"uv run pytest -q test_extract.py\n","fichiers":[{"nom":"test_extract.py","code":"\"\"\"Tests hors ligne de la couche d'extraction (aucun réseau, aucun LLM).\"\"\"\nimport pytest\n\nfrom extract import convert_tool_call, extract_actions, extract_python_code\n\n\ndef test_python_fenced_block():\n    text = \"Thought: je corrige la fonction.\\n\\n```python\\ndef add(a, b):\\n    return a + b\\n```\\n\"\n    assert extract_python_code(text) == \"def add(a, b):\\n    return a + b\"\n\n\ndef test_end_code_marker_terminates_block():\n    text = \"```python\\nprint('hello')\\n<end_code>\"\n    assert extract_python_code(text) == \"print('hello')\"\n\n\ndef test_unclosed_block_is_recovered():\n    text = \"Je corrige :\\n```python\\nx = 1\\nprint(x)\\n\"\n    assert extract_python_code(text) == \"x = 1\\nprint(x)\"\n\n\ndef test_ignores_other_languages_and_takes_first_block():\n    text = (\n        '```json\\n{\"a\": 1}\\n```\\n\\n'\n        \"```bash\\nls -la\\n```\\n\\n\"\n        \"```python\\nfirst = 1\\n```\\n\\n\"\n        \"```python\\nsecond = 2\\n```\\n\"\n    )\n    assert extract_python_code(text) == \"first = 1\"\n\n\ndef test_block_without_language():\n    text = \"Je corrige :\\n```\\nx = 1\\nprint(x)\\n```\\n\"\n    assert extract_python_code(text) == \"x = 1\\nprint(x)\"\n\n\ndef test_no_code_returns_none():\n    assert extract_python_code(\"Thought: je réfléchis encore, pas de code.\") is None\n    assert extract_python_code(\"\") is None\n    assert extract_python_code('```json\\n{\"a\": 1}\\n```') is None\n\n\ndef test_convert_xml_tool_call_keeps_arguments():\n    payload = {\n        \"name\": \"read_file\",\n        \"parameters\": {\"filepath\": \"/testbed/models.py\", \"start\": 1, \"end\": 50},\n    }\n    expected = \"result = read_file(filepath='/testbed/models.py', start=1, end=50)\"\n    assert convert_tool_call(payload) == expected\n\n\ndef test_convert_hermes_tool_call_keeps_nested_values():\n    payload = {\n        \"name\": \"run_tests\",\n        \"arguments\": {\"test_list\": [\"test_add\", \"test_sub\"], \"verbose\": True},\n    }\n    expected = \"result = run_tests(test_list=['test_add', 'test_sub'], verbose=True)\"\n    assert convert_tool_call(payload) == expected\n\n\ndef test_extract_actions_react():\n    text = (\n        \"Thought: je lis le fichier.\\n\"\n        \"Action: read_file\\n\"\n        'Action Input: {\"filepath\": \"/testbed/models.py\"}\\n\\n'\n        \"Observation: ...\\n\"\n        \"Action: run_tests\\n\"\n        'Action Input: {\"test_list\": [\"test_add\"]}\\n'\n    )\n    assert extract_actions(text) == [\n        \"result = read_file(filepath='/testbed/models.py')\",\n        \"result = run_tests(test_list=['test_add'])\",\n    ]\n    assert extract_actions(\"Thought: rien à faire.\") == []\n    with pytest.raises(ValueError):\n        convert_tool_call({\"arguments\": {}})\n"}],"sortie":"9 passed\n"},"bonus":"Ajoute la détection des blocs bruts `<invoke ...>` (XML) et `<tool_call>...</tool_call>`\n(Hermes) dans le texte, en réutilisant `convert_tool_call` sur le payload décodé.\nTeste plusieurs blocs `tool_call` dans une même réponse, puis branche l'extracteur sur\nl'agent de l'exo 03 et observe le feedback quand le modèle répond en prose.\n","lienProjet":"C'est le point 2 de l'architecture du sujet : entre la réponse LLM et le sandbox. En\nconvertissant XML, Hermes et ReAct vers du Python, tu peux changer de fournisseur sans\ntoucher au sandbox et comparer les modèles dans le rapport (4.7). Les `stop_sequences`\net le feedback d'extraction évitent les observations inventées. Cette couche est\nréutilisée en 09 (extraire la fonction MBPP) et en 10 (récupérer le patch).\n"},{"id":3,"bloc":"A","titre":"Boucler Thought → Code → Observation","niveau":3,"duree":"2 h","notions":["boucle Thought → Code → Observation","historique de messages","system prompt et outils","final_answer (pas un outil MCP)","budgets cumulés (itérations, tokens)","deadline et troncature des observations","StepMetrics","SolutionOutput / solution.json"],"objectif":"Écrire la boucle d'agent complète : appeler le LLM, extraire le code, l'exécuter dans\nun sandbox, réinjecter l'observation, et s'arrêter proprement sur `final_answer` ou sur\nun garde-fou, en produisant des `StepMetrics` et un `SolutionOutput` exploitables.\n","cours":"## Une seule boucle, trois responsabilités\n\nL'agent n'est pas « un LLM qui fait tout ». C'est une boucle que **tu** écris et qui\nalterne trois responsabilités (sujet, 4.1) :\n\n1. **Générer** : appeler le LLM avec le system prompt, l'historique et la tâche.\n2. **Extraire** : transformer sa réponse en code Python (exo 02).\n3. **Exécuter** : lancer ce code dans le sandbox (exos 04–06), qui expose les outils\n   MCP et `final_answer`.\n\nPuis tu ajoutes le résultat comme observation et tu recommences. Le modèle n'a aucune\nmémoire entre deux appels : tout ce qu'il sait, c'est ce que tu remets dans `messages`.\n\n~~~text trace d'une itération\nmessages = [system, user(task)]\n  -> LLM              \"Thought: ... ```python code1```\"\n  -> extraction       \"code1\"\n  -> sandbox          stdout / erreur / final_answer\nmessages += [assistant(réponse brute), user(\"Observation: ...\")]\n  -> LLM              \"```python final_answer(...)```\"\n  -> sandbox          final_answer capturé -> stop\n~~~\n\n`final_answer` **n'est pas un outil MCP** : c'est une fonction que le *sandbox* injecte\ndans l'espace de noms, alors que MCP tourne hors du sandbox (fichiers Docker, tests).\n`final_answer` arrête la boucle, un outil MCP agit. Confondre les deux, c'est ne plus\navoir de moyen propre de s'arrêter.\n\n## Le system prompt fait partie du contrat\n\nIl documente les outils disponibles **et** le format attendu : un bloc python par tour,\n`final_answer(code)` à la fin, et la forme de l'observation que tu renvoies. Un bon\nprompt d'agent est ennuyeux et explicite : noms, paramètres, un exemple de tour réussi,\nun exemple d'erreur. `SolutionOutput.system_prompt` doit contenir le prompt réellement\nenvoyé (traçabilité, 5.4.1).\n\n> [!] Ne mets jamais dans le system prompt des résultats de tests ou des réponses\n> attendues : c'est de la triche, et `solution.json` doit refléter une vraie exécution.\n\n## Garde-fous : itérations, tokens, temps\n\n| Limite MBPP | Valeur | Ce que ça protège |\n|---|---|---|\n| itérations max | 10 | boucle infinie |\n| tokens d'entrée max | 6 000 | historique qui gonfle |\n| tokens de sortie max | 1 500 | générations interminables |\n| timeout | 120 s | blocage total |\n\nLes tokens sont **cumulés** sur toute la tâche, pas par requête : un tour qui tient sous\n1 500 tokens de sortie peut faire dépasser le budget au troisième. L'historique complet\nrepart à chaque appel, donc le coût d'entrée croît à chaque tour.\n\n~~~python garde-fous (pseudo-code)\nstarted = time.monotonic()\nfor step in range(1, max_iterations + 1):\n    if time.monotonic() - started > deadline_s:\n        return failure(\"deadline dépassée\")\n    response = llm.chat(messages, stop=[\"<end_code>\"])\n    total_input += response.input_tokens\n    total_output += response.output_tokens\n    ... exécution, observation, ajout à messages ...\n    if total_input > max_input_tokens:\n        return failure(\"budget de tokens d'entrée dépassé\")\n~~~\n\nVérifie les budgets **après** un cycle complet : le cycle qui fait dépasser compte dans\n`iterations`, mais aucun cycle suivant ne démarre. **Troncature** : coupe l'observation\nà 2 000 caractères et ajoute un marqueur `[tronqué]` avec la taille réelle ; le modèle\ndoit savoir que l'observation est partielle. **Feedback** : « aucun bloc de code\ntrouvé », « timeout, sortie partielle », « erreur de syntaxe : ... » — une boucle\nmuette produit des observations hallucinées.\n\n## Deux modèles imposés par le sujet\n\n`StepMetrics` : une entrée par cycle LLM → sandbox. `step` (1-indexé), `input_tokens`,\n`output_tokens`, `request_time_ms`, `timestamp`, `api_url`, `model_name`, `llm_output`\n(réponse brute), `sandbox_input` (code extrait), `sandbox_output` (résultat), `retries`.\nIls sont déjà écrits dans le squelette : ne les renomme pas.\n\n`SolutionOutput` : ce que tu produis pour `solution.json`. `task_id`, `benchmark`\n(`mbpp` ou `swebench`), `success`, `solution`, `iterations`, `total_requests`, les\ntotaux de tokens, `total_time_seconds`, `steps`, `system_prompt`, `error`, `timestamp`.\n\n~~~json solution.json (extrait)\n{\n  \"task_id\": \"mbpp_11\",\n  \"benchmark\": \"mbpp\",\n  \"success\": true,\n  \"solution\": \"def add(a, b):\\n    return a + b\",\n  \"iterations\": 2,\n  \"total_requests\": 2,\n  \"steps\": [{\"step\": 1, \"input_tokens\": 512, \"output_tokens\": 40,\n             \"llm_output\": \"...\", \"sandbox_input\": \"...\", \"sandbox_output\": \"...\"}]\n}\n~~~\n\n`total_requests` inclut les retries (`1 + retries` par appel). `success` ne se déduit\npas du texte du modèle : c'est le sandbox qui a capturé `final_answer`.\n\n> [ok] Une exception du sandbox n'arrête pas l'agent : transforme-la en observation\n> lisible et continue. L'agent qui plante rend une tâche échouée sans métriques ;\n> l'agent qui boucle proprement laisse des traces exploitables.\n","enonce":"1. Dans un dossier `ex03`, initialise uv (`uv init --bare`) puis ajoute les dépendances :\n   `uv add pydantic pytest`.\n2. Garde les modèles `StepMetrics` et `SolutionOutput` fournis dans `agent.py` : ce sont\n   les champs exacts du sujet.\n3. Implémente `Agent.run(task)` où `task` est un dict\n   `{\"task_id\": str, \"prompt\": str[, \"benchmark\": \"mbpp\" | \"swebench\"]}` ; lis\n   `benchmark = task.get(\"benchmark\", \"mbpp\")` (défaut MBPP).\n4. Initialise `messages` avec le system prompt (`role: system`) puis la tâche\n   (`role: user`).\n5. Boucle au plus `max_iterations` fois : vérifie la deadline avant l'appel, appelle\n   `llm.chat(messages, stop=[\"<end_code>\"])`, cumule les tokens et les requêtes\n   (`1 + retries`), extrais le code, exécute-le dans `sandbox.run(code)`.\n6. Après chaque cycle, ajoute la réponse brute du LLM (`role: assistant`) puis\n   l'observation formatée (`role: user`). Le texte de l'observation **commence\n   littéralement** par `Observation:` (le test le vérifie). Si le résultat du sandbox\n   porte un `final_answer`, arrête la boucle et renseigne `success` et `solution`.\n7. Formate l'observation avec stdout, stderr et error ; tronque-la à\n   `MAX_OBSERVATION_CHARS` (constante fournie) en ajoutant `[tronqué]`. Si aucun code\n   n'est trouvé, renvoie un feedback explicite au modèle.\n8. Renseigne `StepMetrics` à chaque cycle (`api_url` et `model_name` depuis le LLM\n   injecté) et construis `SolutionOutput` avec les totaux et `error` si échec ;\n   `system_prompt` doit contenir exactement le prompt système reçu.\n9. Copie `test_agent.py` à côté de ton fichier et lance\n   `uv run pytest -q test_agent.py` : les 5 tests doivent passer.\n\nCas limites : `final_answer` au premier tour, réponse sans bloc de code, 400/500 décidé\npar le budget d'itérations, cumul de tokens qui dépasse, observation géante tronquée,\nsandbox en erreur (l'agent continue). Aucun réseau : LLM et sandbox sont des doublures.\n","depart":[{"fichier":"agent.py","code":"\"\"\"Boucle Thought → Code → Observation (squelette).\n\nLes modèles StepMetrics et SolutionOutput sont imposés par le sujet : ils sont\nfournis. À toi d'implémenter Agent.run. L'extracteur de code est une version\nsimplifiée de l'exercice 02, fournie elle aussi.\n\"\"\"\nimport re\nimport time\nfrom datetime import datetime\n\nfrom pydantic import BaseModel, Field\n\nMAX_OBSERVATION_CHARS = 2000\n\n_BLOCK = re.compile(\n    r\"```(?:python|py)[ \\t]*\\r?\\n(.*?)(?:```|<end_code>)\", re.DOTALL | re.IGNORECASE\n)\n_BLOCK_OPEN = re.compile(r\"```(?:python|py)[ \\t]*\\r?\\n(.*)\", re.DOTALL | re.IGNORECASE)\n\n\ndef extract_code(text: str) -> str | None:\n    \"\"\"Version simplifiée de l'extracteur de l'exercice 02.\"\"\"\n    match = _BLOCK.search(text or \"\") or _BLOCK_OPEN.search(text or \"\")\n    if match is None:\n        return None\n    return match.group(1).strip() or None\n\n\nclass StepMetrics(BaseModel):\n    \"\"\"Une entrée par cycle LLM -> sandbox, telle que définie par le sujet.\"\"\"\n\n    step: int\n    input_tokens: int\n    output_tokens: int\n    request_time_ms: float\n    timestamp: str = Field(default_factory=lambda: datetime.now().isoformat())\n    api_url: str = \"\"\n    model_name: str = \"\"\n    llm_output: str = \"\"\n    sandbox_input: str = \"\"\n    sandbox_output: str = \"\"\n    retries: int = 0\n\n\nclass SolutionOutput(BaseModel):\n    \"\"\"Contenu de solution.json, tel que défini par le sujet.\"\"\"\n\n    task_id: str\n    benchmark: str\n    success: bool\n    solution: str\n    iterations: int\n    total_requests: int\n    total_input_tokens: int\n    total_output_tokens: int\n    total_time_seconds: float\n    steps: list[StepMetrics] = Field(default_factory=list)\n    system_prompt: str = \"\"\n    error: str | None = None\n    timestamp: str = Field(default_factory=lambda: datetime.now().isoformat())\n\n\nclass Agent:\n    def __init__(\n        self,\n        llm,\n        sandbox,\n        system_prompt: str,\n        max_iterations: int = 10,\n        max_input_tokens: int = 6000,\n        max_output_tokens: int = 1500,\n        deadline_s: float = 120.0,\n    ):\n        self.llm = llm\n        self.sandbox = sandbox\n        self.system_prompt = system_prompt\n        self.max_iterations = max_iterations\n        self.max_input_tokens = max_input_tokens\n        self.max_output_tokens = max_output_tokens\n        self.deadline_s = deadline_s\n        self.api_url = getattr(llm, \"api_url\", \"\")\n        self.model_name = getattr(llm, \"model\", \"\")\n\n    def run(self, task: dict) -> SolutionOutput:\n        \"\"\"Boucle jusqu'à final_answer, épuisement des budgets, ou deadline.\"\"\"\n        # TODO: messages initiaux [system, user(task[\"prompt\"])]\n        # TODO: boucle bornée par max_iterations avec deadline et troncature\n        # TODO: extraire le code, appeler sandbox.run, formater l'observation\n        # TODO: réinjecter assistant(réponse brute) + user(observation)\n        # TODO: arrêter sur final_answer, budgets cumulés et deadline\n        # TODO: remplir StepMetrics et SolutionOutput (totaux, error, success)\n        raise NotImplementedError(\"TODO\")\n"}],"indices":["Avant de coder la boucle, écris à la main les messages de la première itération puis\nceux de la deuxième : tu verras exactement ce qu'il faut ajouter à `messages` et dans\nquel ordre. Demande-toi aussi quelle valeur du sandbox doit arrêter la boucle, et\nlaquelle doit simplement devenir une observation.\n","`time.monotonic()` pour la deadline (pas `time.time()`), `range(1, max_iterations + 1)`\npour le compteur, `getattr(response, \"retries\", 0)` pour les requêtes, et\n`getattr(llm, \"api_url\", \"\")` / `getattr(llm, \"model\", \"\")` pour le modèle. Pour\nl'observation, joins `stdout`, `stderr` et `error`, puis tronque avec\n`text[:MAX_OBSERVATION_CHARS]`.\n","Structure : initialise les compteurs (`total_input`, `total_output`,\n`total_requests`, `iterations`, `solution`, `success`, `error`) et `steps = []`.\nÀ chaque tour : deadline -> appel LLM -> cumuls -> `extract_code` -> soit\n`sandbox.run(code)`, soit une observation « aucun bloc de code » -> append à\n`messages` (assistant = texte brut, user = observation) -> append à `steps` ->\nsi `result.final_answer is not None`, `solution = ...`, `success = True`, `break`.\nAprès le cycle complet, compare les cumuls aux budgets et `break` avec un `error`\nexplicite. Si la boucle se termine sans `break`, `error` mentionne `max_iterations`.\nEnfin, retourne un `SolutionOutput` avec `time.monotonic() - started`.\n"],"pieges":[{"titre":"Ne pas réinjecter l'observation dans `messages` : le modèle ne voit jamais le\nrésultat de son code.\n","erreur":"AssertionError sur les rôles de `llm.calls[1][\"messages\"]` (test_observation_is_reinjected) ;\nen réel, l'agent répète le même code jusqu'au plafond d'itérations.\n"},{"titre":"Compter les tokens du dernier appel au lieu du cumul.\n","erreur":"AssertionError: assert 60 == 120 sur total_input_tokens\n(test_cumulative_token_budget_stops) : l'agent ne s'arrête pas au budget.\n"},{"titre":"Utiliser `print` dans l'agent au lieu de construire l'observation et de la renvoyer.\n","erreur":"`llm.calls[1][\"messages\"][-1][\"content\"]` ne contient pas « Observation » : le\nmodèle n'a reçu que le texte de la tâche.\n"},{"titre":"Confondre `final_answer` (capturé par le sandbox) avec un outil MCP : comparer le\ncode extrait à la chaîne `\"final_answer\"` au lieu de lire le résultat.\n","erreur":"out.success reste False alors que le sandbox a fourni `final_answer` ; en soutenance,\nl'agent ne s'arrête jamais ou s'arrête sur une observation vide.\n"},{"titre":"Boucle `while True` sans borne ni vérification de deadline.\n","erreur":"L'agent dépasse les 120 s et se fait tuer par le harnais (SIGTERM puis SIGKILL)\navant d'écrire solution.json ; le test des itérations ne rend jamais la main.\n"}],"verification":{"consigne":"Copie `test_agent.py` dans le même dossier que `agent.py`, puis lance la commande.\nLe LLM et le sandbox sont des doublures scriptées : aucun réseau, aucune exécution\nréelle. pytest affiche une durée variable ; seule la ligne « 5 passed » compte.\n","commande":"uv run pytest -q test_agent.py\n","fichiers":[{"nom":"test_agent.py","code":"\"\"\"Tests hors ligne de la boucle Thought → Code → Observation.\n\nLe LLM et le sandbox sont des doublures : aucun réseau, aucune exécution réelle.\n\"\"\"\nimport json\nfrom types import SimpleNamespace\n\nfrom agent import Agent\n\nSYSTEM = \"Tu es un agent. Termine avec final_answer(code).\"\nTASK = {\"task_id\": \"mbpp_1\", \"benchmark\": \"mbpp\", \"prompt\": \"Écris une fonction add(a, b).\"}\n\n\nclass ScriptedLLM:\n    api_url = \"http://llm.test/v1\"\n    model = \"test-model\"\n\n    def __init__(self, responses):\n        self.responses = list(responses)\n        self.calls = []\n\n    def chat(self, messages, stop=None):\n        self.calls.append({\"messages\": [dict(m) for m in messages], \"stop\": stop})\n        return self.responses.pop(0)\n\n\nclass FakeSandbox:\n    def __init__(self, results=()):\n        self.results = list(results)\n        self.codes = []\n\n    def run(self, code):\n        self.codes.append(code)\n        if self.results:\n            return self.results.pop(0)\n        return SimpleNamespace(\n            ok=True, stdout=\"\", stderr=\"\", error=None, final_answer=None\n        )\n\n\ndef llm_response(content, input_tokens=10, output_tokens=5):\n    return SimpleNamespace(\n        content=content,\n        input_tokens=input_tokens,\n        output_tokens=output_tokens,\n        request_time_ms=3.0,\n        retries=0,\n    )\n\n\ndef plain_result(stdout=\"\", error=None):\n    return SimpleNamespace(\n        ok=error is None, stdout=stdout, stderr=\"\", error=error, final_answer=None\n    )\n\n\ndef final_answer_result(answer):\n    return SimpleNamespace(\n        ok=True, stdout=\"\", stderr=\"\", error=None, final_answer=answer\n    )\n\n\ndef test_stops_on_final_answer():\n    code = \"final_answer('def add(a, b):\\\\n    return a + b')\"\n    llm = ScriptedLLM([llm_response(f\"```python\\n{code}\\n```\")])\n    sandbox = FakeSandbox([final_answer_result(\"def add(a, b):\\n    return a + b\")])\n\n    out = Agent(llm, sandbox, SYSTEM).run(TASK)\n\n    assert out.success is True\n    assert out.solution == \"def add(a, b):\\n    return a + b\"\n    assert out.iterations == 1\n    assert out.total_requests == 1\n    assert len(llm.calls) == 1\n    assert sandbox.codes == [code]\n\n\ndef test_observation_is_reinjected():\n    llm = ScriptedLLM(\n        [\n            llm_response(\"```python\\nprint(compute())\\n```\"),\n            llm_response(\"```python\\nfinal_answer('ok')\\n```\"),\n        ]\n    )\n    sandbox = FakeSandbox([plain_result(stdout=\"1\\n\"), final_answer_result(\"ok\")])\n\n    out = Agent(llm, sandbox, SYSTEM).run(TASK)\n\n    assert out.iterations == 2\n    assert out.success is True\n    second_messages = llm.calls[1][\"messages\"]\n    assert [m[\"role\"] for m in second_messages] == [\n        \"system\",\n        \"user\",\n        \"assistant\",\n        \"user\",\n    ]\n    assert \"Observation\" in second_messages[-1][\"content\"]\n    assert \"1\" in second_messages[-1][\"content\"]\n\n\ndef test_stops_at_max_iterations():\n    llm = ScriptedLLM([llm_response(\"```python\\nx = 1\\n```\") for _ in range(5)])\n    sandbox = FakeSandbox([plain_result(\"1\") for _ in range(5)])\n\n    out = Agent(llm, sandbox, SYSTEM, max_iterations=3).run(TASK)\n\n    assert out.success is False\n    assert out.iterations == 3\n    assert len(llm.calls) == 3\n    assert out.error is not None\n\n\ndef test_cumulative_token_budget_stops():\n    llm = ScriptedLLM(\n        [\n            llm_response(\"```python\\nprint(big())\\n```\", input_tokens=60),\n            llm_response(\"```python\\nfinal_answer('ok')\\n```\", input_tokens=60),\n        ]\n    )\n    sandbox = FakeSandbox([plain_result(stdout=\"x\" * 5000)])\n\n    out = Agent(llm, sandbox, SYSTEM, max_input_tokens=100).run(TASK)\n\n    assert out.success is False\n    assert out.iterations == 2\n    assert len(llm.calls) == 2\n    assert out.total_input_tokens == 120\n    assert out.error is not None\n    observation = llm.calls[1][\"messages\"][-1][\"content\"]\n    assert \"[tronqué\" in observation\n    assert len(observation) < 3000\n\n\ndef test_solution_json_shape():\n    answer = \"def add(a, b):\\n    return a + b\"\n    llm = ScriptedLLM(\n        [\n            llm_response(\n                \"```python\\nfinal_answer(answer)\\n```\",\n                input_tokens=42,\n                output_tokens=7,\n            )\n        ]\n    )\n    sandbox = FakeSandbox([final_answer_result(answer)])\n\n    out = Agent(llm, sandbox, SYSTEM).run(TASK)\n    payload = json.loads(out.model_dump_json())\n\n    for key in (\n        \"task_id\",\n        \"benchmark\",\n        \"success\",\n        \"solution\",\n        \"iterations\",\n        \"total_requests\",\n        \"total_input_tokens\",\n        \"total_output_tokens\",\n        \"total_time_seconds\",\n        \"steps\",\n        \"system_prompt\",\n        \"timestamp\",\n    ):\n        assert key in payload\n    assert payload[\"task_id\"] == \"mbpp_1\"\n    assert payload[\"benchmark\"] == \"mbpp\"\n    assert payload[\"success\"] is True\n    assert payload[\"solution\"] == answer\n    assert payload[\"total_input_tokens\"] == 42\n    assert payload[\"total_output_tokens\"] == 7\n    assert payload[\"system_prompt\"] == SYSTEM\n\n    step = payload[\"steps\"][0]\n    for key in (\n        \"step\",\n        \"input_tokens\",\n        \"output_tokens\",\n        \"request_time_ms\",\n        \"timestamp\",\n        \"api_url\",\n        \"model_name\",\n        \"llm_output\",\n        \"sandbox_input\",\n        \"sandbox_output\",\n        \"retries\",\n    ):\n        assert key in step\n    assert step[\"api_url\"] == \"http://llm.test/v1\"\n    assert step[\"model_name\"] == \"test-model\"\n    assert step[\"sandbox_input\"] == \"final_answer(answer)\"\n"}],"sortie":"5 passed\n"},"bonus":"Ajoute la vérification de la deadline avec un `time.monotonic()` et un test qui utilise\nun faux LLM lent (patche `time.monotonic` ou simule un dépassement). Écris ensuite\n`solution.json` sur disque avec `out.model_dump_json(indent=2)`, puis relis-le avec\n`json.loads` : c'est exactement ce qu'attend la moulinette de l'exo 09.\n","lienProjet":"C'est le cœur de l'agent : la boucle Thought → Code → Observation exigée en 4.1, avec\nles garde-fous de la section 5.1 (10 itérations, 6 000 tokens d'entrée, 1 500 de\nsortie, 120 s). Les `StepMetrics` produits ici deviennent les `steps` de\n`solution.json`, et `solution` porte le code MBPP (exo 09) ou le patch SWE-bench\n(exo 10). La traçabilité `llm_output` / `sandbox_input` / `sandbox_output` est\nprécisément ce que la soutenance inspecte (5.4.1).\n"},{"id":4,"bloc":"B","titre":"Sandbox in-process : imports, builtins, final_answer","niveau":3,"duree":"2 h","notions":["exec / compile","espace de noms persistant","hook d'import","allowlist","builtins restreints","final_answer","capture stdout/stderr","exceptions"],"objectif":"Écrire une sandbox in-process qui exécute du code généré par un LLM sous\nallowlist d'imports, builtins restreints et callback final_answer, en renvoyant\nune observation structurée sans jamais avaler Ctrl-C.\n","cours":"## Pourquoi une sandbox, et pourquoi « in-process »\n\nUn agent qui exécute du code écrit par un LLM te tend un couteau : ce code peut\nlire des fichiers, ouvrir un socket, boucler à l'infini. La sandbox est la\nfrontière entre le raisonnement (le LLM) et le monde réel. Elle ne « fait pas\nconfiance » : par défaut tout est refusé, on n'autorise qu'une liste explicite.\nC'est le modèle **allowlist** — l'inverse d'une blocklist qui court toujours\naprès le dernier contournement.\n\nIci tu commences **dans le même processus** : `exec` dans un dictionnaire\nd'espace de noms. C'est simple, rapide, et la mémoire des variables est\ngratuite. Modèle mental : le namespace est la **feuille de brouillon\npersistante** de l'agent. Tour 1 écrit `x = 41`, tour 2 lit `x + 1`.\n\n~~~python sandbox_exec.py\nimport contextlib, io\n\nns = {\"__builtins__\": builtins_restreints, \"final_answer\": capturer}\nbuf = io.StringIO()\nwith contextlib.redirect_stdout(buf):\n    exec(compile(\"x = 41\", \"sandbox\", \"exec\"), ns)\n    exec(compile(\"print(x + 1)\", \"sandbox\", \"exec\"), ns)\nprint(buf.getvalue())  # \"42\\n\"\n~~~\n\nTrois détails qui font tout échouer :\n- `compile` sépare la **syntaxe** (`SyntaxError`) de l'**exécution**\n  (exception levée par ton code). Attrape les deux au même endroit.\n- Sans clé `\"__builtins__\"` dans le namespace, Python injecte les **vrais**\n  builtins : `open`, `eval`, `__import__` redeviennent accessibles.\n- `redirect_stdout` doit être restauré par un `finally` : sinon ton agent\n  n'affiche plus jamais rien.\n\n## Le hook d'import\n\n`import x` appelle `builtins.__import__`. Tu remplaces cette fonction dans le\ndictionnaire de builtins restreints : c'est le point de passage unique de\n`import x`, `from x import y` et `import a.b`.\n\nLa règle de l'allowlist du sujet :\n\n| Entrée de l'allowlist | Import demandé | Verdict |\n|---|---|---|\n| `json` | `json` | autorisé (égalité exacte) |\n| `json` | `json.decoder` | refusé (pas de `json.*`) |\n| `collections.*` | `collections.abc` | autorisé (sous-module) |\n| `os` | `os` | refusé (absent de la liste) |\n\nFausses solutions classiques : retirer `os` de `sys.modules` ne bloque rien\n(`importlib.import_module(\"os\")` le recharge) ; autoriser par préfixe naïf\nfait passer `json.decoder` pour `json`. Ton hook doit vérifier **chaque nom\ndemandé** et lever `ImportError` en nommant le module refusé : les tests\nlisent ce nom. Et ne laisse pas `importlib` accessible, sinon tout l'édifice\ntombe.\n\n## Builtins : retire ce qui sort du bac\n\nConstruis le dictionnaire à partir de `vars(builtins)`, puis supprime\n`open`, `eval`, `exec`, `compile`, `input`, `breakpoint`, `exit`, `quit`.\nRemplace `__import__` par ton hook, garde `print`, `len`, `range`,\n`enumerate`, `isinstance`, `min`, `max`, `sum`, `sorted`… et injecte\n`final_answer`.\n\n> [!] La restriction des builtins est une **réduction de surface**, pas une\n> étanchéité. Du Python déterminé peut toujours rejoindre des objets via les\n> attributs `__class__` / `__subclasses__`. C'est pour ça que l'exercice 05\n> passe à un processus séparé : in-process, tu limites les dégâts, tu ne les\n> empêches pas.\n\n## final_answer : la sortie de secours de la boucle\n\n`final_answer` n'est **pas** un outil MCP : aucun serveur ne le fournit, il est\nlà même sans MCP. C'est un callback injecté par la sandbox ; il capture la\nchaîne et l'expose dans `ExecutionResult.final_answer`, que la boucle de\nl'agent lit pour s'arrêter. MBPP : `final_answer(code)`. SWE-bench :\n`final_answer(get_patch())`.\n\n~~~python boucle_agent.py\nresult = sandbox.run(code)\nif result.final_answer is not None:\n    return result.final_answer   # tâche terminée\nhistory.append(observation(result))\n~~~\n\n`print(solution)` n'arrête rien : l'agent continue et brûle des itérations.\n\n## Exceptions : distinguer le contrôle du bug\n\n- `Exception` (`ZeroDivisionError`, `ImportError`, `NameError`…) devient une\n  observation : `ok=False`, `error=\"ZeroDivisionError: division by zero\"`.\n- `KeyboardInterrupt` et `SystemExit` doivent **propager**. Ce sont des\n  signaux de contrôle (Ctrl-C, arrêt demandé). `except BaseException` les\n  avale et le CLI devient impossible à interrompre — piège classique.\n- `SyntaxError` est levée par `compile`, pas par `exec` : capture-la avant\n  d'exécuter, sinon ton agent meurt au premier code mal écrit.\n\n~~~python observation.py\ntry:\n    exec(compiled, self.namespace)\nexcept Exception as exc:                     # pas BaseException !\n    return ExecutionResult(ok=False, error=f\"{type(exc).__name__}: {exc}\")\n~~~\n\nLe timeout, la mémoire et l'allowlist de chemins (`allowed_directories`) de\n`SandboxConfig` ne sont pas réellement applicables dans le processus courant :\nun `while True` bloque ton agent, une grosse allocation tue tout, et le code\npeut encore ouvrir un fichier hors allowlist via `os.open`. On les configure\nici, on les fera respecter en 05.\n","enonce":"1. Crée un dossier d'exercice : `uv init`, puis `uv add pydantic pytest`.\n2. Copie `sandbox.py` et `test_sandbox.py`. Complète `Sandbox.__init__` :\n   namespace persistant, builtins restreints, hook `__import__`,\n   `final_answer`.\n3. Implémente `run(code) -> ExecutionResult` : compile en mode `\"exec\"`,\n   exécute dans le namespace, capture **séparément** stdout et stderr.\n4. Imports : accepte un nom présent tel quel dans `authorized_imports`, et un\n   sous-module uniquement si l'entrée finit par `.*`. Un refus lève\n   `ImportError` dont le message contient le module demandé.\n5. Builtins : `open`, `eval`, `exec`, `compile`, `input`, `breakpoint` doivent\n   être absents (`NameError`) ; `__import__` doit rester contrôlé ;\n   `final_answer` doit être présent à chaque exécution. Conserve les classes\n   d'exception (`Exception`, `KeyboardInterrupt`, `SystemExit`, `ValueError`…) :\n   le test de propagation doit lever un vrai `KeyboardInterrupt`, pas un\n   `NameError`.\n6. Une `Exception` devient `ok=False` + `error=\"Type: message\"` ;\n   `SyntaxError` est aussi une observation ; `KeyboardInterrupt` et\n   `SystemExit` ne sont **jamais** capturés par `run`.\n7. `final_answer(x)` stocke `x` dans `result.final_answer`\n   (`result.ok` reste `True`). Ne traite pas cette valeur comme un outil MCP.\n8. L'instance garde ses variables d'un `run` à l'autre ; en revanche, crée une\n   `Sandbox` **neuve par tâche** pour ne pas hériter des variables d'avant.\n9. Lance `uv run pytest -q` : les 10 tests doivent passer.\n\nCas limites : code vide (`ok=True`), `from collections.abc import Sequence`,\nimport refusé dans une fonction, `print` avant une exception, `final_answer`\nappelé plusieurs fois (la dernière valeur gagne), code qui écrit sur stderr.\n","depart":[{"fichier":"sandbox.py","code":"\"\"\"Sandbox in-process pour code généré par un LLM.\n\nContrat attendu par les tests :\n    SandboxConfig()      -> configuration validée (Pydantic)\n    Sandbox(config)      -> instance à namespace persistant\n    Sandbox.run(code)    -> ExecutionResult\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nfrom pydantic import BaseModel, Field\n\n\nclass SandboxConfig(BaseModel):\n    \"\"\"Configuration par allowlist : tout ce qui n'est pas listé est refusé.\"\"\"\n\n    authorized_imports: list[str] = Field(\n        default_factory=lambda: [\n            \"math\", \"math.*\",\n            \"collections\", \"collections.*\",\n            \"itertools\", \"re\", \"json\",\n            \"typing\", \"typing.*\",\n            \"functools\", \"operator\",\n            \"heapq\", \"bisect\", \"copy\",\n            \"string\", \"random\",\n            \"datetime\", \"datetime.*\",\n            \"array\", \"cmath\",\n        ]\n    )\n    allowed_directories: list[str] = Field(\n        default_factory=lambda: [\"/testbed\", \"/tmp/agent\"]\n    )\n    max_execution_time_seconds: int = 30\n    max_memory_mb: int = 512\n\n\n@dataclass\nclass ExecutionResult:\n    \"\"\"Observation renvoyée à la boucle de l'agent.\"\"\"\n\n    ok: bool\n    stdout: str = \"\"\n    stderr: str = \"\"\n    error: str | None = None\n    final_answer: str | None = None\n\n\nclass Sandbox:\n    def __init__(self, config: SandboxConfig) -> None:\n        self.config = config\n        # TODO : namespace persistant, builtins restreints,\n        #        hook d'import, final_answer.\n        #        (timeout et mémoire : voir exercice 05)\n\n    def run(self, code: str) -> ExecutionResult:\n        # TODO : compile + exec dans le namespace, capture stdout/stderr,\n        #        exceptions en observation, KeyboardInterrupt/SystemExit\n        #        laissés passer, final_answer récupéré.\n        raise NotImplementedError(\"Sandbox.run à implémenter\")\n"}],"indices":["Tu construis deux périmètres séparés : ce que le code peut **importer**\n(une fonction de filtrage branchée sur `__import__`) et ce que le code peut\n**appeler comme builtins** (un dictionnaire construit à partir des vrais\nbuiltins, amputé du dangereux). Le reste est de la plomberie : un dictionnaire\nqui survit entre deux `run`, deux tampons de texte, un `except` bien choisi.\n","`import builtins` puis `dict(vars(builtins))` pour partir du dictionnaire\nréel. `builtins.__import__(name, globals, locals, fromlist, level)` est la\nsignature à imiter. `io.StringIO` + `contextlib.redirect_stdout` /\n`redirect_stderr`. `compile(source, filename, \"exec\")`. Enfin\n`f\"{type(exc).__name__}: {exc}\"` pour une observation lisible.\n","Allowlist : un nom est autorisé s'il est exactement dans la liste, ou si une\nentrée finit par `.*` et que le nom vaut la base de cette entrée ou commence\npar cette base suivie d'un point. Le hook d'import reçoit le nom complet\n(`collections.abc`), y compris pour `from ... import ...` : une seule\nvérification suffit, puis délègue au vrai `__import__` conservé dans une\nvariable. Builtins : copie, suppression des noms interdits, remplacement de\n`__import__`, ajout de `final_answer`. `run` : compile dans un `try` qui\ntransforme `Exception` (et `SyntaxError`, fille d'`Exception`) en\n`ExecutionResult` ; redirige les sorties dans deux `StringIO` restaurés par\n`with` ; laisse remonter ce qui n'est pas `Exception`.\n"],"pieges":[{"titre":"Attraper `BaseException` (ou un `except:` nu) pour « ne rien laisser\npasser » : Ctrl-C et `SystemExit` sont avalés.\n","erreur":"ExecutionResult(ok=False, stdout='', stderr='', error='KeyboardInterrupt: ',\nfinal_answer=None)\n# puis Ctrl-C n'arrête plus le CLI : le signal a été transformé en observation\n"},{"titre":"Oublier de fournir un dictionnaire restreint sous la clé `__builtins__` :\nPython réinjecte les builtins réels dans le namespace.\n","erreur":">>> open('/etc/passwd').read()[:1]\n'r'\n# attendu : NameError: name 'open' is not defined\n"},{"titre":"Laisser `importlib` accessible « puisqu'il n'est pas dans la liste » :\nil recharge n'importe quel module interdit.\n","erreur":">>> importlib.import_module('os').getcwd()\n'/home/etudiant/ex04'\n# os était pourtant refusé par l'allowlist\n"},{"titre":"Allowlist par préfixe sans frontière de nom : `json` autorise\n`json.decoder`, et `math` autoriserait `mathematiques`.\n","erreur":"E       assert True is False\n# test_import_sous_module_refuse : json.decoder accepté par une entrée \"json\"\n"},{"titre":"Ne pas injecter `final_answer` quand aucun serveur MCP n'est connecté,\nou l'implémenter comme un outil MCP.\n","erreur":"NameError: name 'final_answer' is not defined\n# la boucle de l'agent ne reçoit jamais de solution et tourne jusqu'au budget\n"}],"verification":{"consigne":"Copie `test_sandbox.py` dans le même dossier que `sandbox.py`, puis lance la\ncommande. Sur le squelette, les 10 tests échouent (`NotImplementedError`) :\nc'est normal. pytest ajoute la durée après `8 passed` ; seule la ligne\n`8 passed` doit correspondre.\n","commande":"uv run pytest -q\n","fichiers":[{"nom":"test_sandbox.py","code":"import pytest\n\nfrom sandbox import ExecutionResult, Sandbox, SandboxConfig\n\n\ndef nouvelle_sandbox(**options):\n    return Sandbox(SandboxConfig(**options))\n\n\ndef test_import_autorise():\n    r = nouvelle_sandbox().run(\"import math\\nprint(math.gcd(12, 18))\")\n    assert r.ok is True\n    assert r.error is None\n    assert r.stdout == \"6\\n\"\n    assert r.stderr == \"\"\n\n\ndef test_sous_module_collections_abc():\n    code = (\n        \"from collections.abc import Sequence\\n\"\n        \"print(issubclass(list, Sequence))\"\n    )\n    r = nouvelle_sandbox().run(code)\n    assert r.ok is True\n    assert r.stdout == \"True\\n\"\n\n\ndef test_import_refuse():\n    r = nouvelle_sandbox().run(\"import os\\nprint('jamais')\")\n    assert r.ok is False\n    assert r.stdout == \"\"\n    assert r.error and \"os\" in r.error\n\n\ndef test_builtins_dangereux_bloques():\n    r = nouvelle_sandbox().run(\"open('/etc/passwd')\")\n    assert r.ok is False\n    assert r.stdout == \"\"\n    assert r.error and \"open\" in r.error\n    r2 = nouvelle_sandbox().run(\"__import__('os')\")\n    assert r2.ok is False\n    assert r2.error\n\n\ndef test_final_answer_capture():\n    r = nouvelle_sandbox().run('final_answer(\"def solve(n): return n + 1\")')\n    assert r.ok is True\n    assert r.error is None\n    assert r.final_answer == \"def solve(n): return n + 1\"\n    assert r.stdout == \"\"\n\n\ndef test_exception_et_syntaxe_en_observation():\n    r = nouvelle_sandbox().run(\"print(1 / 0)\")\n    assert r.ok is False\n    assert r.stdout == \"\"\n    assert \"ZeroDivisionError\" in (r.error or \"\")\n    assert r.final_answer is None\n    r2 = nouvelle_sandbox().run(\"def f(:\\n    pass\")\n    assert r2.ok is False\n    assert \"SyntaxError\" in (r2.error or \"\")\n\n\ndef test_keyboard_interrupt_non_avale():\n    with pytest.raises(KeyboardInterrupt):\n        nouvelle_sandbox().run(\"raise KeyboardInterrupt\")\n    with pytest.raises(SystemExit):\n        nouvelle_sandbox().run(\"raise SystemExit(3)\")\n\n\ndef test_import_sous_module_refuse():\n    r = nouvelle_sandbox().run(\"import json.decoder\")\n    assert r.ok is False\n    assert r.error and \"json.decoder\" in r.error\n\n\ndef test_builtins_eval_exec_compile_bloques():\n    for appel in (\"eval('1+1')\", \"exec('x = 1')\", \"compile('x=1', '<s>', 'exec')\"):\n        r = nouvelle_sandbox().run(appel)\n        assert r.ok is False\n        assert r.error and appel.split(\"(\")[0] in r.error\n\n\ndef test_stdout_et_namespace_persistant():\n    sb = nouvelle_sandbox()\n    premier = sb.run(\"x = 41\")\n    assert premier.ok is True\n    assert premier.stdout == \"\"\n    second = sb.run(\"print(x + 1)\")\n    assert second.ok is True\n    assert second.stdout == \"42\\n\"\n    assert second.stderr == \"\"\n"}],"sortie":"10 passed\n"},"bonus":"Ajoute une méthode `reset()` et un petit script `python sandbox.py` qui lit le\ncode sur stdin et affiche l'`ExecutionResult` : tu tiens déjà le REPL de\nl'exercice 06. Mesure ensuite combien de temps le processus met à exécuter\n10 000 boucles vides in-process, puis compare avec la version isolée de\nl'exercice 05 : tu comprends le prix de la vraie frontière.\n","lienProjet":"C'est `sandbox.py` qui exécute chaque bloc de code produit par le LLM dans\nl'exercice 03, et c'est son `ExecutionResult` qui devient l'observation\nréinjectée dans l'historique. La distinction `final_answer` / outil MCP est\névaluée en soutenance : `final_answer` appartient à la sandbox, les outils\nappartiennent au serveur MCP connecté.\n"},{"id":5,"bloc":"B","titre":"Isolation, timeouts, mémoire, réseau, fichiers","niveau":4,"duree":"2 h 30","notions":["subprocess","timeout réel","RLIMIT_AS / RLIMIT_CPU","killpg / SIGKILL","sortie partielle","allowed_directories","symlink","refus réseau"],"objectif":"Exécuter du code non fiable dans un processus enfant jetable, avec timeout\nréellement tué, limite mémoire, allowlist de chemins et refus réseau, puis\nrécupérer stdout/stderr et un statut structuré.\n","cours":"## Pourquoi un processus séparé\n\nIn-process (exercice 04), tu ne peux pas **interrompre** un `while True` : le\ncode tourne dans ton interpréteur, il bloque la boucle de l'agent, et aucune\nlimite mémoire ne s'applique sans tuer ton propre programme. Le seul\nmécanisme qui tienne vraiment, c'est le processus séparé : il a sa mémoire,\nses limites, son identité, et le parent peut le tuer pour de vrai.\n\nModèle mental : le **parent** est le gardien — il lance, il chronomètre, il\ntu
