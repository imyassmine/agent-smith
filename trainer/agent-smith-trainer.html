entifie l'instance (dépôt + numéro d'issue) ; le champ `docker_image` fournit l'image de test."},{"terme":"Eval script","ex":10,"def":"Script bash fourni avec la tâche SWE-bench et lancé dans le conteneur pour vérifier le patch. Pour déboguer, observe quels tests passent un par un au lieu d'attendre le verdict global."},{"terme":"StepMetrics","ex":3,"def":"Modèle Pydantic des métriques d'une itération : tokens, latence, `llm_output`, `sandbox_input`, `sandbox_output`, `retries`, `api_url` et `model_name`."},{"terme":"SolutionOutput","ex":3,"def":"Modèle Pydantic de la sortie finale : `task_id`, `benchmark`, `success`, `solution`, itérations, totaux, `steps` et `system_prompt`."},{"terme":"solution.json","ex":9,"def":"Fichier JSON produit par l'agent et validé par la moulinette. Ses valeurs doivent venir de l'exécution réelle, jamais d'une estimation."},{"terme":"Moulinette","ex":9,"def":"Outil d'évaluation du projet : il distribue les tâches, valide `solution.json`, vérifie les limites et applique le script d'examen."},{"terme":"Benchmark","ex":10,"def":"Comparaison systématique de plusieurs modèles sur les mêmes tâches, avec taux de réussite, tokens, latence et fiabilité du fournisseur. Le rapport exige 5 modèles, 2 fournisseurs et 3 tâches."},{"terme":"Ablation","ex":10,"def":"Comparaison avant et après une modification (prompt, outil, paramètre) sur les mêmes tâches avec le même modèle. Elle prouve l'effet de la modification, pas du hasard."},{"terme":"Prompt injection","ex":10,"def":"Contenu hostile placé dans une entrée, fichier, issue ou sortie d'outil, qui tente de détourner le modèle. Le code de l'agent doit rester la seule autorité d'exécution."},{"terme":"Exfiltration réseau","ex":5,"def":"Faire sortir des données sensibles, clés ou fichiers, par le réseau depuis du code non fiable. Le blocage réseau de la sandbox et le durcissement des outils la rendent impossible."},{"terme":"Reproductibilité (seed)","ex":1,"def":"Capacité à refaire un run avec les mêmes entrées et paramètres. Température basse, seed si le fournisseur la supporte, et traces complètes rendent un résultat défendable."},{"terme":"Logging et provenance","ex":10,"def":"Journalisation des prompts, réponses, code exécuté et observations. C'est ce qui permet de prouver qu'un succès vient d'une vraie exploration et non d'une réponse apprise par cœur."},{"terme":"Outil `read_file` (format `cat -n`)","ex":8,"def":"Outil SWE-bench qui lit un fichier avec ses numéros de ligne, au format `12: contenu`. Le format exact est testé : il conditionne les éditions suivantes."},{"terme":"REPL (sandbox)","ex":6,"def":"Boucle interactive du CLI sandbox : lire une entrée, l'exécuter dans le namespace persistant, afficher le résultat ou l'erreur, puis revenir au prompt. `exit` ou EOF (Ctrl-D) termine proprement."},{"terme":"Manuel de la sandbox","ex":6,"def":"Documentation générée à partir des schémas des outils MCP connectés (noms, descriptions, paramètres) et injectée dans le prompt système. Elle doit changer automatiquement quand on branche un autre serveur MCP."},{"terme":"CLI (argparse)","ex":6,"def":"Interface en ligne de commande du projet : arguments (fichier de config, `--mcp-stdio`, `--mcp-server`), valeurs par défaut et messages d'erreur. Elle doit rester utilisable sans variable d'environnement cachée."}]};

(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  /* ---------- Stockage (localStorage avec repli mémoire) ---------- */
  const Store = (() => {
    const KEY = 'agent-smith-trainer:v1';
    let data = blank(), persistent = true;
    function blank() { return { version: 1, done: {}, hints: {}, notes: {}, theme: null }; }
    function clean(o) {
      const d = blank();
      if (!o || typeof o !== 'object') return d;
      for (const k of ['done', 'hints', 'notes']) {
        if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) {
          for (const [id, v] of Object.entries(o[k])) {
            if (k === 'done' && v === true) d.done[id] = true;
            if (k === 'hints' && Number.isInteger(v) && v > 0) d.hints[id] = Math.min(v, 3);
            if (k === 'notes' && typeof v === 'string' && v) d.notes[id] = v;
          }
        }
      }
      if (o.theme === 'light' || o.theme === 'dark') d.theme = o.theme;
      return d;
    }
    function load() {
      try {
        const raw = window.localStorage.getItem(KEY);
        data = raw ? clean(JSON.parse(raw)) : blank();
      } catch (e) { persistent = false; data = blank(); }
    }
    function save() {
      try { window.localStorage.setItem(KEY, JSON.stringify(data)); persistent = true; }
      catch (e) { persistent = false; }
      $('#storageWarn').classList.toggle('show', !persistent);
    }
    load();
    return {
      get: () => data, save, clean, blank,
      isPersistent: () => persistent,
      replace(d) { data = clean(d); save(); },
    };
  })();

  /* ---------- Thème ---------- */
  function applyTheme() {
    let t = Store.get().theme;
    if (!t) { try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; } }
    document.documentElement.setAttribute('data-theme', t);
  }

  /* ---------- Coloration syntaxique ---------- */
  const W = s => new Set(s.split(' '));
  const PY_KW = W('and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case');
  const PY_BI = W('abs all any ascii bin bool breakpoint bytearray bytes callable chr classmethod compile complex delattr dict dir divmod enumerate eval exec filter float format frozenset getattr globals hasattr hash help hex id input int isinstance issubclass iter len list locals map max memoryview min next object oct open ord pow print property range repr reversed round set setattr slice sorted staticmethod str sum super tuple type vars zip __import__');
  const PY_CONST = W('True False None NotImplemented Ellipsis __debug__');
  const PY_RE = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|[rRbBfFuU]{0,2}"(?:\\.|[^"\\\n])*"|[rRbBfFuU]{0,2}'(?:\\.|[^'\\\n])*')|(\b0[xX][0-9a-fA-F_]+\b|\b0[bB][01_]+\b|\b0[oO][0-7_]+\b|\b\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?j?\b)|(@[A-Za-z_]\w*)|([A-Za-z_]\w*)/g;
  function span(cls, txt) { return '<span class="' + cls + '">' + esc(txt) + '</span>'; }
  function hlComment(txt) {
    return esc(txt).replace(/\b(TODO|FIXME)\b/g, '<span class="tk-todo">$1</span>').replace(/^/, '<span class="tk-com">') + '</span>';
  }
  function hlPython(code) {
    let out = '', last = 0, m, expectName = false;
    PY_RE.lastIndex = 0;
    while ((m = PY_RE.exec(code))) {
      out += esc(code.slice(last, m.index));
      const [tok, com, str, num, deco, id] = m;
      if (com) { out += hlComment(com); expectName = false; }
      else if (str) { out += span('tk-str', str); expectName = false; }
      else if (num) { out += span('tk-num', num); expectName = false; }
      else if (deco) { out += span('tk-fn', deco); expectName = false; }
      else if (id) {
        const after = code.slice(PY_RE.lastIndex).match(/^\s*\(/);
        if (PY_KW.has(id)) {
          out += span('tk-kw', id);
          expectName = (id === 'def' || id === 'class');
        } else if (expectName) {
          out += span(id === 'class' ? 'tk-type' : 'tk-fn', id);
          expectName = false;
        } else if (PY_CONST.has(id) || /^__\w+__$/.test(id)) out += span('tk-const', id);
        else if (PY_BI.has(id) && after) out += span('tk-bi', id);
        else if (after) out += span('tk-fn', id);
        else out += esc(id);
      } else out += esc(tok);
      last = m.index + tok.length;
      if (tok.length === 0) PY_RE.lastIndex++;
    }
    return out + esc(code.slice(last));
  }
  function hlShell(code) {
    return code.split('\n').map(line => {
      const i = line.search(/(^|\s)#/);
      if (/^\s*#/.test(line)) return hlComment(line);
      if (i > 0) return esc(line.slice(0, i)) + hlComment(line.slice(i));
      return esc(line).replace(/^(\$ )/, '<span class="tk-com">$1</span>');
    }).join('\n');
  }
  function hlJson(code) {
    return esc(code).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?\b)/g,
      (m, s, colon, k, n) => s ? '<span class="' + (colon ? 'tk-type' : 'tk-str') + '">' + s + '</span>' + (colon || '') : k ? '<span class="tk-const">' + k + '</span>' : '<span class="tk-num">' + n + '</span>');
  }
  function hlConf(code) {
    return code.split('\n').map(line => {
      const i = line.search(/(^|\s)#/);
      if (/^\s*#/.test(line)) return hlComment(line);
      if (i > 0) return esc(line.slice(0, i)) + hlComment(line.slice(i));
      return esc(line).replace(/^(\s*[\w.-]+)(\s*[:=])/, (m, k, sep) => '<span class="tk-type">' + k + '</span>' + esc(sep));
    }).join('\n');
  }
  function highlight(code, lang) {
    lang = (lang || '').toLowerCase();
    if (lang === 'python' || lang === 'py') return hlPython(code);
    if (lang === 'sh' || lang === 'bash' || lang === 'shell' || lang === 'make' || lang === 'makefile' || lang === 'dockerfile') return hlShell(code);
    if (lang === 'json') return hlJson(code);
    if (lang === 'toml' || lang === 'yaml' || lang === 'yml' || lang === 'ini' || lang === 'conf') return hlConf(code);
    return esc(code);
  }
  function langOf(file) {
    if (!file) return 'text';
    if (/\.py$/.test(file)) return 'python';
    if (/\.json$/.test(file)) return 'json';
    if (/\.toml$/.test(file)) return 'toml';
    if (/\.ya?ml$/.test(file)) return 'yaml';
    if (/\.md$/.test(file)) return 'markdown';
    if (/^Makefile$|\.mk$/.test(file)) return 'make';
    if (/\.sh$/.test(file) || file === 'terminal' || /^Dockerfile/.test(file)) return 'sh';
    return 'text';
  }

  /* ---------- Blocs de code + copie ---------- */
  const COPY = [];
  function codeBlock(code, lang, label) {
    const id = COPY.push(code) - 1;
    return '<div class="code"><div class="code-head"><span>' + esc(label || lang || 'texte') + '</span>' +
      '<button class="copy-btn" data-copy="' + id + '">Copier</button></div><pre><code>' + highlight(code, lang) + '</code></pre></div>';
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => true, () => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));
  }

  /* ---------- Mini-markdown ---------- */
  function inline(s) {
    const codes = [];
    const protege = String(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    return esc(protege)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\(#([\w-]+)\)/g, '<a href="#$2">$1</a>')
      .replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + esc(codes[+i]) + '</code>');
  }
  function md(src) {
    if (!src) return '';
    const lines = String(src).replace(/\r\n/g, '\n').split('\n');
    let html = '', i = 0, para = [];
    const flush = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^\s*~~~\s*([\w.-]*)\s*(.*)$/);
      if (fence) {
        flush();
        const lang = fence[1] || 'text', label = fence[2] || lang;
        const buf = []; i++;
        while (i < lines.length && !/^\s*~~~\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        html += codeBlock(buf.join('\n'), lang, label);
        continue;
      }
      if (/^\s*$/.test(line)) { flush(); i++; continue; }
      const h = line.match(/^(#{2,4})\s+(.*)$/);
      if (h) { flush(); const lv = Math.min(h[1].length + 1, 4); html += '<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'; i++; continue; }
      if (/^\s*\|/.test(line)) {
        flush();
        const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i].trim()); i++; }
        const cells = r => r.replace(/\\\|/g, '\u0001').replace(/^\||\|$/g, '').split('|').map(c => c.trim().replace(/\u0001/g, '|'));
        let t = '<table>';
        rows.forEach((r, k) => {
          if (k === 1 && /^\|?[\s:|-]+\|?$/.test(r)) return;
          const tag = k === 0 ? 'th' : 'td';
          t += '<tr>' + cells(r).map(c => '<' + tag + '>' + inline(c) + '</' + tag + '>').join('') + '</tr>';
        });
        html += t + '</table>';
        continue;
      }
      const callout = line.match(/^>\s?(?:\[(!|ok|x)\]\s*)?(.*)$/);
      if (callout) {
        flush();
        const kind = callout[1] === '!' ? ' warn' : callout[1] === 'ok' ? ' ok' : callout[1] === 'x' ? ' bad' : '';
        const buf = [callout[2]]; i++;
        while (i < lines.length && /^>/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
        html += '<div class="callout' + kind + '">' + md(buf.join('\n')) + '</div>';
        continue;
      }
      const li = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if (li) {
        flush();
        const ordered = /\d/.test(li[2]);
        const items = [];
        while (i < lines.length) {
          const m = lines[i].match(/^\s*([-*]|\d+\.)\s+(.*)$/);
          if (m && (/\d/.test(m[1]) === ordered)) { items.push(m[2]); i++; }
          else if (items.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*~~~/.test(lines[i])) { items[items.length - 1] += ' ' + lines[i].trim(); i++; }
          else break;
        }
        html += (ordered ? '<ol>' : '<ul>') + items.map(x => '<li>' + inline(x) + '</li>').join('') + (ordered ? '</ol>' : '</ul>');
        continue;
      }
      para.push(line.trim()); i++;
    }
    flush();
    return html;
  }
  const plain = s => String(s || '').replace(/~~~[^\n]*\n?/g, ' ').replace(/[`*_|#>]/g, ' ').replace(/\s+/g, ' ').trim();

  /* ---------- Données dérivées ---------- */
  const EX = EXERCISES.slice().sort((a, b) => a.id - b.id);
  const byId = Object.fromEntries(EX.map(e => [String(e.id), e]));
  const blocs = Object.keys(BLOCS);

  function progress() {
    const d = Store.get().done;
    const n = EX.filter(e => d[e.id]).length;
    return { n, total: EX.length, pct: EX.length ? Math.round(100 * n / EX.length) : 0 };
  }

  /* ---------- Barre latérale ---------- */
  function renderSidebar(active) {
    const d = Store.get().done;
    const link = (href, label, extra) => '<a href="#' + href + '" class="' + (active === href ? 'active' : '') + '">' + (extra || '') + '<span class="t">' + esc(label) + '</span></a>';
    let h = '<div class="nav nav-sec">' +
      link('accueil', 'Accueil', '<span class="num">⌂</span>') +
      link('parcours', 'Parcours conseillé', '<span class="num">⇄</span>') +
      link('aide-memoire', 'Aide-mémoire Python', '<span class="num">≡</span>') +
      link('carte', 'Carte du projet Agent Smith', '<span class="num">◇</span>') +
      link('glossaire', 'Glossaire', '<span class="num">Aa</span>') +
      '</div>';
    for (const b of blocs) {
      const list = EX.filter(e => e.bloc === b);
      if (!list.length) continue;
      const nd = list.filter(e => d[e.id]).length;
      h += '<div class="nav nav-sec"><div class="nav-title"><span>' + esc(b + ' · ' + BLOCS[b].titre) + '</span><span>' + nd + '/' + list.length + '</span></div>';
      for (const e of list) {
        h += link('ex-' + e.id, e.titre, '<span class="chk' + (d[e.id] ? ' on' : '') + '" aria-hidden="true"></span><span class="num">' + String(e.id).padStart(2, '0') + '</span>');
      }
      h += '</div>';
    }
    $('#sidebar').innerHTML = h;
    const p = progress();
    $('#progressPill').textContent = p.n + '/' + p.total + ' faits · ' + p.pct + ' %';
    const a = $('#sidebar a.active');
    if (a && a.scrollIntoView) { try { a.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ } }
  }

  /* ---------- Vues ---------- */
  const stars = n => '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));
  const sec = (ico, title, body, id) => '<section' + (id ? ' id="' + id + '"' : '') + '><h2><span class="sec-ico">' + ico + '</span>' + esc(title) + '</h2>' + body + '</section>';

  function viewHome() {
    const p = progress(), d = Store.get().done;
    const next = EX.find(e => !d[e.id]);
    let h = '<h1>' + esc(DOCS.accueil.titre) + '</h1><p class="lead">' + inline(DOCS.accueil.sousTitre) + '</p>';
    h += '<div class="card"><div class="meta"><strong>' + p.n + ' / ' + p.total + ' exercices faits</strong><span>' + p.pct + ' %</span></div><div class="bar"><span style="width:' + p.pct + '%"></span></div>' +
      (next ? '<p style="margin-top:12px"><a class="reveal-btn" style="text-decoration:none;display:inline-block" href="#ex-' + next.id + '">' + (p.n ? 'Reprendre' : 'Commencer') + ' : ' + String(next.id).padStart(2, '0') + ' · ' + esc(next.titre) + ' →</a></p>' : '<p class="callout ok">Tout est fait. Passe aux bonus, puis attaque le projet Agent Smith.</p>') + '</div>';
    h += md(DOCS.accueil.contenu);
    h += '<h2>Les blocs</h2><div class="grid">';
    for (const b of blocs) {
      const list = EX.filter(e => e.bloc === b);
      const nd = list.filter(e => d[e.id]).length;
      const mins = list.reduce((s, e) => s + toMin(e.duree), 0);
      h += '<a class="card" style="text-decoration:none;color:inherit;margin:0" href="#ex-' + (list[0] ? list[0].id : '') + '"><div class="bloc-tag">Bloc ' + esc(b) + ' · ' + list.map(e => e.id).join(', ') + '</div><h3 style="margin:4px 0">' + esc(BLOCS[b].titre) + '</h3><p class="muted" style="margin:0 0 8px">' + inline(BLOCS[b].resume) + '</p><div class="meta"><span>' + nd + '/' + list.length + '</span><span>≈ ' + fmtMin(mins) + '</span></div><div class="bar"><span style="width:' + (list.length ? 100 * nd / list.length : 0) + '%"></span></div></a>';
    }
    return h + '</div>';
  }
  function toMin(s) {
    const m = String(s || '').match(/(?:(\d+)\s*h)?\s*(\d+)?\s*(?:min)?/i);
    if (!m) return 0;
    return (parseInt(m[1] || '0', 10) * 60) + parseInt(m[2] || '0', 10);
  }
  function fmtMin(m) { const h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + String(r).padStart(2, '0') : '') : r + ' min'; }

  function viewExercise(e) {
    const st = Store.get();
    const done = !!st.done[e.id];
    const shown = st.hints[e.id] || 0;
    const idx = EX.indexOf(e), prev = EX[idx - 1], next = EX[idx + 1];
    let h = '<div class="ex-head"><div><div class="bloc-tag">Bloc ' + esc(e.bloc) + ' · ' + esc(BLOCS[e.bloc] ? BLOCS[e.bloc].titre : '') + ' · exercice ' + e.id + '/' + EX.length + '</div>' +
      '<h1>' + String(e.id).padStart(2, '0') + ' · ' + esc(e.titre) + '</h1>' +
      '<div class="meta"><span class="stars" title="Niveau ' + e.niveau + '/5">' + stars(e.niveau) + '</span><span>⏱ ' + esc(e.duree) + '</span></div>' +
      '<div>' + (e.notions || []).map(n => '<span class="chip">' + esc(n) + '</span>').join('') + '</div></div>' +
      '<button class="done-btn' + (done ? ' on' : '') + '" data-done="' + e.id + '">' + (done ? '✓ Fait' : '○ Marquer comme fait') + '</button></div>';
    h += '<div class="callout" style="margin-top:16px"><strong>Objectif — </strong>' + inline(e.objectif) + '</div>';
    h += sec('📖', 'Mini-cours', md(e.cours));
    h += sec('🎯', 'Énoncé', md(e.enonce));
    h += sec('⌨', 'Code de départ', (e.depart || []).map(f => codeBlock(f.code, langOf(f.fichier), f.fichier)).join(''));
    let hints = '';
    (e.indices || []).forEach((txt, k) => {
      const open = k < shown;
      const labels = ['Indice 1 — piste', 'Indice 2 — outil de la stdlib', 'Indice 3 — logique'];
      hints += '<div class="hint' + (open ? '' : ' locked') + '"><div class="hint-h"><span>' + (open ? '💡 ' : '🔒 ') + esc(labels[k] || 'Indice ' + (k + 1)) + '</span>' +
        (!open && k === shown ? '<button class="reveal-btn" data-hint="' + e.id + '">Révéler</button>' : '') + '</div>' +
        (open ? '<div class="hint-b">' + md(txt) + '</div>' : '') + '</div>';
    });
    if (shown) hints += '<button class="link-btn" data-hint-reset="' + e.id + '">Masquer à nouveau les indices</button>';
    h += sec('💡', 'Indices (à révéler un par un)', '<p class="muted">Bloqué depuis plus de 15 minutes ? Révèle le suivant. Aucun ne contient la solution.</p>' + hints);
    h += sec('⚠', 'Pièges courants', (e.pieges || []).map(p => '<div class="trap">' + md(p.titre) + (p.erreur ? '<pre>' + esc(p.erreur) + '</pre>' : '') + '</div>').join(''));
    const v = e.verification || {};
    let vh = '';
    if (v.consigne) vh += md(v.consigne);
    if (v.commande) vh += codeBlock(v.commande, 'sh', 'terminal');
    for (const f of (v.fichiers || (v.fichier ? [v.fichier] : []))) vh += codeBlock(f.code, langOf(f.nom), f.nom);
    if (v.sortie) vh += codeBlock(v.sortie, 'text', 'sortie attendue (exacte)');
    h += sec('✅', 'Auto-vérification', vh);
    h += sec('🚀', 'Bonus', md(e.bonus));
    h += sec('🔗', 'Lien avec Agent Smith', '<div class="callout ok">' + inline(e.lienProjet) + '</div>');
    h += sec('✎', 'Mes notes', '<textarea class="notes" data-notes="' + e.id + '" placeholder="Ce que j\'ai compris, mes erreurs, questions pour la soutenance…">' + esc(st.notes[e.id] || '') + '</textarea><div class="save-state" id="saveState"></div>');
    h += '<div class="pager">' + (prev ? '<a href="#ex-' + prev.id + '"><small>← Précédent</small>' + String(prev.id).padStart(2, '0') + ' · ' + esc(prev.titre) + '</a>' : '<span></span>') +
      (next ? '<a href="#ex-' + next.id + '" style="text-align:right"><small>Suivant →</small>' + String(next.id).padStart(2, '0') + ' · ' + esc(next.titre) + '</a>' : '<span></span>') + '</div>';
    return h;
  }

  function viewDoc(key) {
    if (key === 'glossaire') {
      const g = DOCS.glossaire.slice().sort((a, b) => a.terme.localeCompare(b.terme, 'fr'));
      return '<h1>Glossaire agents, LLM et sécurité</h1><p class="lead">' + g.length + ' termes. Le numéro renvoie à l\'exercice qui pratique la notion.</p><dl class="gloss">' +
        g.map(t => '<dt id="g-' + esc(norm(t.terme).replace(/[^a-z0-9]+/g, '-')) + '">' + esc(t.terme) + (t.ex ? ' <a class="chip" href="#ex-' + t.ex + '">ex ' + t.ex + '</a>' : '') + '</dt><dd>' + inline(t.def) + '</dd>').join('') + '</dl>';
    }
    if (key === 'carte') return '<h1>Carte du projet Agent Smith</h1>' + md(DOCS.carte.intro) + '<div class="svgwrap">' + DOCS.carte.svg + '</div>' + md(DOCS.carte.legende);
    if (key === 'aide-memoire') return '<h1>Aide-mémoire Python</h1>' + md(DOCS.aideMemoire);
    if (key === 'parcours') return '<h1>Parcours conseillé</h1>' + md(DOCS.parcours);
    return viewHome();
  }

  /* ---------- Recherche ---------- */
  const INDEX = [];
  function buildIndex() {
    for (const e of EX) {
      const parts = [e.titre, (e.notions || []).join(' '), e.objectif, e.cours, e.enonce, (e.pieges || []).map(p => p.titre + ' ' + (p.erreur || '')).join(' '), e.bonus, e.lienProjet, (e.depart || []).map(f => f.code).join(' ')];
      INDEX.push({ href: 'ex-' + e.id, titre: String(e.id).padStart(2, '0') + ' · ' + e.titre, type: 'Exercice · bloc ' + e.bloc, text: plain(parts.join(' \n ')), head: norm(e.titre + ' ' + (e.notions || []).join(' ')) });
    }
    INDEX.push({ href: 'aide-memoire', titre: 'Aide-mémoire Python', type: 'Documentation', text: plain(DOCS.aideMemoire), head: 'aide memoire python' });
    INDEX.push({ href: 'parcours', titre: 'Parcours conseillé', type: 'Documentation', text: plain(DOCS.parcours), head: 'parcours' });
    INDEX.push({ href: 'carte', titre: 'Carte du projet Agent Smith', type: 'Documentation', text: plain(DOCS.carte.intro + ' ' + DOCS.carte.legende), head: 'carte agent smith architecture' });
    for (const g of DOCS.glossaire) INDEX.push({ href: 'glossaire', titre: g.terme, type: 'Glossaire', text: plain(g.def), head: norm(g.terme) });
    for (const it of INDEX) it.ntext = norm(it.text);
  }
  function search(q) {
    const terms = norm(q).split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    const res = [];
    for (const it of INDEX) {
      if (!terms.every(t => it.ntext.includes(t) || it.head.includes(t) || norm(it.titre).includes(t))) continue;
      const score = terms.reduce((s, t) => s + (it.head.includes(t) ? 10 : 0) + (norm(it.titre).includes(t) ? 5 : 0) + Math.min(5, it.ntext.split(t).length - 1), 0);
      res.push({ it, score });
    }
    return res.sort((a, b) => b.score - a.score).slice(0, 40).map(r => r.it);
  }
  function snippet(it, q) {
    const terms = norm(q).split(/\s+/).filter(Boolean);
    const pos = Math.max(0, it.ntext.indexOf(terms[0]));
    const start = Math.max(0, pos - 70);
    let s = (start ? '…' : '') + it.text.slice(start, start + 220) + '…';
    let out = esc(s);
    for (const t of terms) {
      if (t.length < 2) continue;
      const ns = norm(out);
      let acc = '', i = 0, k;
      while ((k = ns.indexOf(t, i)) !== -1) { acc += out.slice(i, k) + '<mark>' + out.slice(k, k + t.length) + '</mark>'; i = k + t.length; }
      out = acc + out.slice(i);
      break;
    }
    return out;
  }
  function viewSearch(q) {
    const r = search(q);
    return '<h1>Recherche : « ' + esc(q) + ' »</h1><p class="muted">' + r.length + ' résultat' + (r.length > 1 ? 's' : '') + ' (les indices sont exclus pour ne rien divulgâcher). Échap pour fermer.</p>' +
      r.map(it => '<a class="res" href="#' + it.href + '"><div class="bloc-tag">' + esc(it.type) + '</div><strong>' + esc(it.titre) + '</strong><div class="muted" style="font-size:14px">' + snippet(it, q) + '</div></a>').join('');
  }

  /* ---------- Routeur ---------- */
  let current = '';
  function route() {
    const hash = decodeURIComponent(location.hash.replace(/^#/, '')) || 'accueil';
    current = hash;
    COPY.length = 0;
    let html, active = hash;
    const m = hash.match(/^ex-(\d+)$/);
    if (m && byId[m[1]]) html = viewExercise(byId[m[1]]);
    else if (['glossaire', 'carte', 'aide-memoire', 'parcours'].includes(hash)) html = viewDoc(hash);
    else { html = viewHome(); active = 'accueil'; }
    $('#main').innerHTML = html;
    renderSidebar(active);
    document.body.classList.remove('nav-open');
    window.scrollTo(0, 0);
    document.title = (m && byId[m[1]] ? byId[m[1]].titre + ' — ' : '') + 'Agent Smith Trainer';
  }

  /* ---------- Toast & modale ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function modal(html, buttons) {
    return new Promise(resolve => {
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '<div class="row">' +
        buttons.map((b, i) => '<button class="' + (b.primary ? 'reveal-btn' : 'tb-btn') + '" data-i="' + i + '">' + esc(b.label) + '</button>').join('') + '</div></div>';
      const close = v => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      const onKey = ev => { if (ev.key === 'Escape') close(null); };
      bg.addEventListener('click', ev => {
        if (ev.target === bg) return close(null);
        const b = ev.target.closest('[data-i]');
        if (b) close(buttons[+b.dataset.i].value);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(bg);
      const f = bg.querySelector('.reveal-btn, button'); if (f) f.focus();
    });
  }

  /* ---------- Export / import ---------- */
  function exportProgress() {
    const payload = JSON.stringify({ app: 'agent-smith-trainer', exportedAt: new Date().toISOString(), data: Store.get() }, null, 2);
    const name = 'agent-smith-progression-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      const blob = new Blob([payload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('Progression exportée : ' + name);
    } catch (e) {
      modal('<h3>Copie ce JSON et garde-le dans un fichier</h3><textarea readonly>' + esc(payload) + '</textarea>', [{ label: 'Fermer', value: null, primary: true }]);
    }
  }
  function merge(a, b) {
    const out = Store.blank();
    for (const id of new Set([...Object.keys(a.done), ...Object.keys(b.done)])) out.done[id] = true;
    for (const id of new Set([...Object.keys(a.hints), ...Object.keys(b.hints)])) out.hints[id] = Math.max(a.hints[id] || 0, b.hints[id] || 0);
    for (const id of new Set([...Object.keys(a.notes), ...Object.keys(b.notes)])) {
      const x = a.notes[id] || '', y = b.notes[id] || '';
      out.notes[id] = !x ? y : !y || x === y || x.includes(y) ? x : x + '\n\n--- importé ---\n' + y;
    }
    out.theme = a.theme;
    return out;
  }
  function importProgress(file) {
    const r = new FileReader();
    r.onload = async () => {
      let parsed;
      try { parsed = JSON.parse(r.result); } catch (e) { toast('Fichier invalide : ce n\'est pas du JSON.'); return; }
      const src = parsed && parsed.data ? parsed.data : parsed;
      if (!src || typeof src !== 'object' || !('done' in src)) { toast('Fichier invalide : progression introuvable.'); return; }
      const incoming = Store.clean(src);
      const n = Object.keys(incoming.done).length;
      const choice = await modal('<h3>Importer une progression</h3><p>Le fichier contient <strong>' + n + '</strong> exercice(s) faits, ' + Object.keys(incoming.notes).length + ' note(s).</p><p class="muted">Fusionner garde le meilleur des deux (exercices faits, indices, notes concaténées). Remplacer écrase ta progression actuelle.</p>',
        [{ label: 'Annuler', value: null }, { label: 'Remplacer', value: 'replace' }, { label: 'Fusionner', value: 'merge', primary: true }]);
      if (!choice) return;
      const cur = Store.get();
      const next = choice === 'merge' ? merge(cur, incoming) : Object.assign(incoming, { theme: cur.theme });
      Store.replace(next);
      route();
      toast('Progression importée (' + (choice === 'merge' ? 'fusion' : 'remplacement') + ').');
    };
    r.onerror = () => toast('Lecture du fichier impossible.');
    r.readAsText(file);
  }

  /* ---------- Événements ---------- */
  let noteTimer;
  document.addEventListener('click', ev => {
    const c = ev.target.closest('[data-copy]');
    if (c) {
      copyText(COPY[+c.dataset.copy] || '').then(ok => {
        if (ok) { c.textContent = 'Copié ✓'; c.classList.add('done'); setTimeout(() => { c.textContent = 'Copier'; c.classList.remove('done'); }, 1500); }
        else toast('Copie impossible : sélectionne le code à la main (Ctrl/Cmd+C).');
      });
      return;
    }
    const d = ev.target.closest('[data-done]');
    if (d) {
      const st = Store.get(), id = d.dataset.done;
      if (st.done[id]) delete st.done[id]; else st.done[id] = true;
      Store.save();
      d.classList.toggle('on', !!st.done[id]);
      d.textContent = st.done[id] ? '✓ Fait' : '○ Marquer comme fait';
      renderSidebar(current);
      if (st.done[id]) toast('Bien joué. Explique ce code à voix haute avant de passer au suivant.');
      return;
    }
    const hb = ev.target.closest('[data-hint]');
    if (hb) {
      const st = Store.get(), id = hb.dataset.hint;
      st.hints[id] = Math.min(3, (st.hints[id] || 0) + 1);
      Store.save();
      const y = window.scrollY; route(); window.scrollTo(0, y);
      return;
    }
    const hr = ev.target.closest('[data-hint-reset]');
    if (hr) {
      delete Store.get().hints[hr.dataset.hintReset]; Store.save();
      const y = window.scrollY; route(); window.scrollTo(0, y);
      return;
    }
    if (ev.target.closest('#menuBtn')) { document.body.classList.toggle('nav-open'); return; }
    if (document.body.classList.contains('nav-open') && !ev.target.closest('#sidebar')) document.body.classList.remove('nav-open');
  });
  document.addEventListener('input', ev => {
    const t = ev.target;
    if (t.matches('textarea[data-notes]')) {
      const id = t.dataset.notes;
      const s = $('#saveState'); if (s) s.textContent = 'Modification…';
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => {
        const st = Store.get();
        if (t.value) st.notes[id] = t.value; else delete st.notes[id];
        Store.save();
        if (s) s.textContent = Store.isPersistent() ? 'Enregistré ✓' : 'Non enregistré (stockage indisponible) — pense à exporter.';
      }, 400);
    }
  });
  let searchTimer;
  const searchInput = $('#search');
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = searchInput.value.trim();
      if (q.length >= 2) { $('#main').innerHTML = viewSearch(q); COPY.length = 0; }
      else route();
    }, 150);
  });
  searchInput.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { searchInput.value = ''; route(); searchInput.blur(); }
    if (ev.key === 'Enter') { const a = $('#main .res'); if (a) { location.hash = a.getAttribute('href'); searchInput.value = ''; } }
  });
  $('#main').addEventListener('click', ev => { if (ev.target.closest('.res')) searchInput.value = ''; });
  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { ev.preventDefault(); searchInput.focus(); }
  });
  $('#themeBtn').addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    Store.get().theme = now; Store.save(); applyTheme();
  });
  $('#exportBtn').addEventListener('click', exportProgress);
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', ev => { const f = ev.target.files[0]; if (f) importProgress(f); ev.target.value = ''; });
  window.addEventListener('hashchange', () => { searchInput.value = ''; route(); });

  /* ---------- Démarrage ---------- */
  applyTheme();
  buildIndex();
  if (!Store.isPersistent()) $('#storageWarn').classList.add('show');
  route();
})();
</script>
</body>
</html>
