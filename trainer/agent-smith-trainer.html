e, il collecte. L'**enfant** est le cobaye jetable — il pose ses limites\npuis exécute le code. Ils ne partagent rien d'autre que trois tuyaux\n(stdin, stdout, stderr) et un code de sortie. Rien de ce que fait l'enfant ne\npeut corrompre l'état du parent.\n\n~~~python parent.py\nimport json, os, signal, subprocess, sys\n\ncharge_json = json.dumps(config).encode()\nproc = subprocess.Popen(\n    [sys.executable, \"-u\", \"child_runner.py\"],\n    stdin=subprocess.PIPE,\n    stdout=subprocess.PIPE,\n    stderr=subprocess.PIPE,\n    start_new_session=True,       # nouveau groupe de processus\n)\ntry:\n    out, err = proc.communicate(charge_json, timeout=timeout_s)\nexcept subprocess.TimeoutExpired:\n    os.killpg(proc.pid, signal.SIGKILL)   # tout le groupe, pas juste le chef\n    out, err = proc.communicate()         # récupère la sortie partielle\n~~~\n\nLe `-u` (ou un `flush` explicite après chaque écriture) est indispensable :\nsur un pipe, stdout est bufferisé par blocs. Sans lui, un `print` suivi d'une\nboucle infinie ne laisse **aucune** trace quand tu tires le SIGKILL.\n\n## Timeout : tuer, pas constater\n\nLe piège central : `proc.wait()` puis comparer l'horloge. Ce n'est pas un\ntimeout, c'est un constat d'après-coup — le code a tourné 30 secondes et\nl'agent est resté bloqué. Il faut une attente **bornée** (`communicate(timeout=\n...)`, ou une boucle de `poll` avec échéance) qui déclenche l'assassinat.\n\n`proc.kill()` ne tue que le chef : un enfant qu'il a lancé (shell, outil MCP)\nsurvit en orphelin. D'où `start_new_session=True` + `killpg`, puis `wait()`\npour **récolter** le zombie, même si tu n'utilises pas son code retour.\n\n## Mémoire et CPU : des limites du noyau\n\nDans l'enfant, **avant** d'exécuter le code utilisateur :\n\n~~~python limites.py\nimport resource\n\noctets = memory_mb * 1024 * 1024\nresource.setrlimit(resource.RLIMIT_AS, (octets, octets))   # espace d'adressage\nresource.setrlimit(resource.RLIMIT_CPU, (secondes, secondes))  # temps CPU\n~~~\n\n| Limite | Ce qu'elle borne | Effet observé |\n|---|---|---|\n| `RLIMIT_AS` | mémoire virtuelle totale du processus | `MemoryError` |\n| `RLIMIT_CPU` | secondes de CPU (pas d'horloge) | processus tué par SIGXCPU |\n| timeout parent | temps réel, bloque aussi un `sleep` | SIGKILL du groupe |\n\nDeux erreurs classiques : poser la limite dans le **parent** (elle s'applique\nà ton propre processus) et oublier que `RLIMIT_CPU` ne compte pas le temps\npassé endormi. C'est le parent qui garantit le timeout réel.\n\n## Réseau : refuser la sortie\n\n`allow_network=False` doit rendre toute connexion impossible. Sans privilèges\nroot, le plus simple est de refuser à l'import (`socket`, `ssl`, `http`,\n`urllib`, `ftplib`…) et/ou de remplacer `socket.socket` par une fonction qui\nlève `PermissionError`. En production, on empile : `unshare -n`, namespace\nréseau vide, ou un conteneur Docker `--network none`. Un filtre Python seul\nn'est pas une barrière contre du code hostile déterminé ; c'est une couche.\n\n> [!] Le code sandboxé peut toujours tenter de contourner tes wrappers via\n> les dunders ou un module oublié. Empile les couches (imports, builtins,\n> processus, noyau) et documente la limite de ton choix en soutenance.\n\n## Fichiers : allowlist de chemins, pas de préfixe\n\nLe code peut lire et écrire, mais uniquement sous `allowed_dirs`. La\nvérification se fait **après résolution** du chemin, jamais sur la chaîne\nbrute :\n\n~~~python chemins.py\nfrom pathlib import Path\n\ncible = Path(chemin).resolve()          # suit les symlinks, normalise \"..\"\nautorise = any(cible.is_relative_to(Path(d).resolve()) for d in allowed_dirs)\n~~~\n\n| Chemin demandé | Verdict | Pourquoi |\n|---|---|---|\n| `/testbed/src/a.py` | autorisé | sous un dossier de l'allowlist |\n| `/testbed-evil/x` | refusé | préfixe texte, mais pas sous-arbre |\n| `/testbed/lien` → `/etc/passwd` | refusé | `resolve()` sort de l'arbre |\n| `../etc/passwd` | refusé | `resolve()` sort de l'arbre |\n\n`str(path).startswith(\"/testbed\")` est **faux** : `/testbed-evil` passe. Et un\nsimple `open(chemin)` sur un chemin non résolu laisse un symlink pointer hors\nde l'allowlist. Il reste une course TOCTOU (le lien peut changer entre la\nvérification et l'ouverture) : la vraie barrière est un montage/chroot, pas\nune fonction Python.\n\n## Ce que le parent renvoie\n\nUne observation unique, exploitable par la boucle de l'agent : `ok`,\n`stdout`, `stderr`, `error` et `timed_out`. `error` reste vide en cas de\nsuccès ; sinon il porte la dernière ligne utile du traceback. La boucle n'a\npas à savoir si l'échec vient d'une limite ou du code : elle réinjecte\nl'observation et itère.\n\nLe parent renvoie ce dictionnaire, qu'il construise `ok` à partir du code\nretour ou qu'il garde `error` pour la boucle de l'agent.\n","enonce":"1. Crée un dossier d'exercice, initialise uv (`uv init --bare`), ajoute pytest\n   (`uv add pytest`), puis copie `isolated_runner.py`, `child_runner.py` et\n   `test_isolation.py`.\n2. `run_isolated(code, timeout_s, memory_mb, allowed_dirs, allow_network=False)`\n   lance l'enfant (`sys.executable -u child_runner.py`) avec stdin/stdout/\n   stderr en pipes et `start_new_session=True`. La configuration part en JSON\n   sur stdin, le code est dedans.\n3. Le parent attend au plus `timeout_s` ; au dépassement il tue le **groupe**\n   (`killpg` + `SIGKILL`), récolte la sortie déjà émise et renvoie\n   `timed_out=True`, `ok=False`.\n4. L'enfant pose `RLIMIT_AS` (mémoire) et `RLIMIT_CPU` (garde-fou) **avant**\n   d'exécuter, puis `exec` le code. Toute exception non attrapée → traceback\n   sur stderr et code de sortie non nul. `RLIMIT_AS` est appliqué sous Linux\n   (environnement 42) ; documente cette hypothèse dans ton README.\n5. `open` reste utilisable, mais uniquement sous `allowed_dirs` :\n   résous le chemin (symlinks et `..`) et compare des sous-arbres, pas des\n   préfixes de chaîne. Hors allowlist → exception explicite. Ce wrapper ne\n   couvre que `open` : `os.open`, `pathlib` et `io` peuvent le contourner ;\n   dis-le et compte sur le processus/conteneur, pas sur ce filtre seul.\n6. `allow_network=False` : `socket` injoignable (import refusé et/ou\n   `socket.socket` qui lève). Ne t'appuie ni sur Docker ni sur root.\n7. Ne perds pas la sortie partielle : un code qui imprime puis boucle doit\n   laisser son stdout dans le résultat, avec `timed_out=True`.\n8. Lance `uv run pytest -q` : les 6 tests doivent passer.\n   Cas limites : code vide, `print` sans `flush` (active `-u` côté enfant),\n   chemin absolu hors allowlist, symlink interne, allocation géante,\n   `sys.exit(0)` (code retour 0, `ok=True`) versus `sys.exit(3)` (`ok=False`),\n   stderr très bavard, timeout à 0,5 s.\n","depart":[{"fichier":"isolated_runner.py","code":"\"\"\"Exécuteur isolé : un enfant jetable, un parent qui surveille.\n\nContrat attendu par les tests :\n    run_isolated(code, timeout_s, memory_mb, allowed_dirs,\n                 allow_network=False) -> dict\navec les clés : ok (bool), stdout (str), stderr (str),\nerror (str | None), timed_out (bool).\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport os\nimport signal\nimport subprocess\nimport sys\nfrom pathlib import Path\n\nENFANT = Path(__file__).with_name(\"child_runner.py\")\n\n\ndef run_isolated(\n    code: str,\n    timeout_s: float,\n    memory_mb: int,\n    allowed_dirs: list[str],\n    allow_network: bool = False,\n) -> dict:\n    # TODO :\n    #   - construire la config JSON {code, memory_mb, allowed_dirs, allow_network}\n    #   - Popen([sys.executable, \"-u\", str(ENFANT)], pipes, start_new_session=True)\n    #   - communicate(timeout=timeout_s) ; TimeoutExpired -> killpg + SIGKILL,\n    #     puis communicate() pour récupérer la sortie partielle\n    #   - renvoyer ok / stdout / stderr / error / timed_out\n    raise NotImplementedError(\"run_isolated à implémenter\")\n"},{"fichier":"child_runner.py","code":"\"\"\"Processus enfant : applique les limites puis exécute le code reçu.\n\nProtocole (tu peux l'adapter, seul le contrat de run_isolated est testé) :\n  stdin  = JSON {\"code\": str, \"memory_mb\": int,\n                 \"allowed_dirs\": [str], \"allow_network\": bool}\n  stdout = sortie du code utilisateur\n  stderr = traceback si le code lève une exception\n  code retour = 0 si tout va bien, 1 sinon\n\"\"\"\nfrom __future__ import annotations\n\nimport builtins\nimport json\nimport os\nimport resource\nimport sys\nimport traceback\nfrom pathlib import Path\n\n\ndef chemin_autorise(chemin: str, allowed_dirs: list[str]) -> bool:\n    # TODO : résoudre le chemin (Path.resolve) et vérifier qu'il est\n    #        sous l'un des dossiers autorisés (sous-arbre, pas préfixe).\n    raise NotImplementedError(\"chemin_autorise à implémenter\")\n\n\ndef executer(code: str, config: dict) -> None:\n    # TODO : limites RLIMIT_AS / RLIMIT_CPU, open restreint aux\n    #        allowed_dirs, refus réseau si allow_network est faux,\n    #        exec du code dans un namespace.\n    raise NotImplementedError(\"executer à implémenter\")\n\n\ndef main() -> int:\n    # TODO : lire et valider la config JSON, appeler executer,\n    #        traceback sur stderr + retour 1 en cas d'exception.\n    raise NotImplementedError(\"child_runner.main à implémenter\")\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}],"indices":["Pense en deux horloges. Celle du parent est la seule qui compte : elle doit\npouvoir interrompre l'attente. Celle de l'enfant ne sert qu'à poser des\ngarde-fous noyau. Et pour la sortie partielle, demande-toi qui lit le pipe\nquand le producteur est tué.\n","`subprocess.Popen(..., start_new_session=True)`, `communicate(input=...,\ntimeout=...)`, `subprocess.TimeoutExpired`, `os.killpg`, `signal.SIGKILL`.\nCôté enfant : `resource.setrlimit(resource.RLIMIT_AS, (n, n))`,\n`Path.resolve()`, `Path.is_relative_to()`, `traceback.format_exc()`,\n`sys.exit`.\n","Parent : encode la config JSON, ouvre l'enfant, `communicate` avec\n`timeout_s`. Sur timeout : `killpg(pid, SIGKILL)`, `communicate()` **une\nseconde fois** pour vider les pipes, `timed_out=True`. Sinon `ok =\nreturncode == 0`, `error` = stderr non vide si échec (sinon vide/None).\nEnfant : lis stdin, mémorise la config, pose `RLIMIT_AS` puis `RLIMIT_CPU`,\nsubstitue un `open` qui résout le chemin et lève si hors arbre, refuse les\nimports réseau quand demandé, `exec` avec un `try/except Exception` qui\nimprime `traceback.format_exc()` sur stderr et renvoie 1.\n"],"pieges":[{"titre":"Vérifier le timeout après coup : `proc.wait()` puis comparer l'horloge.\nLe test « boucle infinie » dure alors jusqu'à la fin des temps.\n","erreur":"# le test ne rend jamais la main (pytest bloqué) ; ou bien :\nE       assert 30.0 < 0.5\n"},{"titre":"Tuer seulement le processus chef avec `proc.kill()` : ses enfants\ncontinuent en orphelins.\n","erreur":"$ ps -o pid,ppid,cmd --ppid <pid_enfant>\n  PID  PPID CMD\n42111     1 python -c '...'        # ppid 1 : orphelin réadopté\n"},{"titre":"Poser `RLIMIT_AS` dans le parent « pour que l'enfant en hérite » : c'est\nle CLI entier qui devient limité.\n","erreur":"MemoryError\n# dans le code du parent, bien après l'exécution sandboxée\n"},{"titre":"Filtrer les chemins par préfixe de chaîne : `/testbed-evil` passe, et un\nsymlink interne vers `/etc/passwd` est lu.\n","erreur":"E       assert True is False\n# test_lecture_autorisee_et_traversal : open(<fichier hors allowlist>) a réussi\n"},{"titre":"Oublier de relire les pipes après le kill : le `print('debut', flush=True)`\nest perdu, `stdout` revient vide.\n","erreur":"E       assert 'debut' in ''\n"}],"verification":{"consigne":"Copie `test_isolation.py` à côté des deux fichiers Python, puis lance la\ncommande. Sur le squelette, les 6 tests échouent (`NotImplementedError`).\npytest ajoute la durée après `6 passed` ; seule la ligne `6 passed` doit\ncorrespondre. Aucun accès réseau, aucun Docker, aucun root.\n","commande":"uv run pytest -q\n","fichiers":[{"nom":"test_isolation.py","code":"import time\n\nfrom isolated_runner import run_isolated\n\n\ndef test_code_normal():\n    r = run_isolated(\"print(6 * 7)\", timeout_s=2, memory_mb=128, allowed_dirs=[])\n    assert r[\"ok\"] is True\n    assert r[\"timed_out\"] is False\n    assert r[\"stdout\"] == \"42\\n\"\n    assert r[\"stderr\"] == \"\"\n    assert not r[\"error\"]\n\n\ndef test_timeout_tue_le_processus():\n    debut = time.monotonic()\n    r = run_isolated(\"while True:\\n    pass\", timeout_s=0.5, memory_mb=128, allowed_dirs=[])\n    duree = time.monotonic() - debut\n    assert r[\"timed_out\"] is True\n    assert r[\"ok\"] is False\n    assert duree < 5\n\n\ndef test_memoire_limitee():\n    code = \"x = bytearray(512 * 1024 * 1024)\\nprint(len(x))\"\n    r = run_isolated(code, timeout_s=5, memory_mb=128, allowed_dirs=[])\n    assert r[\"ok\"] is False\n    assert r[\"timed_out\"] is False\n    assert \"MemoryError\" in r[\"stderr\"]\n\n\ndef test_lecture_autorisee_et_traversal(tmp_path):\n    lisible = tmp_path / \"ok.txt\"\n    lisible.write_text(\"dedans\\n\")\n    secret = tmp_path.parent / \"secret.txt\"\n    secret.write_text(\"hors limite\\n\")\n    lien = tmp_path / \"lien\"\n    lien.symlink_to(\"/etc/passwd\")\n\n    bon = run_isolated(\n        f\"print(open({str(lisible)!r}).read(), end='')\",\n        timeout_s=2,\n        memory_mb=128,\n        allowed_dirs=[str(tmp_path)],\n    )\n    assert bon[\"ok\"] is True\n    assert bon[\"stdout\"] == \"dedans\\n\"\n\n    fuite = run_isolated(\n        f\"open({str(secret)!r}).read()\",\n        timeout_s=2,\n        memory_mb=128,\n        allowed_dirs=[str(tmp_path)],\n    )\n    assert fuite[\"ok\"] is False\n    assert fuite[\"stdout\"] == \"\"\n    assert fuite[\"error\"]\n\n    symlink = run_isolated(\n        f\"open({str(lien)!r}).read()\",\n        timeout_s=2,\n        memory_mb=128,\n        allowed_dirs=[str(tmp_path)],\n    )\n    assert symlink[\"ok\"] is False\n    assert symlink[\"stdout\"] == \"\"\n\n\ndef test_reseau_refuse():\n    code = \"import socket\\ns = socket.socket()\\nprint('connecte')\"\n    r = run_isolated(code, timeout_s=2, memory_mb=128, allowed_dirs=[])\n    assert r[\"ok\"] is False\n    assert r[\"timed_out\"] is False\n    assert r[\"stdout\"] == \"\"\n\n\ndef test_stdout_partiel_apres_timeout():\n    code = \"print('debut', flush=True)\\nwhile True:\\n    pass\"\n    r = run_isolated(code, timeout_s=0.5, memory_mb=128, allowed_dirs=[])\n    assert r[\"timed_out\"] is True\n    assert \"debut\" in r[\"stdout\"]\n"}],"sortie":"6 passed\n"},"bonus":"Ajoute `allow_network=True` et vérifie dans le code sandboxé qu'un socket\nlocal se crée bien (aucun appel sortant). Puis compare avec `unshare -n\npython -c ...` si ta machine le permet : tu vois la différence entre un refus\napplicatif et un namespace réseau. Enfin, lance 20 exécutions et compte les\nprocessus restants : aucun ne doit survivre.\n","lienProjet":"L'agent SWE-bench exécute du code dans un conteneur Docker : c'est la même\nlogique de gardien (timeout, kill du groupe, limites) appliquée à l'échelle\ndu conteneur, et le nettoyage doit tourner même quand la limite est atteinte.\nLe refus réseau et l'allowlist de chemins sont exactement ce que la\nmoulinette vérifie dans les tests d'isolation.\n"},{"id":6,"bloc":"B","titre":"CLI sandbox, config Pydantic, REPL et manuel","niveau":3,"duree":"1 h 45","notions":["argparse","config JSON","Pydantic","valeurs par défaut","REPL","namespace persistant","exit / EOF","manuel d'outils"],"objectif":"Construire le CLI de la sandbox : charger et valider une configuration JSON\navec Pydantic, ouvrir un REPL qui garde son namespace entre les entrées, et\ngénérer dynamiquement le manuel des outils à partir de leurs schémas.\n","cours":"## Pourquoi un CLI et un fichier de configuration\n\nLa sandbox ne doit pas être recompilée pour changer ses limites : la\nmoulinette lance `uv run sandbox sandbox_template.json`, et c'est ce JSON qui\ndécide des imports autorisés, des dossiers accessibles, du timeout et de la\nmémoire. Même code, comportements différents, reproductibles.\n\nModèle mental : le JSON est un **contrat externe**, Pydantic est le\n**portier**. Le portier valide à l'entrée (types, champs, bornes) et refuse\navant que le reste du programme ne travaille avec des données douteuses. Une\nconfig invalide doit produire un message court sur stderr et un code de sortie\nnon nul — pas un traceback de 40 lignes au milieu de l'agent.\n\n~~~json sandbox_template.json\n{\n  \"authorized_imports\": [\"math\", \"collections.*\", \"json\", \"re\"],\n  \"allowed_directories\": [\"/testbed\", \"/tmp/agent\"],\n  \"max_execution_time_seconds\": 30,\n  \"max_memory_mb\": 512\n}\n~~~\n\n| Champ | Rôle | Défaut |\n|---|---|---|\n| `authorized_imports` | allowlist des imports | liste du sujet |\n| `allowed_directories` | racines accessibles au code | `/testbed`, `/tmp/agent` |\n| `max_execution_time_seconds` | durée max d'une exécution | 30 |\n| `max_memory_mb` | RAM max d'une exécution | 512 |\n\nUn fichier partiel est **valide** : Pydantic applique les valeurs par défaut\ndes champs absents. Un fichier avec `\"authorized_imports\": \"math\"` ne l'est\npas : le portier lève `ValidationError` en nommant le champ fautif. Point\nd'entrée : `SandboxConfig.model_validate_json(Path(chemin).read_text())`.\n\n## Le CLI\n\n`argparse` gère les options et l'aide ; les deux transports MCP sont\n**exclusifs** (on ne peut pas brancher stdio et HTTP en même temps). Le\nfichier de config est positionnel et optionnel : sans lui, les défauts.\n\n~~~python cli.py\nparser = argparse.ArgumentParser(prog=\"sandbox\")\nparser.add_argument(\"config\", nargs=\"?\", help=\"fichier de configuration JSON\")\ngroupe = parser.add_mutually_exclusive_group()\ngroupe.add_argument(\"--mcp-stdio\", metavar=\"COMMANDE\")\ngroupe.add_argument(\"--mcp-server\", metavar=\"URL\")\nargs = parser.parse_args()\n~~~\n\nLa découverte réelle des outils MCP arrive à l'exercice 07. Ici tu acceptes\nles deux flags, tu les stockes, et sans serveur connecté la liste d'outils est\nvide : le REPL n'expose alors que les builtins et `final_answer`.\n\n## REPL : une session, pas des exécutions isolées\n\nLe REPL lit une entrée, l'exécute dans le **même** namespace, affiche le\nrésultat ou l'erreur, puis redemande. C'est ce qui permet à l'agent de faire\n`x = 41` puis `print(x + 1)` en deux lignes. Deux sorties distinctes :\n\n- `stdout` : le résultat du code, et rien d'autre ;\n- `stderr` : prompt, messages de log, erreurs — jamais dans stdout.\n\n`compile(entree, \"repl\", \"single\")` affiche automatiquement la valeur d'une\nexpression (via `sys.displayhook`) et n'affiche rien pour `None` : une\naffectation ou un `print` ne produit donc pas de `None` parasite.\n\n~~~python repl.py\nfor ligne in sys.stdin:\n    entree = ligne.rstrip(\"\\n\")\n    if entree.strip() in {\"exit\", \"quit\"}:\n        break\n    if not entree.strip():\n        continue\n    try:\n        objet = compile(entree, \"repl\", \"single\")\n        with contextlib.redirect_stdout(buf_out), contextlib.redirect_stderr(buf_err):\n            exec(objet, namespace)\n    except Exception as exc:\n        print(f\"{type(exc).__name__}: {exc}\", file=sys.stderr)\n    # réémettre buf_out sur stdout, buf_err sur stderr\n~~~\n\nFin de boucle : `exit`, `quit` ou EOF (Ctrl-D). Ctrl-C pendant une exécution\ndoit ramener au prompt sans tuer le CLI : c'est le seul endroit où attraper\n`KeyboardInterrupt`, jamais dans la sandbox elle-même (exercice 04).\n\n## Le manuel : généré, pas écrit à la main\n\nLe manuel est ce que lit le LLM pour savoir quels outils existent et comment\nles appeler. Il est **dérivé des schémas** du serveur MCP connecté : noms,\ndescriptions, paramètres, types, obligatoires ou non. Change de serveur, le\nmanuel change sans toucher au code. `final_answer` est toujours documenté à\npart : ce n'est pas un outil MCP, il appartient à la sandbox.\n\n~~~text manuel\n## run_tests(code: str, test_list: list[str]) -> str\nLance les assertions sur le code candidat. Retourne du JSON.\n\n## final_answer(answer: str) -> None\nTermine la tâche : la chaîne passée devient la solution finale.\n~~~\n\nMême principe dans le REPL : chaque outil découvert devient une fonction\nPython injectée dans le namespace (`run_tests(code=..., test_list=...)`),\nà côté de `final_answer`. Le manuel et les wrappers sortent de la **même**\nsource de vérité : les schémas du serveur.\n\n> [!] Ne mets jamais le prompt ou les logs sur stdout dans un programme\n> destiné à parler stdio : en 07, stdout du serveur MCP transporte le\n> protocole, et un `print` de bienvenue corrompt le flux. Logs sur stderr,\n> toujours.\n","enonce":"1. Crée un dossier d'exercice, copie `sandbox_cli.py` et\n   `sandbox_template.json` (puis `test_cli.py`).\n2. `load_config(chemin)` : sans chemin → `SandboxConfig()` ; avec un JSON →\n   validation Pydantic. Une config invalide affiche un message court sur\n   stderr (nommant le champ) et le CLI sort avec un code non nul.\n3. `main` : `argparse` avec un `config` positionnel optionnel et les flags\n   exclusifs `--mcp-stdio` / `--mcp-server`. Sans MCP, `tools=[]`.\n4. REPL : lis `sys.stdin` ligne par ligne, ignore les lignes vides,\n   sors proprement sur `exit`, `quit` ou EOF. Le **namespace est créé une\n   seule fois** et réutilisé.\n5. Chaque entrée est compilée en mode `\"single\"` puis exécutée : une\n   expression affiche sa valeur (`1 + 1` → `2`), une affectation n'affiche\n   rien, un `print` affiche son texte. Les erreurs vont sur stderr et ne\n   tuent pas la boucle.\n6. `build_manual(tools)` : à partir d'une liste de schémas MCP\n   (`name`, `description`, `inputSchema`), produis un texte markdown qui\n   contient chaque nom d'outil, sa description, ses paramètres avec leur type\n   et le marqueur requis/optionnel. Ajoute toujours `final_answer`.\n7. Injecte `final_answer` (et les wrappers d'outils s'il y en a) dans le\n   namespace du REPL.\n8. Lance `uv run pytest -q` : les 6 tests doivent passer. Cas limites : JSON\n   partiel, type faux, stdin vide, `exit` sans rien avant, expression `None`,\n   code qui écrit sur stderr, Ctrl-D.\n","depart":[{"fichier":"sandbox_cli.py","code":"\"\"\"CLI de la sandbox : configuration JSON, REPL, manuel des outils.\n\nContrat attendu par les tests :\n    load_config(chemin)   -> SandboxConfig\n    build_manual(tools)   -> str\n    main(argv=None)       -> int\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport contextlib\nimport io\nimport json\nimport sys\nfrom pathlib import Path\n\nfrom pydantic import BaseModel, Field\n\nCOMMANDES_SORTIE = {\"exit\", \"quit\"}\n\n\nclass SandboxConfig(BaseModel):\n    authorized_imports: list[str] = Field(\n        default_factory=lambda: [\n            \"math\", \"math.*\",\n            \"collections\", \"collections.*\",\n            \"itertools\", \"re\", \"json\",\n            \"typing\", \"typing.*\",\n            \"functools\", \"operator\",\n            \"heapq\", \"bisect\", \"copy\",\n            \"string\", \"random\",\n            \"datetime\", \"datetime.*\",\n            \"array\", \"cmath\",\n        ]\n    )\n    allowed_directories: list[str] = Field(\n        default_factory=lambda: [\"/testbed\", \"/tmp/agent\"]\n    )\n    max_execution_time_seconds: int = 30\n    max_memory_mb: int = 512\n\n\ndef load_config(chemin: str | None) -> SandboxConfig:\n    # TODO : None -> SandboxConfig() ; sinon lire le JSON et le valider.\n    #        Propager l'erreur au main pour un message court sur stderr.\n    raise NotImplementedError(\"load_config à implémenter\")\n\n\ndef build_manual(tools: list[dict]) -> str:\n    # TODO : manuel markdown depuis name / description / inputSchema\n    #        (+ final_answer toujours présent).\n    raise NotImplementedError(\"build_manual à implémenter\")\n\n\ndef executer(entree: str, namespace: dict) -> tuple[str, str]:\n    # TODO : compile(mode=\"single\") + exec, capture (stdout, stderr).\n    #        Branche ici la sandbox de l'exercice 04 si tu l'as :\n    #        chaque entrée doit subir les mêmes restrictions.\n    raise NotImplementedError(\"executer à implémenter\")\n\n\ndef repl(config: SandboxConfig, tools: list[dict]) -> int:\n    # TODO : namespace créé une fois, prompt sur stderr, boucle stdin,\n    #        exit/quit/EOF, réémission propre des sorties.\n    raise NotImplementedError(\"repl à implémenter\")\n\n\ndef main(argv: list[str] | None = None) -> int:\n    # TODO : argparse (config positionnel optionnel, --mcp-stdio /\n    #        --mcp-server exclusifs), validation, lancement du REPL.\n    raise NotImplementedError(\"main à implémenter\")\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"},{"fichier":"sandbox_template.json","code":"{\n  \"authorized_imports\": [\n    \"math\", \"math.*\",\n    \"collections\", \"collections.*\",\n    \"itertools\", \"re\", \"json\",\n    \"typing\", \"typing.*\",\n    \"functools\", \"operator\",\n    \"heapq\", \"bisect\", \"copy\",\n    \"string\", \"random\",\n    \"datetime\", \"datetime.*\",\n    \"array\", \"cmath\"\n  ],\n  \"allowed_directories\": [\"/testbed\", \"/tmp/agent\"],\n  \"max_execution_time_seconds\": 30,\n  \"max_memory_mb\": 512\n}\n"}],"indices":["Sépare trois responsabilités qui n'ont rien à voir : charger/valider la\nconfig (au démarrage), boucler sur l'entrée (au runtime), décrire les outils\n(une fonction pure, testable sans lancer de CLI). Et demande-toi qui, du\nprompt ou du résultat, a le droit d'apparaître sur stdout.\n","`argparse.ArgumentParser`, `add_mutually_exclusive_group`,\n`nargs=\"?\"`. `SandboxConfig.model_validate_json`, `ValidationError`.\n`compile(entree, \"repl\", \"single\")`, `sys.stdin`, `contextlib.redirect_stdout`.\nPour le manuel : `schema[\"inputSchema\"][\"properties\"]` et\n`schema[\"inputSchema\"].get(\"required\", [])`.\n","Config : aucun chemin → instance par défaut ; sinon lire le fichier, valider,\net dans le main attraper l'erreur pour écrire un message d'une ligne sur\nstderr + retour 2. REPL : crée le namespace avant la boucle ; pour chaque\nligne, sors si `exit`/`quit`, ignore le vide, compile en `single`, exécute\ndans le namespace en redirigeant stdout et stderr dans deux tampons, puis\nrecopie le tampon de sortie sur stdout et celui d'erreur sur stderr (ou\naffiche l'exception sur stderr). Manuel : une section par outil avec son nom,\nsa description, puis chaque propriété du schéma avec son type et le fait\nqu'elle soit requise, et une section `final_answer`.\n"],"pieges":[{"titre":"Écrire le prompt ou les logs sur stdout : le REPL « marche » à l'œil mais\nla sortie n'est plus parsable.\n","erreur":"$ echo '1 + 1' | python sandbox_cli.py\n>>> 2\n>>>            # attendu : \"2\\n\" exactement sur stdout\n"},{"titre":"Recréer le namespace à chaque entrée du REPL : impossible de faire deux\nlignes dépendantes.\n","erreur":"NameError: name 'x' is not defined\n# après une première entrée \"x = 41\"\n"},{"titre":"Lire le JSON et accéder directement à une clé sans passer par le modèle :\nune config partielle explose.\n","erreur":"KeyError: 'authorized_imports'\n"},{"titre":"Ignorer la validation : un champ de mauvais type passe, et la sandbox\ncasse plus tard, loin de la vraie cause.\n","erreur":"E       assert 0 != 0\n# test_config_invalide_rejetee : le CLI a accepté \"authorized_imports\": \"math\"\n"},{"titre":"Écrire le manuel à la main ou le laisser vide : le LLM ne voit pas les\noutils du serveur connecté.\n","erreur":"E       assert 'run_tests' in '# Manuel de la sandbox\\n'\n"}],"verification":{"consigne":"Copie `test_cli.py` à côté de `sandbox_cli.py`, puis lance la commande. Sur\nle squelette, les 6 tests échouent (`NotImplementedError` ou CLI qui plante).\npytest ajoute la durée après `6 passed` ; seule la ligne `6 passed` doit\ncorrespondre. Aucun réseau ni Docker. Pour l'usage réel `uv run sandbox`,\najoute `sandbox = \"sandbox_cli:main\"` dans `[project.scripts]` de ton\n`pyproject.toml` ; les tests lancent directement `python sandbox_cli.py`.\n","commande":"uv run pytest -q\n","fichiers":[{"nom":"test_cli.py","code":"import json\nimport subprocess\nimport sys\nfrom pathlib import Path\n\nRACINE = Path(__file__).resolve().parent\nCLI = RACINE / \"sandbox_cli.py\"\n\n\ndef lancer(entree: str, *args: str) -> subprocess.CompletedProcess:\n    return subprocess.run(\n        [sys.executable, str(CLI), *args],\n        input=entree,\n        capture_output=True,\n        text=True,\n        timeout=20,\n        cwd=RACINE,\n    )\n\n\ndef test_config_par_defaut():\n    p = lancer(\"print('ok')\\n\")\n    assert p.returncode == 0\n    assert p.stdout == \"ok\\n\"\n\n\ndef test_config_invalide_rejetee(tmp_path):\n    mauvais = tmp_path / \"config.json\"\n    mauvais.write_text(json.dumps({\"authorized_imports\": \"math\"}))\n    p = lancer(\"\", str(mauvais))\n    assert p.returncode != 0\n    assert p.stdout == \"\"\n    assert \"authorized_imports\" in p.stderr\n\n\ndef test_expression_puis_eof():\n    p = lancer(\"1 + 1\\n\")\n    assert p.returncode == 0\n    assert p.stdout == \"2\\n\"\n\n\ndef test_namespace_persistant():\n    p = lancer(\"x = 41\\nprint(x + 1)\\nexit\\n\")\n    assert p.returncode == 0\n    assert p.stdout == \"42\\n\"\n\n\ndef test_exit_arrete_la_boucle():\n    p = lancer(\"print('avant')\\nexit\\nprint('apres')\\n\")\n    assert p.returncode == 0\n    assert p.stdout == \"avant\\n\"\n    assert \"apres\" not in p.stdout\n\n\ndef test_manuel_dynamique():\n    tools = [\n        {\n            \"name\": \"run_tests\",\n            \"description\": \"Lance les assertions sur le code candidat.\",\n            \"inputSchema\": {\n                \"type\": \"object\",\n                \"properties\": {\n                    \"code\": {\"type\": \"string\"},\n                    \"test_list\": {\"type\": \"array\", \"items\": {\"type\": \"string\"}},\n                },\n                \"required\": [\"code\", \"test_list\"],\n            },\n        },\n        {\n            \"name\": \"read_file\",\n            \"description\": \"Lit un fichier du testbed.\",\n            \"inputSchema\": {\n                \"type\": \"object\",\n                \"properties\": {\"path\": {\"type\": \"string\"}},\n                \"required\": [\"path\"],\n            },\n        },\n    ]\n    import sandbox_cli\n\n    manuel = sandbox_cli.build_manual(tools)\n    assert \"run_tests\" in manuel\n    assert \"code\" in manuel\n    assert \"test_list\" in manuel\n    assert \"read_file\" in manuel\n    assert \"path\" in manuel\n    assert \"final_answer\" in manuel\n"}],"sortie":"6 passed\n"},"bonus":"Ajoute une commande `--check` qui charge la config, affiche le manuel et sort\nsans ouvrir de REPL : parfait pour un script de CI. Puis gère les entrées\nmulti-lignes (bloc `def ...` collé d'un coup) en continuant à lire tant que\n`compile` renvoie `SyntaxError: unexpected EOF while parsing`. Enfin, rends le\nprompt conditionnel avec `sys.stdin.isatty()`.\n","lienProjet":"C'est exactement le point d'entrée que la moulinette utilise : `uv run\nsandbox sandbox_template.json` avec un serveur MCP stdio ou HTTP branché. Le\nmanuel généré ici devient la section « outils » du system prompt de l'agent,\net le REPL est ce que tu montreras en soutenance pour prouver que ta sandbox\nest utilisable seule, hors boucle d'agent.\n"},{"id":7,"bloc":"C","titre":"Serveur MCP (stdio + HTTP)","niveau":4,"duree":"2 h","notions":["MCP","JSON-RPC 2.0","stdio vs streamable HTTP","tools / resources / prompts","schémas JSON","FastMCP / mcp[cli]","logs sur stderr","TESTBED_PATH"],"objectif":"Écrire un serveur MCP qui expose l'outil `run_tests`, une resource et un prompt,\nle lancer en stdio puis en streamable HTTP, et le piloter depuis un client MCP\ndans un test hors ligne.\n","cours":"## Pourquoi un protocole, pas un simple import ?\n\nTon agent doit lire `/testbed`, lancer des tests, interroger Docker. Si tu importes\nces fonctions directement, le code généré par le LLM et tes outils partagent le même\nprocessus : une ligne de code peut appeler un outil sans passer par le sandbox, et\nton agent devient impossible à brancher sur un autre serveur.\n\n**MCP (Model Context Protocol)** est un protocole **JSON-RPC 2.0** : le client (ton\nagent) et le serveur (tes outils) échangent des messages JSON. Les deux peuvent\nvivre dans des processus, des machines ou des langages différents. Le serveur\nexpose trois familles de primitives :\n\n| primitive | rôle | côté client |\n|---|---|---|\n| `tool` | action typée avec des arguments | `session.call_tool(\"run_tests\", {...})` |\n| `resource` | donnée lisible par URI | `session.read_resource(\"mbpp://instructions\")` |\n| `prompt` | gabarit de message pour le LLM | `session.get_prompt(\"solve_mbpp\", {...})` |\n\nLe serveur publie pour chaque outil un **schéma JSON** (nom, description, types des\nparamètres) : c'est exactement ce que ton agent lit pour générer le manuel de\nsandbox (exercice 06), et ce que le LLM lit pour savoir appeler l'outil.\n\nUn outil MCP est **d'abord une fonction Python** : le décorateur l'enregistre et\nrenvoie la fonction inchangée. Tu peux donc la tester sans passer par le protocole.\n\n~~~python example_tool.py\nfrom mcp.server.mcpserver import MCPServer  # SDK MCP 2.x\n\nmcp = MCPServer(\"demo\")\n\n@mcp.tool()\ndef add(a: int, b: int) -> int:\n    \"\"\"Additionne deux entiers.\"\"\"\n    return a + b\n\nif __name__ == \"__main__\":\n    mcp.run()      # transport stdio par défaut\n~~~\n\nLe SDK 1.x appelait cette classe `FastMCP` (`from mcp.server.fastmcp import FastMCP`) ;\nles décorateurs sont identiques. Installe le paquet avec `uv add \"mcp[cli]\"`.\n\n## stdio ou streamable HTTP ?\n\n| transport | qui lance le serveur | quand l'utiliser |\n|---|---|---|\n| `stdio` | le client, en sous-processus | moulinette, tests locaux (`uv run python mcp_tools_mbpp.py`) |\n| `streamable-http` | toi, en serveur web | plusieurs clients, debug à distance (`mcp.run(transport=\"streamable-http\")`) |\n\nEn stdio, **stdout est le canal du protocole** : chaque ligne écrite doit être un\nmessage JSON-RPC. Le moindre `print(\"debug\")` casse le flux. Les logs vont sur\n**stderr** :\n\n~~~python logging_setup.py\nimport logging\nimport sys\n\nlogging.basicConfig(level=logging.INFO, stream=sys.stderr,\n                    format=\"%(levelname)s %(message)s\")\n# sans logging : print(\"debug\", file=sys.stderr)\n~~~\n\n> [x] Un `print` au démarrage du serveur produit côté client\n> `Failed to parse JSONRPC message from server` puis\n> `Invalid JSON: expected value at line 1 column 1` : `initialize()` échoue.\n\n## Le client, côté test\n\n~~~python client.py\nimport asyncio\nimport sys\nfrom pathlib import Path\n\nfrom mcp import ClientSession, StdioServerParameters\nfrom mcp.client.stdio import stdio_client\n\nSERVER = Path(__file__).with_name(\"mcp_tools_mbpp.py\")\n\nasync def main() -> None:\n    params = StdioServerParameters(command=sys.executable, args=[str(SERVER)])\n    async with stdio_client(params) as (read, write):\n        async with ClientSession(read, write) as session:\n            await session.initialize()                 # handshake obligatoire\n            tools = await session.list_tools()\n            print([tool.name for tool in tools.tools])\n            result = await session.call_tool(\n                \"run_tests\", {\"code\": \"x = 1\", \"test_list\": []})\n            print(result.content[0].text)\n\nasyncio.run(main())\n~~~\n\n`await session.initialize()` est le handshake : sans lui, toute requête lève\n`MCPError: Invalid request parameters`. Les `async with` ferment proprement le\nsous-processus ; en stdio, c'est le seul nettoyage dont tu es responsable.\n\n## Ce que ton serveur doit exposer\n\n- un outil `run_tests(code, test_list)` qui exécute le code candidat puis chaque\n  assertion et renvoie **toujours** un JSON `{\"success\": bool, \"output\": str}`,\n  même en cas d'échec ou de timeout. Une exception qui traverse le protocole\n  devient `Error executing tool run_tests` (`isError: true`, message générique) :\n  l'agent ne saura pas ce qui a échoué ;\n- une resource `mbpp://instructions` : le mode d'emploi que l'agent peut lire ;\n- un prompt `solve_mbpp(task_definition)` : le gabarit de message envoyé au LLM ;\n- un lancement en stdio par défaut, et `--http` pour le streamable HTTP.\n\n> [!] Le serveur tourne **hors** du sandbox : le code exécuté par `run_tests`\n> n'est pas protégé par tes allowlists. Exécute-le dans un **sous-processus**\n> (`python -I`) avec un `timeout`, jamais dans le processus du serveur.\n\nEnfin, la moulinette lance ton serveur avec ses variables d'environnement (pour\nSWE-bench : `TESTBED_PATH`) : lis `os.environ`, ne code jamais `/testbed` en dur.\n","enonce":"1. Crée le projet : `uv init --python 3.10 ex07`, puis dans `ex07`\n   `uv add \"mcp[cli]\"` et `uv add --dev pytest`.\n2. Copie le squelette `mcp_tools_mbpp.py`, puis enregistre `run_tests` avec le\n   décorateur `@mcp.tool()`. La signature reste `run_tests(code, test_list)`.\n3. `run_tests` exécute le code candidat puis **chaque** assertion dans un\n   sous-processus (`python -I -c ...`, `input=` le payload JSON, `timeout=30`).\n   Il renvoie `json.dumps({\"success\": bool, \"output\": str})` : `success` est vrai\n   seulement si tout passe ; `output` contient le texte d'erreur, ou la chaîne\n   vide `\"\"` quand tout passe.\n4. Traite les cas limites : `test_list` vide (succès), `SyntaxError` dans le code\n   (échec), `AssertionError` (échec), code trop long (timeout → échec), code qui\n   écrit sur stdout (capturé, pas mélangé au protocole).\n5. Déclare la resource `mbpp://instructions` : elle renvoie **exactement**\n   `MBPP: appelle run_tests(code, test_list) puis final_answer(code).`\n6. Déclare le prompt `solve_mbpp(task_definition)` : il renvoie la consigne\n   `Résous ce problème MBPP et termine par final_answer(code).`, une ligne vide,\n   puis `task_definition`.\n7. Tous les logs du serveur passent par `sys.stderr` ; aucun `print` sur stdout.\n8. Sous `__main__`, lance `mcp.run()` en stdio ; si `--http` est dans `sys.argv`,\n   lance `mcp.run(transport=\"streamable-http\")` (port 8000).\n9. Copie `test_mcp.py`, vérifie qu'il échoue sur le squelette, puis qu'il passe.\n10. Cas limite de test : chaque test démarre un serveur neuf ; si un test bloque,\n   c'est que le serveur a écrit sur stdout ou n'a pas répondu au handshake.\n","depart":[{"fichier":"mcp_tools_mbpp.py","code":"\"\"\"Serveur MCP des outils MBPP (exercice 07).\n\nLancement : uv run python mcp_tools_mbpp.py\n\"\"\"\nfrom __future__ import annotations\n\ntry:  # SDK MCP 2.x : MCPServer, anciennement FastMCP\n    from mcp.server.mcpserver import MCPServer as FastMCP\nexcept ImportError:  # SDK MCP 1.x\n    from mcp.server.fastmcp import FastMCP\n\nmcp = FastMCP(\"mbpp-tools\")\n\n\ndef run_tests(code: str, test_list: list[str]) -> str:\n    \"\"\"Exécute code contre test_list ; renvoie un JSON {\"success\": bool, \"output\": str}.\"\"\"\n    # TODO: enregistrer cette fonction avec @mcp.tool()\n    # TODO: exécuter code puis chaque assertion dans un sous-processus\n    #       (python -I, input JSON, timeout=30) et renvoyer json.dumps(...)\n    raise NotImplementedError\n\n\ndef instructions() -> str:\n    \"\"\"Contenu de la resource mbpp://instructions.\"\"\"\n    # TODO: décorer avec @mcp.resource(\"mbpp://instructions\")\n    # TODO: renvoyer exactement le texte du contrat (voir l'énoncé, étape 5).\n    raise NotImplementedError\n\n\ndef solve_mbpp(task_definition: str) -> str:\n    \"\"\"Contenu du prompt solve_mbpp.\"\"\"\n    # TODO: décorer avec @mcp.prompt()\n    # TODO: renvoyer la consigne exacte, une ligne vide, puis task_definition.\n    raise NotImplementedError\n\n\ndef main() -> None:\n    # TODO: si \"--http\" dans sys.argv, mcp.run(transport=\"streamable-http\")\n    # TODO: sinon mcp.run()  (stdio par défaut)\n    raise NotImplementedError\n\n\nif __name__ == \"__main__\":\n    main()\n"}],"indices":["Un outil MCP n'est qu'une fonction Python décorée : commence par faire marcher\n`run_tests` en l'appelant directement, hors protocole. Puis regarde ce que renvoie\n`session.list_tools()` : s'il est vide, le décorateur `@mcp.tool()` manque.\n","`@mcp.tool()`, `@mcp.resource(\"mbpp://instructions\")`, `@mcp.prompt()` ; côté client\n`ClientSession`, `StdioServerParameters`, `stdio_client`, `session.initialize()`.\nPour isoler l'exécution : `subprocess.run([sys.executable, \"-I\", \"-c\", RUNNER],\ninput=payload, capture_output=True, text=True, timeout=30)` puis `json.dumps`.\nLes logs : `print(..., file=sys.stderr)`.\n","Run_tests : construis un petit script `RUNNER` qui lit un JSON sur stdin, fait\n`exec(compile(code, ...), ns)` puis `exec` de chaque assertion dans le même\nnamespace, attrape `BaseException` et imprime `{\"success\": false, \"output\":\nf\"{type(exc).__name__}: {exc}\"}` ; si tout passe, `{\"success\": true, \"output\":\n\"\"}`. Sur `TimeoutExpired`, renvoie un JSON d'échec. Resource : renvoie la\nphrase exacte de l'énoncé. Prompt : consigne, `\"\\n\\n\"`, `task_definition`.\n`main` : branche sur `\"--http\" in sys.argv`, sinon `mcp.run()`.\n"],"pieges":[{"titre":"Un `print` de debug dans le serveur : stdout est le canal JSON-RPC.\n","erreur":"Failed to parse JSONRPC message from server\npydantic_core._pydantic_core.ValidationError: 1 validation error for union[...]\nInvalid JSON: expected value at line 1 column 1\n"},{"titre":"Laisser une exception traverser l'outil au lieu de renvoyer un JSON d'erreur :\nle client reçoit un message générique et le test plante sur `json.loads`.\n","erreur":"mcp.server.mcpserver.exceptions.UnexpectedToolError: Error executing tool run_tests\njson.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0)\n"},{"titre":"Oublier `await session.initialize()`, ou appeler un outil dont le décorateur a\nété oublié.\n","erreur":"MCPError: Invalid request parameters\nUnknown tool: run_tests\n"},{"titre":"Lancer l'exécution du code candidat dans le processus du serveur : un code qui\nboucle bloque le serveur et le test ne rend jamais la main (ou tue le serveur).\n","erreur":"pytest reste bloqué sur test_call_run_tests_success (aucune sortie, aucun timeout)\n"},{"titre":"Écrire le serveur en croyant qu'il sera lancé par `uv run python mcp_tools_mbpp.py`\navec un chemin relatif, alors que le client le lance depuis un autre dossier.\n","erreur":"FileNotFoundError: [Errno 2] No such file or directory: 'mcp_tools_mbpp.py'\n"}],"verification":{"consigne":"Dans un dossier `ex07`, copie `mcp_tools_mbpp.py` et `test_mcp.py` à la racine du\nprojet. Lance ensuite les commandes. Le `sed` ne garde que le verdict de pytest ;\nrelance sans `sed` pour voir le détail des échecs.\n","commande":"cd ex07\n# dépendances déjà ajoutées à l'étape 1 : uv add \"mcp[cli]\" && uv add --dev pytest\n# copie mcp_tools_mbpp.py et test_mcp.py ici\nuv run pytest -q test_mcp.py | sed -E 's/ in [0-9.]+s$//'\n","fichiers":[{"nom":"test_mcp.py","code":"\"\"\"Auto-vérification de l'exercice 07 — serveur MCP MBPP en stdio.\"\"\"\nimport asyncio\nimport json\nimport sys\nfrom pathlib import Path\n\nfrom mcp import ClientSession, StdioServerParameters\nfrom mcp.client.stdio import stdio_client\n\nSERVER = Path(__file__).with_name(\"mcp_tools_mbpp.py\")\nINSTRUCTIONS = \"MBPP: appelle run_tests(code, test_list) puis final_answer(code).\"\nPROMPT = \"Résous ce problème MBPP et termine par final_answer(code).\\n\\n\"\nGOOD = \"def add(a, b):\\n    return a + b\\n\"\nBAD = \"def add(a, b):\\n    return a - b\\n\"\nTESTS = [\"assert add(1, 2) == 3\"]\n\n\ndef call_server(scenario):\n    async def run():\n        params = StdioServerParameters(command=sys.executable, args=[str(SERVER)])\n        async with stdio_client(params) as (read, write):\n            async with ClientSession(read, write) as session:\n                await session.initialize()\n                return await scenario(session)\n\n    return asyncio.run(run())\n\n\ndef test_list_tools():\n    async def scenario(session):\n        result = await session.list_tools()\n        noms = [tool.name for tool in result.tools]\n        assert \"run_tests\" in noms\n        assert \"final_answer\" not in noms\n\n    call_server(scenario)\n\n\ndef test_call_run_tests_success():\n    async def scenario(session):\n        result = await session.call_tool(\n            \"run_tests\", {\"code\": GOOD, \"test_list\": TESTS})\n        payload = json.loads(result.content[0].text)\n        assert payload[\"success\"] is True\n        assert isinstance(payload[\"output\"], str)\n\n    call_server(scenario)\n\n\ndef test_call_run_tests_failure():\n    async def scenario(session):\n        result = await session.call_tool(\n            \"run_tests\", {\"code\": BAD, \"test_list\": TESTS})\n        payload = json.loads(result.content[0].text)\n        assert payload[\"success\"] is False\n        assert \"AssertionError\" in payload[\"output\"]\n\n    call_server(scenario)\n\n\ndef test_resource_instructions():\n    async def scenario(session):\n        listing = await session.list_resources()\n        assert \"mbpp://instructions\" in [str(r.uri) for r in listing.resources]\n        content = await session.read_resource(\"mbpp://instructions\")\n        assert content.contents[0].text == INSTRUCTIONS\n\n    call_server(scenario)\n\n\ndef test_prompt_solve_mbpp():\n    async def scenario(session):\n        listing = await session.list_prompts()\n        assert \"solve_mbpp\" in [p.name for p in listing.prompts]\n        result = await session.get_prompt(\n            \"solve_mbpp\", {\"task_definition\": \"Écris add(a, b).\"})\n        assert result.messages[0].content.text == PROMPT + \"Écris add(a, b).\"\n\n    call_server(scenario)\n"}],"sortie":"5 passed\n"},"bonus":"Écris un test HTTP : lance le serveur avec `--http` sur un port choisi par variable\nd'environnement et connecte-toi avec `streamable_http_client` du SDK MCP pour vérifier\n`list_tools`. Compare le cycle de vie : en stdio le client possède le processus, en\nHTTP il faut prévoir l'arrêt du serveur et le port déjà utilisé.\n","lienProjet":"Dans Agent Smith, `mcp_tools_mbpp.py` et `mcp_tools_swebench.py` sont les deux serveurs\nque ton agent lance et dont il découvre les outils. Chaque outil découvert devient une\nfonction Python injectée dans le namespace du sandbox ; c'est ce qui permet au LLM\nd'écrire `run_tests(...)` ou `read_file(...)` comme du code ordinaire. Le prompt et la\nresource servent au manuel de sandbox (exercice 06), et la moulinette teste ces outils\nindépendamment de ta boucle d'agent.\n"},{"id":8,"bloc":"C","titre":"Outils obligatoires SWE-bench","niveau":4,"duree":"2 h 30","notions":["read_file (cat -n)","edit_file exact","search_code chemin:ligne","définitions et références","run_tests et get_patch","run_command et workdir","TESTBED_PATH","sécurité des chemins"],"objectif":"Implémenter les neuf outils obligatoires du sujet SWE-bench avec des contrats de\nsortie exacts, les tester hors MCP sur un mini-dépôt, et les protéger des chemins\nhors testbed et des sorties géantes.\n","cours":"## Pourquoi des contrats aussi précis ?\n\nCes neuf outils sont testés **indépendamment** de ton agent : la moulinette appelle\n`read_file`, `search_code`, `get_patch`… et compare la sortie au caractère près. Un\nagent peut « réussir » avec un outil approximatif ; un outil hors contrat fait échouer\nl'examen. La sortie d'un outil est une **API**, pas un message de debug.\n\nTous les chemins partent de la racine du dépôt, exposée par **`TESTBED_PATH`** : la\nmoulinette exporte cette variable avant de lancer ton serveur MCP. Lis-la à chaque\nappel avec `os.environ`, jamais au chargement du module, et refuse tout chemin qui\nsort de cette racine.\n\n| outil | sortie attendue |\n|---|---|\n| `read_file(filepath, start_line, end_line)` | lignes numérotées `N: contenu`, 1-based, sans saut final |\n| `edit_file(filepath, old_str, new_str)` | remplacement unique ; renvoie `remplacement effectué dans <chemin absolu résolu>` |\n| `list_files(directory, pattern)` | chemins relatifs triés, un par ligne |\n| `search_code(pattern, file_pattern)` | `/chemin/absolu.py:12 contenu` |\n| `search_function_or_class_definition_in_code(name)` | même format |\n| `find_references(name, filepath, line)` | même format, sans la définition |\n| `run_tests()` | JSON `{\"success\": bool, \"output\": str}` |\n| `get_patch()` | `git -c core.fileMode=false diff` |\n| `run_command(command, workdir)` | JSON `{\"exit_code\": int, \"stdout\": str, \"stderr\": str}` |\n\n~~~python formats.py\n# read_file : numéro 1-based, deux-points, espace, contenu tel quel\n\"1: \\\"\\\"\\\"Petites fonctions mathématiques.\\\"\\\"\\\"\"\n\"2: \"\n\"4: def add(a, b):\"\n\n# search_code : chemin ABSOLU, deux-points, numéro, espace, contenu (indentation intacte)\n\"/testbed/src/math_utils.py:4 def add(a, b):\"\n\"/testbed/src/app.py:5     return add(x, x)\"\n\n# get_patch : la commande exacte, exécutée dans TESTBED_PATH\nsubprocess.run([\"git\", \"-c\", \"core.fileMode=false\", \"diff\"],\n               cwd=testbed, capture_output=True, text=True)\n~~~\n\nLe format `chemin:ligne contenu` n'est pas décoratif : le LLM peut alors demander\n`read_file(\"src/math_utils.py\", 4, 4)` pour voir précisément ce qu'il a trouvé. Un\nchemin relatif, un séparateur `-` ou une indentation supprimée cassent le contrat.\n\n`git -c core.fileMode=false diff` est imposé : sans l'option, un `chmod` exécuté\npendant la session ajoute des lignes `old mode` / `new mode` au patch, qui ne\ns'applique plus proprement.\n\n## Les quatre réflexes\n\n- **Chemins** : `Path(...).resolve()` puis vérifier que le résultat est sous\n  `TESTBED_PATH` (`relative_to` ou `commonpath`). Compare des chemins **résolus**,\n  sinon un symlink `escape.py` vers `/etc/passwd` passe.\n- **Troncature** : une recherche peut renvoyer 800 lignes. Coupe à ~20 000 caractères\n  avec un marqueur `...[tronqué]` ; sinon tu brûles les 300 k tokens de SWE-bench en\n  une requête.\n- **Temps** : `timeout` sur tout `subprocess.run`. Une commande bloquée fige le\n  serveur, et l'agent dépasse les 900 s de la tâche.\n- **Erreurs** : renvoie un message utile, par exemple\n  `old_str doit apparaître exactement une fois (occurrences: 2)`, plutôt qu'une\n  traceback.\n\n> [!] Ces outils tournent **hors du sandbox** : ce sont des fonctions Python de ton\n> serveur MCP. Ne laisse jamais un chemin ou un motif fourni par le LLM être interpolé\n> dans une chaîne shell. Pour `run_command`, le shell est voulu (`|`, `&&`) ; pour les\n> autres, construis les arguments de `subprocess` sans `shell=True`.\n\n## MCP, Docker, local : le même contrat\n\nGarde les fonctions **pures et importables** : aucun import lourd en haut de\n`mcp_tools_swebench.py`, l'enveloppe MCP de l'exercice 07 les expose telles quelles.\nC'est ce qui permet de les tester avec `pytest`, sans serveur et sans Docker.\n\nEn SWE-bench, ces fonctions s'exécutent via `docker exec` dans le conteneur du testbed ;\nen développement, elles tournent sur le dépôt hôte. `TESTBED_PATH` désigne la racine\ndans les deux cas, ce qui rend le même code utilisable partout. `run_tests` exécute le\nscript d'évaluation : dans le projet, il arrive dans `eval_script` ; en local, on\nconvient que `eval.sh` à la racine du testbed joue ce rôle (sinon `pytest -q`).\n","enonce":"1. Crée le projet (`uv init --python 3.10 ex08`, puis `uv add --dev pytest`) et copie\n   le squelette `mcp_tools_swebench.py`.\n2. Écris un helper qui lit `TESTBED_PATH` **à chaque appel** et lève\n   `RuntimeError(\"TESTBED_PATH non défini\")` s'il manque, puis un helper qui résout un\n   chemin et lève `ValueError(f\"chemin hors du testbed: {chemin}\")` sinon.\n3. `read_file` : format `f\"{n}: {ligne}\"` (1-based, espace final sur ligne vide),\n   `start_line` borné à 1, `end_line` borné à la taille, chaîne vide si la plage est\n   vide ou hors fichier, pas de saut de ligne final.\n4. `edit_file` : remplace `old_str` **une seule fois** ; en cas de succès, renvoie\n   exactement `remplacement effectué dans {chemin absolu résolu}` (le test le vérifie).\n   Lève `ValueError` si 0 ou 2+ occurrences\n   (message `old_str doit apparaître exactement une fois (occurrences: N)`),\n   si `old_str` est vide, ou si le chemin sort du testbed. Préserve les fins de ligne\n   (`open(..., newline=\"\")`), sinon tout le fichier apparaît modifié dans le patch.\n5. `list_files` : parcours récursif trié, chemins relatifs à `TESTBED_PATH` en `/`,\n   ignore `.git`, `__pycache__`, `.venv`, `node_modules` ; chaîne vide si rien.\n6. `search_code` : `re.search` sur chaque ligne des fichiers `file_pattern` (`*.py` par\n   défaut), chemins absolus, tri par chemin puis numéro, fichiers non UTF-8 ignorés.\n7. `search_function_or_class_definition_in_code(name)` : reconnaît `def`, `async def`\n   et `class`, nom en mot entier, même format.\n8. `find_references(name, filepath, line)` : usages en mot entier, exclut les lignes de\n   définition et le point `(filepath, line)` s'il est fourni.\n9. `run_tests` : lance `bash eval.sh` s'il existe à la racine, sinon\n   `python -m pytest -q`, avec `timeout=600` ; JSON `{\"success\", \"output\"}`.\n10. `get_patch` : `git -c core.fileMode=false diff` dans `TESTBED_PATH`, renvoie le\n    diff brut (chaîne vide si rien).\n11. `run_command` : `workdir` résolu et vérifié, `shell=True`, `timeout=120`, JSON\n    `{\"exit_code\", \"stdout\", \"stderr\"}`.\n12. Garde le module importable sans le SDK MCP (import du serveur dans un bloc\n    `if __name__ == \"__main__\"`), puis branche les neuf fonctions sur ton serveur de\n    l'exercice 07 sans les réécrire.\n13. Cas limites : fichier vide, `start_line > end_line`, chemin absolu dans le\n    testbed, symlink qui sort, motif regex invalide (`re.error` explicite), commande\n    qui écrit sur stderr, script d'évaluation qui échoue.\n","depart":[{"fichier":"mcp_tools_swebench.py","code":"\"\"\"Outils MCP SWE-bench (exercice 08).\n\nToutes les fonctions lisent le dépôt via TESTBED_PATH. Garde ce module\nimportable sans effet de bord : les tests appellent les fonctions directement.\n\"\"\"\nfrom __future__ import annotations\n\n\ndef read_file(filepath: str, start_line: int = 1, end_line: int | None = None) -> str:\n    \"\"\"Lit filepath et renvoie les lignes numérotées « N: contenu ».\"\"\"\n    # TODO: résoudre le chemin dans TESTBED_PATH, refuser l'extérieur,\n    #       lire le fichier et formater chaque ligne f\"{n}: {ligne}\".\n    raise NotImplementedError\n\n\ndef edit_file(filepath: str, old_str: str, new_str: str) -> str:\n    \"\"\"Remplace old_str par new_str ; renvoie le chemin du fichier modifié.\"\"\"\n    # TODO: compter les occurrences, lever ValueError sinon, remplacer une fois,\n    #       écrire sans normaliser les fins de ligne, renvoyer\n    #       f\"remplacement effectué dans {chemin_resolu}\".\n    raise NotImplementedError\n\n\ndef list_files(directory: str = \".\", pattern: str = \"*\") -> str:\n    \"\"\"Liste les fichiers sous directory dont le nom correspond à pattern.\"\"\"\n    # TODO: parcours récursif trié, chemins relatifs à TESTBED_PATH.\n    raise NotImplementedError\n\n\ndef search_code(pattern: str, file_pattern: str = \"*.py\") -> str:\n    \"\"\"Recherche grep-like ; renvoie « /chemin/absolu:ligne contenu » par ligne.\"\"\"\n    # TODO: re.search ligne par ligne, ignorer les fichiers binaires.\n    raise NotImplementedError\n\n\ndef search_function_or_class_definition_in_code(name: str) -> str:\n    \"\"\"Trouve la définition d'une fonction ou d'une classe.\"\"\"\n    # TODO: même format que search_code ; gérer async def et les classes.\n    raise NotImplementedError\n\n\ndef find_references(name: str, filepath: str = \"\", line: int = 0) -> str:\n    \"\"\"Trouve les usages d'un symbole, en excluant sa définition.\"\"\"\n    # TODO: mot entier, exclure les lignes def/class name et le point (filepath, line).\n    raise NotImplementedError\n\n\ndef run_tests() -> str:\n    \"\"\"Exécute le script d'évaluation du testbed ; JSON {success, output}.\"\"\"\n    # TODO: eval.sh à la racine s'il existe, sinon python -m pytest -q.\n    raise NotImplementedError\n\n\ndef get_patch() -> str:\n    \"\"\"Renvoie le git diff unifié des modifications du testbed.\"\"\"\n    # TODO: subprocess avec \"git -c core.fileMode=false diff\" dans TESTBED_PATH.\n    raise NotImplementedError\n\n\ndef run_command(command: str, workdir: str = \".\") -> str:\n    \"\"\"Exécute une commande dans workdir ; JSON {exit_code, stdout, stderr}.\"\"\"\n    # TODO: workdir doit être dans TESTBED_PATH ; shell, timeout, capture.\n    raise NotImplementedError\n\n\nif __name__ == \"__main__\":\n    # TODO: exposer ces fonctions via un serveur MCP (voir exercice 07), puis mcp.run().\n    raise SystemExit(\"branche les outils sur un serveur MCP (exercice 07)\")\n"}],"indices":["Commence par les formats, pas par la sécurité : écris à la main trois sorties\nattendues (`read_file`, `search_code`, `get_patch`) puis fais-les produire par le\ncode. Les huit tests échouent tant que les fonctions lèvent `NotImplementedError`.\n","`os.environ`, `pathlib.Path` (`resolve`, `relative_to`, `rglob`, `as_posix`),\n`open(..., encoding=\"utf-8\", newline=\"\")`, `re`/`re.escape`, `subprocess.run(...,\ncapture_output=True, text=True, timeout=...)`, `json.dumps`. Pour les binaires :\n`except UnicodeDecodeError: continue`.\n","Centralise deux helpers : `_testbed()` qui lit `TESTBED_PATH` à chaque appel, et\n`_resolve()` qui rend le chemin absolu puis vérifie `relative_to(root)` (lève\nValueError). read_file : `splitlines`, borne `max(1, start)` et `min(len, end)`,\njointure des lignes formatées. edit_file : `text.count(old_str)` doit valoir 1,\npuis `replace(..., 1)` et écriture avec `newline=\"\"`. list_files/search : rglob\ntrié, sauter les dossiers techniques et les fichiers non décodables, accumuler\n`f\"{chemin_absolu}:{num} {contenu}\"`. run_tests/get_patch/run_command : trois\n`subprocess.run` avec `cwd`, `timeout`, puis `json.dumps` pour les deux premiers.\n"],"pieges":[{"titre":"Numéroter les lignes à partir de 0 (ou oublier l'espace après les deux-points).\n","erreur":"AssertionError: assert '0: \"\"\"Petites fonctions mathématiques.\"\"\"' == '1: \"\"\"Petites fonctions mathématiques.\"\"\"'\n"},{"titre":"Remplacer un `old_str` présent plusieurs fois : le patch touche la mauvaise ligne\net le test attend une erreur explicite.\n","erreur":"ValueError: old_str doit apparaître exactement une fois (occurrences: 2)\n"},{"titre":"Lire tous les fichiers en UTF-8 strict sans gérer les binaires du dépôt.\n","erreur":"UnicodeDecodeError: 'utf-8' codec can't decode byte 0xff in position 9: invalid start byte\n"},{"titre":"Utiliser `git diff` sans `core.fileMode=false` : un `chmod` ajoute des lignes de\nmode dans le patch et la comparaison échoue.\n","erreur":"old mode 100644\nnew mode 100755\n"},{"titre":"Oublier `TESTBED_PATH` et coder `/testbed` en dur (ou résoudre au chargement du\nmodule, avant que le test pose la variable).\n","erreur":"RuntimeError: TESTBED_PATH non défini\nFileNotFoundError: [Errno 2] No such file or directory: '/testbed/src/math_utils.py'\n"}],"verification":{"consigne":"Dans un dossier `ex08`, copie `mcp_tools_swebench.py` et `test_tools.py`. Le test\ncrée lui-même le mini-dépôt (fonctions, fichier binaire, `eval.sh`, dépôt git) dans\nun dossier temporaire et pose `TESTBED_PATH` : aucun Docker, aucun réseau.\nRelance sans `sed` pour voir le détail d'un échec.\n","commande":"cd ex08\n# dépendances déjà ajoutées à l'étape 1 : uv add --dev pytest\n# copie mcp_tools_swebench.py et test_tools.py ici\nuv run pytest -q test_tools.py | sed -E 's/ in [0-9.]+s$//'\n","fichiers":[{"nom":"test_tools.py","code":"\"\"\"Auto-vérification de l'exercice 08 — outils SWE-bench hors MCP.\"\"\"\nimport json\nimport os\nimport subprocess\nfrom pathlib import Path\n\nimport pytest\n\nimport mcp_tools_swebench as tools\n\nMATH = '''\"\"\"Petites fonctions mathématiques.\"\"\"\n\n\ndef add(a, b):\n    \"\"\"Additionne deux entiers.\"\"\"\n    return a + b\n\n\ndef sub(a, b):\n    return a - b\n'''\n\nAPP = \"from math_utils import add\\n\\n\\ndef double(x):\\n    return add(x, x)\\n\"\n\nREADME = \"# Démo\\n\\nExemple de dépôt.\\n\"\n\n\ndef expected_math(root):\n    return \"\\n\".join([\n        '1: \"\"\"Petites fonctions mathématiques.\"\"\"',\n        \"2: \",\n        \"3: \",\n        \"4: def add(a, b):\",\n        '5:     \"\"\"Additionne deux entiers.\"\"\"',\n        \"6:     return a + b\",\n        \"7: \",\n        \"8: \",\n        \"9: def sub(a, b):\",\n        \"10:     return a - b\",\n    ])\n\n\n@pytest.fixture\ndef repo(tmp_path, monkeypatch):\n    root = tmp_path / \"testbed\"\n    (root / \"src\").mkdir(parents=True)\n    (root / \"src\" / \"math_utils.py\").write_text(MATH, encoding=\"utf-8\")\n    (root / \"src\" / \"app.py\").write_text(APP, encoding=\"utf-8\")\n    (root / \"src\" / \"binary.py\").write_bytes(b\"def fake():\\n\\xff\\xfe\\n\")\n    (root / \"README.md\").write_text(README, encoding=\"utf-8\")\n    (root / \"eval.sh\").write_text('#!/bin/sh\\necho \"1 passed\"\\nexit 0\\n', encoding=\"utf-8\")\n    monkeypatch.setenv(\"TESTBED_PATH\", str(root))\n    return root\n\n\n@pytest.fixture\ndef git_repo(repo):\n    subprocess.run([\"git\", \"init\", \"-q\"], cwd=repo, check=True)\n    subprocess.run([\"git\", \"add\", \"-A\"], cwd=repo, check=True)\n    subprocess.run(\n        [\"git\", \"-c\", \"user.email=t@t\", \"-c\", \"user.name=t\", \"commit\", \"-qm\", \"init\"],\n        cwd=repo, check=True)\n    return repo\n\n\ndef test_read_file_format(repo):\n    assert tools.read_file(\"src/math_utils.py\") == expected_math(repo)\n\n\ndef test_read_file_range_and_security(repo):\n    assert tools.read_file(\"src/math_utils.py\", 4, 6) == \"\\n\".join([\n        \"4: def add(a, b):\",\n        '5:     \"\"\"Additionne deux entiers.\"\"\"',\n        \"6:     return a + b\",\n    ])\n    assert tools.read_file(\"src/math_utils.py\", 9) == \"9: def sub(a, b):\\n10:     return a - b\"\n    assert tools.read_file(\"src/math_utils.py\", 0, 2) == (\n        '1: \"\"\"Petites fonctions mathématiques.\"\"\"\\n2: ')\n    assert tools.read_file(\"src/math_utils.py\", 20, 30) == \"\"\n\n    outside = repo.parent / \"outside.py\"\n    outside.write_text(\"secret\\n\", encoding=\"utf-8\")\n    (repo / \"escape.py\").symlink_to(outside)\n    for bad in (\"/etc/passwd\", \"../outside.py\", \"escape.py\"):\n        with pytest.raises(ValueError, match=\"hors du testbed\"):\n            tools.read_file(bad)\n\n\ndef test_list_files(repo):\n    assert tools.list_files(\"src\", \"*.py\") == \"src/app.py\\nsrc/binary.py\\nsrc/math_utils.py\"\n    assert tools.list_files(\".\", \"*.md\") == \"README.md\"\n    assert tools.list_files(\"src\", \"*.rs\") == \"\"\n\n\ndef test_search_code(repo):\n    app = str((repo / \"src\" / \"app.py\").resolve())\n    math = str((repo / \"src\" / \"math_utils.py\").resolve())\n    assert tools.search_code(r\"def \\w+\\(\", \"*.py\") == \"\\n\".join([\n        f\"{app}:4 def double(x):\",\n        f\"{math}:4 def add(a, b):\",\n        f\"{math}:9 def sub(a, b):\",\n    ])\n    assert tools.search_code(\"introuvable\", \"*.py\") == \"\"\n\n\ndef test_definitions_and_references(repo):\n    app = str((repo / \"src\" / \"app.py\").resolve())\n    math = str((repo / \"src\" / \"math_utils.py\").resolve())\n    assert tools.search_function_or_class_definition_in_code(\"add\") == f\"{math}:4 def add(a, b):\"\n    assert tools.search_function_or_class_definition_in_code(\"double\") == f\"{app}:4 def double(x):\"\n    assert tools.find_references(\"add\", math, 4) == \"\\n\".join([\n        f\"{app}:1 from math_utils import add\",\n        f\"{app}:5     return add(x, x)\",\n    ])\n    assert tools.find_references(\"double\", app, 4) == \"\"\n\n\ndef test_edit_file(repo):\n    target = (repo / \"src\" / \"math_utils.py\").resolve()\n    assert tools.edit_file(\"src/math_utils.py\", \"return a + b\", \"return b + a\") == (\n        f\"remplacement effectué dans {target}\")\n    content = (repo / \"src\" / \"math_utils.py\").read_text(encoding=\"utf-8\")\n    assert \"return b + a\" in content\n    assert \"return a + b\" not in content\n    with pytest.raises(ValueError, match=\"exactement une fois\"):\n        tools.edit_file(\"src/math_utils.py\", \"return\", \"RETURN\")\n    with pytest.raises(ValueError, match=\"exactement une fois\"):\n        tools.edit_file(\"src/math_utils.py\", \"introuvable\", \"x\")\n\n    crlf = repo / \"src\" / \"crlf.py\"\n    crlf.write_bytes(b\"def f():\\r\\n    return 1\\r\\n\")\n    tools.edit_file(\"src/crlf.py\", \"return 1\", \"return 2\")\n    assert crlf.read_bytes() == b\"def f():\\r\\n    return 2\\r\\n\"\n\n\ndef test_get_patch(git_repo):\n    assert tools.get_patch() == \"\"\n    app = git_repo / \"src\" / \"app.py\"\n    app.write_text(app.read_text(encoding=\"utf-8\") + \"\\ndef triple(x):\\n    return add(x, add(x, x))\\n\",\n                   encoding=\"utf-8\")\n    os.chmod(app, 0o755)\n    patch = tools.get_patch()\n    assert \"diff --git a/src/app.py b/src/app.py\" in patch\n    assert \"+++ b/src/app.py\" in patch\n    assert \"+def triple(x):\" in patch\n    assert \"old mode\" not in patch\n    assert \"new mode\" not in patch\n\n\ndef test_execution_tools(repo):\n    out = json.loads(tools.run_command(\"echo hello && echo err >&2\", \".\"))\n    assert out == {\"exit_code\": 0, \"stdout\": \"hello\\n\", \"stderr\": \"err\\n\"}\n    assert json.loads(tools.run_command(\"false\", \"src\"))[\"exit_code\"] == 1\n    with pytest.raises(ValueError, match=\"hors du testbed\"):\n        tools.run_command(\"echo x\", \"/tmp\")\n\n    result = json.loads(tools.run_tests())\n    assert result[\"success\"] is True\n    assert \"1 passed\" in result[\"output\"]\n\n    (repo / \"eval.sh\").write_text(\"#!/bin/sh\\necho boom\\nexit 3\\n\", encoding=\"utf-8\")\n    result = json.loads(tools.run_tests())\n    assert result[\"success\"] is False\n    assert \"boom\" in result[\"output\"]\n"}],"sortie":"8 passed\n"},"bonus":"Ajoute un outil `search_symbol_usages` qui renvoie, pour une fonction, chaque appel\navec deux lignes de contexte au-dessus et en dessous, et tronque proprement. Puis\ncompare `git diff` et `git -c core.fileMode=false diff` après un `chmod` : le diff\ncorrect reste applicable avec `git apply --check`.\n","lienProjet":"Ces neuf outils sont exactement ceux que la moulinette teste un par un et que ton\nagent SWE-bench appellera pour explorer un vrai dépôt : sans eux, pas de lecture de\nfichier, pas de recherche de symbole, pas de patch. Dans le projet, ils sont exposés\npar `mcp_tools_swebench.py` et exécutés par `docker exec` dans le conteneur du testbed ;\n`TESTBED_PATH` rend le même code utilisable sur l'hôte pendant le développement.\n"},{"id":9,"bloc":"D","titre":"Agent MBPP de bout en bout","niveau":4,"duree":"2 h 30","notions":["MBPPTaskInput","outil run_tests","final_answer(code)","limites MBPP : 10 / 6 000 / 1 500 / 120 s","solution.json","moulinette validate","stratégie de debug","critère 4 sur 5"],"objectif":"Assembler un agent complet qui reçoit une tâche MBPP au format `MBPPTaskInput`, boucle\nThought → Code → Observation avec l'outil `run_tests`, rend la main par `final_answer(code)`\net écrit un `solution.json` conforme, dans les limites 10 itérations / 6 000 tokens d'entrée /\n1 500 de sortie / 120 s.\n","cours":"## Un contrat, trois commandes\n\nMBPP (Mostly Basic Python Problems) : une **fonction** à écrire depuis une définition en anglais,\navec des tests publics. L'interface est fournie ; tout le travail est de boucler proprement et de\nproduire un fichier accepté par la moulinette.\n\n~~~json mbpp_task.json\n{\n  \"task_id\": 7,\n  \"task_definition\": \"Write a function to find the shared elements from two given tuples.\",\n  \"function_definition\": \"def similar_elements(test_tup1, test_tup2):\",\n  \"test_imports\": [\"from itertools import combinations\"],\n  \"test_list\": [\"assert similar_elements((1, 2, 3), (1, 2, 4)) == (1, 2)\"]\n}\n~~~\n\nLe dump **saute le premier test** (`test_list[1:]`) : il reste caché pour la validation. Un agent\nqui ne fait passer que les tests visibles peut « réussir » localement puis échouer au vrai contrôle.\n\n| Étape | Commande (depuis `moulinette/`) | Ce qu'elle prouve |\n|---|---|---|\n| dump | `uv run moulinette_eval dump mbpp --output ../cache/task.json` | le format d'entrée |\n| run | `uv run python -m agent_mbpp --task-file ../cache/task.json --output ../cache/solution.json ...` | le budget respecté |\n| validate | `uv run moulinette_eval validate mbpp ../cache/task.json ../cache/solution.json` | code **et** métriques |\n\n## Budgéter avant de coder\n\nLes limites sont **dures et cumulées sur la tâche**, pas par requête :\n\n| Métrique | Limite |\n|---|---|\n| itérations | 10 |\n| tokens d'entrée | 6 000 |\n| tokens de sortie | 1 500 |\n| temps | 120 s |\n\nChaque itération renvoie l'historique complet : les tokens d'entrée **croissent vite**. Un system\nprompt de 1 500 tokens ne laisse que 4 500 tokens pour 10 tours. `total_input_tokens` est la\n**somme** des `input_tokens` des `StepMetrics`. Les tokens de raisonnement comptent aussi.\n\n> [!] `success` est une **déclaration**, pas une preuve : la moulinette relance ton code sur\n> **tous** les tests (dont le caché) et recalcule les métriques.\n\n## final_answer et run_tests\n\n`run_tests(code, test_list)` est un outil MCP : il exécute le code **hors sandbox** et renvoie une\nchaîne JSON avec `success` et `output`. `final_answer` est fourni par la sandbox : il **capture**\nson argument et arrête la boucle. Pour MBPP, tu appelles `final_answer(code)`.\n\n~~~python\nresult = run_tests(code=\"def similar_elements(a, b):\\n    return tuple(set(a) & set(b))\",\n                   test_list=task.test_list)\nprint(result)  # {\"success\": true, \"output\": \"\"}\nfinal_answer(\"def similar_elements(a, b):\\n    return tuple(set(a) & set(b))\")\n~~~\n\nNe renvoie pas le code par `print` : la boucle ne le verra pas. N'appelle `final_answer` qu'après\nun `run_tests` vert, sinon tu soumets une hypothèse.\n\n## solution.json : la preuve exigée\n\n~~~json solution.json\n{\n  \"task_id\": \"7\", \"benchmark\": \"mbpp\", \"success\": true,\n  \"solution\": \"def similar_elements(test_tup1, test_tup2):\\n    return tuple(set(test_tup1) & set(test_tup2))\",\n  \"iterations\": 3, \"total_requests\": 3,\n  \"total_input_tokens\": 2450, \"total_output_tokens\": 620, \"total_time_seconds\": 41.2,\n  \"steps\": [{\"step\": 1, \"input_tokens\": 700, \"output_tokens\": 180,\n             \"request_time_ms\": 1200.0, \"api_url\": \"https://provider/v1\",\n             \"model_name\": \"model/name\", \"llm_output\": \"Let's test the function first.\",\n             \"sandbox_input\": \"result = run_tests(code, task.test_list)\",\n             \"sandbox_output\": \"{\\\"success\\\": true, \\\"output\\\": \\\"\\\"}\", \"retries\": 0}],\n  \"system_prompt\": \"You are a code agent. Tools: run_tests, final_answer.\",\n  \"error\": null\n}\n~~~\n\n`task_id` est une **chaîne** (`\"7\"`), `benchmark` vaut exactement `\"mbpp\"`, et chaque `step` porte\n`llm_output`, `sandbox_input`, `sandbox_output` : la trace qui prouve ton exploration.\n\n## Debug : lis les 3–5 premiers pas\n\n1. **Outil jamais appelé** : `sandbox_input` ne mentionne pas `run_tests` — le prompt ne documente\n   pas assez les outils.\n2. **Observation hallucinée** : `llm_output` prétend que les tests passent sans `run_tests` — la\n   génération n'est pas coupée à la fin du bloc de code.\n3. **Boucle qui tourne** : même `sandbox_input` à deux pas consécutifs — l'observation n'est pas\n   réinjectée dans l'historique.\n\n> [ok] Corrige le **prompt** ou la **réinjection d'observation**, pas les tokens d'abord.\n\n## Critère 4 sur 5\n\nL'examen tire 5 tâches et en exige **4**, sans seconde chance : une tâche ratée n'est pas rejouée.\nReste simple sur les prompts et sors tôt quand `run_tests` passe — chaque itération en plus coûte\ndu budget et peut casser une solution qui marchait.\n","enonce":"1. Crée `ex09` (Python 3.10+, `uv init`, `uv add pydantic pytest`) et copie `models.py` fourni\n   **tel quel** : il définit `MBPPTaskInput`, `StepMetrics` et `SolutionOutput` (champs exacts).\n2. Dans `agent_mbpp.py`, implémente `load_task(path) -> MBPPTaskInput` : lecture JSON, validation\n   Pydantic, `FileNotFoundError` naturelle si le fichier est absent.\n3. Implémente `build_user_prompt(task) -> str` : `task_definition`, `function_definition`, chaque\n   assertion de `test_list`, et un rappel des outils `run_tests` et `final_answer`.\n4. Garde la Protocol `AgentLike` du squelette : ton agent de l'exercice 03 expose\n   `run(task) -> SolutionOutput`, ce qui suffit pour injecter une doublure dans les tests.\n5. Implémente `solve(task, agent) -> SolutionOutput` : appelle `agent.run(task)`, normalise\n   (`benchmark=\"mbpp\"`, `task_id=str(task.task_id)`, `solution.strip()`, `system_prompt` recopié),\n   puis contrôle les limites avec `check_limits`.\n6. Si une limite est dépassée, si `solution` ou `steps` est vide : renvoie une **copie** avec\n   `success=False` et un `error` explicite, sans lever d'exception. Chaque message de\n   `check_limits` contient le nom du champ **en anglais** (`iterations`,\n   `total_input_tokens`, `total_output_tokens`, `total_time_seconds`) et la limite\n   numérique (ex. `iterations > 10`, `total_input_tokens > 6000`) ; `error` reprend ces\n   messages.\n7. `check_limits(sol) -> list[str]` renvoie la liste des dépassements, vide si tout tient ;\n   les bornes exactes (10, 6 000, 1 500, 120.0) sont **acceptées**. Un dépassement de\n   `total_input_tokens` produit un message contenant `6000` (ou `6 000`).\n8. `main(argv)` : `argparse` avec `--task-file`, `--output`, `--model-name`, `--provider-url` ;\n   charge, `make_agent(args)`, `solve`, écrit `solution.json` avec `model_dump_json(indent=2)` et\n   renvoie 0. Fichier introuvable : message sur `stderr` et code 2.\n9. Vérifie avec pytest : le squelette doit échouer, ta version passer (`6 passed`).\n10. Bonus en ligne seulement : lance l'agent sur une vraie tâche dumpée et compare `iterations`,\n    tokens et temps aux limites.\n\nCas limites : `test_list` vide (prompt valide quand même), solution faite d'espaces (invalide),\n`total_time_seconds` pile 120.0 (accepté), `steps` vide (invalide), `task_id` entier (refusé).\n","depart":[{"fichier":"models.py","code":"# ABOUTME: Recopié de models_public.py (moulinette) — fourni tel quel pour l'exercice.\nfrom datetime import datetime\nfrom typing import List, Optional\n\nfrom pydantic import BaseModel, Field\n\n\nclass StepMetrics(BaseModel):\n    \"\"\"Metrics for a single agent step (one LLM generate -> sandbox execute cycle).\"\"\"\n\n    step: int = Field(..., description=\"1-indexed iteration number\")\n    input_tokens: int\n    output_tokens: int\n    request_time_ms: float\n    timestamp: str = Field(default_factory=lambda: datetime.now().isoformat())\n    api_url: str = Field(default=\"\")\n    model_name: str = Field(default=\"\")\n    llm_output: str = Field(default=\"\")\n    sandbox_input: str = Field(default=\"\")\n    sandbox_output: str = Field(default=\"\")\n    retries: int = Field(default=0)\n\n\nclass SolutionOutput(BaseModel):\n    \"\"\"Output required by the moulinette (solution.json).\"\"\"\n\n    task_id: str\n    benchmark: str\n    success: bool\n    solution: str\n    iterations: int\n    total_requests: int\n    total_input_tokens: int\n    total_output_tokens: int\n    total_time_seconds: float\n    steps: List[StepMetrics] = Field(default_factory=list)\n    system_prompt: str = Field(default=\"\")\n    error: Optional[str] = Field(default=None)\n    timestamp: str = Field(default_factory=lambda: datetime.now().isoformat())\n\n\nclass MBPPTaskInput(BaseModel):\n    \"\"\"Input for MBPP task evaluation, provided by the moulinette.\"\"\"\n\n    task_id: int\n    task_definition: str\n    function_definition: str\n    test_imports: List[str] = Field(default_factory=list)\n    test_list: List[str] = Field(default_factory=list)\n"},{"fichier":"agent_mbpp.py","code":"\"\"\"Agent MBPP : charge une tâche, fait tourner l'agent, écrit solution.json.\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib import Path\nfrom typing import Protocol\n\nfrom models import MBPPTaskInput, SolutionOutput\n\nMAX_ITERATIONS = 10\nMAX_INPUT_TOKENS = 6_000\nMAX_OUTPUT_TOKENS = 1_500\nMAX_TIME_SECONDS = 120.0\n\n\nclass AgentLike(Protocol):\n    \"\"\"Interface minimale attendue : ton Agent de l'exercice 03.\"\"\"\n\n    system_prompt: str\n\n    def run(self, task: MBPPTaskInput) -> SolutionOutput:\n        \"\"\"Fait tourner la boucle et renvoie une SolutionOutput brute.\"\"\"\n\n\ndef load_task(path: str | Path) -> MBPPTaskInput:\n    \"\"\"Charge et valide la tâche MBPP depuis un fichier JSON.\"\"\"\n    # TODO: Path(path).read_text + MBPPTaskInput.model_validate_json (laisse remonter FileNotFoundError)\n    raise NotImplementedError\n\n\ndef build_user_prompt(task: MBPPTaskInput) -> str:\n    \"\"\"Construit la consigne envoyée à l'agent (définition, signature, tests, outils).\"\"\"\n    # TODO: inclure task_definition, function_definition, chaque test de test_list,\n    #       et documenter run_tests / final_answer\n    raise NotImplementedError\n\n\ndef check_limits(sol: SolutionOutput) -> list[str]:\n    \"\"\"Renvoie la liste des dépassements de limites ([] si tout tient).\"\"\"\n    # TODO: comparer iterations, total_input_tokens, total_output_tokens, total_time_seconds\n    raise NotImplementedError\n\n\ndef solve(task: MBPPTaskInput, agent: AgentLike) -> SolutionOutput:\n    \"\"\"Exécute l'agent puis renvoie une SolutionOutput normalisée pour MBPP.\"\"\"\n    # TODO: agent.run(task), normalisation des champs, check_limits,\n    #       success=False + error si problème (sans lever d'exception)\n    raise NotImplementedError\n\n\ndef make_agent(args: argparse.Namespace) -> AgentLike:\n    \"\"\"Instancie ton agent (LLM + sandbox + outils) depuis les options du CLI.\"\"\"\n    # TODO: clés API via os.environ, jamais en dur\n    raise NotImplementedError\n\n\ndef main(argv: list[str] | None = None) -> int:\n    \"\"\"CLI : --task-file --output --model-name --provider-url.\"\"\"\n    # TODO: argparse, load_task, make_agent, solve, écriture solution.json, codes retour\n    raise NotImplementedError\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"}],"indices":["Le fichier de tâche est déjà au format `MBPPTaskInput` : la première étape est de le lire et\nde le valider, pas de le réécrire. Demande-toi ensuite combien d'itérations le budget autorise\net ce qui doit figurer dans `solution.json` pour que la moulinette l'accepte.\n","Pydantic : `MBPPTaskInput.model_validate_json(Path(path).read_text())` valide en une ligne et\nconserve les types (attention, `task_id` est un entier en entrée). Pour renvoyer une copie\nmodifiée sans muter l'original : `sol.model_copy(update={...})`. Pour écrire le fichier :\n`sol.model_dump_json(indent=2)` ; `json.dump` ne sait pas sérialiser un modèle.\n","`solve` : lis la tâche, délègue la boucle à `agent.run(task)`, force `benchmark=\"mbpp\"`,\n`task_id=str(task.task_id)` et `system_prompt=agent.system_prompt`, découpe la solution.\n`check_limits` compare les quatre totaux aux quatre constantes ; s'il y a au moins un\ndépassement (ou solution/steps vides), renvoie une copie avec `success=False` et un `error`\nqui liste les problèmes. `main` : parse les quatre options, attrape `FileNotFound
