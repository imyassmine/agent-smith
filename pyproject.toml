[project]
name = "agent-smith"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.6",       
    "python-dotenv>=1.0",  
	"mcp>=1.9,<2",
    "httpx>=0.28",
]

[project.scripts]
sandbox = "sandbox.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_mbpp",
    "src/agent_swebench",
    "src/core",
    "src/sandbox",
    "src/llm",
    "src/tools",
    "src/models",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
